let AC=null,master=null,seaGain=null,on=false,hbPhase=0,NOISE=null;
function audio(){
  if(AC) return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  const len=AC.sampleRate*2;
  NOISE=AC.createBuffer(1,len,AC.sampleRate);
  const d=NOISE.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=NOISE; src.loop=true;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
  seaGain=AC.createGain(); seaGain.gain.value=0;
  src.connect(lp).connect(seaGain).connect(master); src.start();
  setInterval(()=>{
    if(!on||!seaGain) return;
    const now=AC.currentTime;
    seaGain.gain.cancelScheduledValues(now);
    seaGain.gain.setTargetAtTime(.04+Math.random()*.04,now,1.7);
  },2600);
  return AC;
}
function out(pan){
  if(!AC) return null;
  if(!pan||!AC.createStereoPanner) return master;
  const p=AC.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,pan)); p.connect(master); return p;
}
function nburst(o){
  if(!on||!AC) return;
  const now=AC.currentTime,dur=o.dur;
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  s.playbackRate.value=.8+Math.random()*.4;
  const f=AC.createBiquadFilter(); f.type=o.type||'bandpass';
  f.frequency.setValueAtTime(o.f0,now);
  f.frequency.exponentialRampToValueAtTime(Math.max(40,o.f1),now+dur);
  f.Q.value=o.q||1;
  const g=AC.createGain(), atk=o.atk||dur*.26;
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,o.vol),now+atk);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  s.connect(f).connect(g).connect(out(o.pan)); s.start(now); s.stop(now+dur+.04);
}
function vtone(o){
  if(!on||!AC) return;
  const now=AC.currentTime,dur=o.dur;
  const osc=AC.createOscillator(); osc.type=o.type||'sawtooth';
  osc.frequency.setValueAtTime(o.f0,now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),now+dur);
  if(o.wobble){
    const w=AC.createOscillator(); w.type='sine'; w.frequency.value=o.wobRate||7.5;
    const wg=AC.createGain(); wg.gain.value=o.wobble;
    w.connect(wg).connect(osc.frequency); w.start(now); w.stop(now+dur+.05);
  }
  const f=AC.createBiquadFilter();
  f.type=o.filterType||'lowpass'; f.frequency.value=o.cut||700; f.Q.value=o.q||1;
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,o.vol),now+(o.atk||dur*.22));
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  osc.connect(f).connect(g).connect(out(o.pan)); osc.start(now); osc.stop(now+dur+.04);
}
let breathPhase=0,breathIn=true;
function breathing(dt,exertion,dread,hurt){
  if(!on||!AC) return;
  const rate=.38+exertion*.30+dread*.72+hurt*.55;
  breathPhase+=dt*rate;
  const lvl=.075+dread*.135+exertion*.060+hurt*.075;
  if(breathIn&&breathPhase>=.46){
    breathIn=false;
    nburst({dur:.40+.16*(1-dread),type:'bandpass',f0:520,f1:220,q:1.0,vol:lvl});
    vtone({type:'sawtooth',f0:126,f1:100,dur:.30,vol:lvl*(.34+dread*.36),cut:400,wobble:5});
  }
  if(breathPhase>=1){
    breathPhase=0; breathIn=true;
    nburst({dur:.30,type:'bandpass',f0:260,f1:800,q:1.4,vol:lvl*1.05});
    if(dread>.45) nburst({dur:.14,type:'highpass',f0:1400,f1:2600,q:.8,vol:lvl*.5});
  }
}
function jumpGrunt(){
  nburst({dur:.16,type:"bandpass",f0:600,f1:280,q:1.1,vol:.05,atk:.01});
  vtone({type:"sawtooth",f0:160,f1:120,dur:.14,vol:.045,cut:600});
}
function gruntEffort(){
  vtone({type:'sawtooth',f0:150+Math.random()*30,f1:92,dur:.22,vol:.085,cut:760,q:1.2,wobble:6});
  nburst({dur:.19,type:'bandpass',f0:980,f1:380,q:.9,vol:.05});
}
function gruntPain(){
  vtone({type:'sawtooth',f0:230+Math.random()*40,f1:118,dur:.52,vol:.115,cut:900,q:1.3,wobble:11,wobRate:9});
  nburst({dur:.46,type:'bandpass',f0:1300,f1:360,q:.8,vol:.075});
}
const STEP_SURFACE={1:{f0:1500,f1:420,q:.7,dur:.17},2:{f0:1050,f1:330,q:.8,dur:.14},3:{f0:2700,f1:880,q:1.3,dur:.10}};
function footstep(screen,vol,pan){
  const s=STEP_SURFACE[screen]||STEP_SURFACE[2];
  nburst({dur:s.dur,type:'bandpass',f0:s.f0*(.85+Math.random()*.3),f1:s.f1,q:s.q,vol,pan,atk:.008});
}
function zGrowl(dist,pan){
  const v=Math.max(.012,.15*(1-Math.min(1,dist/340)));
  vtone({type:'sawtooth',f0:70+Math.random()*26,f1:48,dur:.9+Math.random()*.5,vol:v,cut:430,q:1.4,wobble:13,wobRate:5+Math.random()*4,pan});
  nburst({dur:.75,type:'bandpass',f0:400,f1:170,q:2.4,vol:v*.55,pan});
}
function zShriek(dist,pan){
  const v=Math.max(.02,.21*(1-Math.min(1,dist/360)));
  vtone({type:'sawtooth',f0:210,f1:560,dur:.42,vol:v,filterType:'bandpass',cut:1200,q:2.2,wobble:34,wobRate:15,pan});
  nburst({dur:.48,type:'highpass',f0:900,f1:2400,q:.7,vol:v*.6,pan});
}
function zDeath(dist,pan){
  vtone({type:'sawtooth',f0:158,f1:42,dur:.95,vol:.115,cut:340,q:1.1,wobble:9,pan});
  nburst({dur:.85,type:'bandpass',f0:640,f1:110,q:1.7,vol:.075,pan});
}
function zHurt(pan){
  vtone({type:'sawtooth',f0:190,f1:96,dur:.3,vol:.1,cut:600,q:1.2,wobble:16,pan});
  nburst({dur:.16,type:'bandpass',f0:1400,f1:400,q:1.1,vol:.07,pan});
}
function callOut(dist,pan,urgent){
  const v=Math.max(.03,(urgent?.16:.09)*(1-Math.min(1,dist/420)));
  vtone({type:'sawtooth',f0:urgent?330:210,f1:urgent?250:170,dur:urgent?.55:.42,vol:v,filterType:'bandpass',cut:urgent?1100:820,q:2.6,wobble:7,pan});
  nburst({dur:.28,type:'bandpass',f0:1500,f1:600,q:1.1,vol:v*.4,pan});
}
function scream(pan){
  vtone({type:'sawtooth',f0:420,f1:180,dur:1.05,vol:.2,filterType:'bandpass',cut:1500,q:2.4,wobble:26,wobRate:12,pan});
  nburst({dur:.9,type:'highpass',f0:800,f1:2600,q:.8,vol:.1,pan});
}
function thump(v){
  if(!on||!AC) return;
  const now=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(64,now);
  o.frequency.exponentialRampToValueAtTime(34,now+.16);
  g.gain.setValueAtTime(v,now);
  g.gain.exponentialRampToValueAtTime(.0001,now+.30);
  o.connect(g).connect(master); o.start(now); o.stop(now+.32);
}
function heartbeat(dt,dread){
  if(dread<.10){ hbPhase=0; return; }
  hbPhase+=dt*(.85+dread*2.1);
  if(hbPhase>=1){ hbPhase=0; thump(.05+dread*.16); setTimeout(()=>thump(.03+dread*.10),150); }
}
function hush(depth,hold){
  if(!on||!AC||!seaGain) return;
  const now=AC.currentTime;
  seaGain.gain.cancelScheduledValues(now);
  seaGain.gain.setTargetAtTime(depth,now,.06);
  seaGain.gain.setTargetAtTime(.055,now+(hold||.7),.9);
}
function beep(f,dur,vol){ if(on&&AC) vtone({type:'square',f0:f,f1:f*.8,dur,vol,cut:2200}); }

/* chase score */
const BPM=128,STEP=60/BPM/4,ROOT=55;
const ARP=[0,3,7,10,12,10,7,3];
const BASS=[0,0,3,0,0,0,-2,0,0,0,5,0,3,3,-2,0];
let mus={playing:false,step:0,next:0,timer:null,gain:null,level:0};
function musicInit(){
  if(mus.gain) return;
  mus.gain=AC.createGain(); mus.gain.gain.value=0;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-18; comp.ratio.value=6;
  mus.gain.connect(comp).connect(master);
}
function note(s){ return ROOT*Math.pow(2,s/12); }
function mKick(t0){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t0);
  o.frequency.exponentialRampToValueAtTime(42,t0+.09);
  g.gain.setValueAtTime(.9,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.26);
  o.connect(g).connect(mus.gain); o.start(t0); o.stop(t0+.28);
}
function mHat(t0,open){
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=7200;
  const g=AC.createGain(), d=open?.15:.045;
  g.gain.setValueAtTime(open?.16:.10,t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(f).connect(g).connect(mus.gain); s.start(t0); s.stop(t0+d+.02);
}
function mClap(t0){
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1700; f.Q.value=1.1;
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(.42,t0+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t0+.17);
  s.connect(f).connect(g).connect(mus.gain); s.start(t0); s.stop(t0+.2);
}
function mBass(t0,semi){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=note(semi);
  f.type='lowpass'; f.Q.value=7;
  f.frequency.setValueAtTime(1400,t0);
  f.frequency.exponentialRampToValueAtTime(220,t0+STEP*1.6);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(.30,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+STEP*1.85);
  o.connect(f).connect(g).connect(mus.gain); o.start(t0); o.stop(t0+STEP*2);
}
function mArp(t0,semi){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type='square'; o.frequency.value=note(semi+24);
  f.type='bandpass'; f.frequency.value=note(semi+24)*2.2; f.Q.value=3.2;
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(.13,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t0+STEP*1.4);
  o.connect(f).connect(g).connect(mus.gain); o.start(t0); o.stop(t0+STEP*1.5);
}
function musicTick(){
  if(!on||!AC||!mus.playing) return;
  const ahead=AC.currentTime+.14;
  while(mus.next<ahead){
    const t0=mus.next,s=mus.step,L=mus.level;
    if(s%4===0) mKick(t0);
    if(L>.30){ mHat(t0,s%4===2); if(s%8===4) mClap(t0); }
    if(L>.45&&s%2===0) mBass(t0,BASS[s%16]);
    if(L>.72) mArp(t0,ARP[s%8]);
    if(L>.88&&s%16===15){ mClap(t0); mClap(t0+STEP*.5); }
    mus.next+=STEP; mus.step=(s+1)%64;
  }
}
function musicStart(){
  if(!on||!AC) return;
  musicInit();
  if(mus.playing) return;
  mus.playing=true; mus.step=0; mus.next=AC.currentTime+.08;
  mus.timer=setInterval(musicTick,45);
}
function musicStop(){
  mus.playing=false;
  if(mus.timer){ clearInterval(mus.timer); mus.timer=null; }
  if(mus.gain&&AC) mus.gain.gain.setTargetAtTime(0,AC.currentTime,.25);
}
function musicSet(dt,want){
  if(!on||!AC) return;
  mus.level+=(want-mus.level)*Math.min(1,dt*1.6);
  if(mus.level>.06){
    musicStart(); musicInit();
    mus.gain.gain.setTargetAtTime(Math.min(.92,mus.level*.92),AC.currentTime,.18);
  } else if(mus.playing) musicStop();
}

  if(on){ audio(); AC.resume(); seaGain.gain.setTargetAtTime(.055,AC.currentTime,.5); }
  else { if(seaGain) seaGain.gain.setTargetAtTime(0,AC.currentTime,.2); musicStop(); }
});

const lineEl=document.getElementById('introLine'), introWrap=document.getElementById('introWrap'), titleEl=document.getElementById('titleCard');
let intro=null;
const BEATS=[
  {at:0.4, hold:3.0,text:'ليلة أمس · على بعد ميلين من ساحل ثُوَل'},
  {at:3.8, hold:3.2,text:'انكسرت السفينة على الشعاب قبل أن يصل نداء الاستغاثة'},
  {at:7.4, hold:3.0,text:'ثمانية ركبوا معك. أنت الوحيد الذي وصل واقفاً'},
  {at:10.8,hold:3.0,text:'والباقون ما زالوا على هذا الساحل'}
];
function startIntro(){
  intro={start:performance.now(),t:0,beat:-1,done:false,blink:0,nextBlink:1.2};
  introEl.hidden=false; veil.hidden=true;
  titleEl.classList.remove('show'); introWrap.classList.remove('show'); lineEl.textContent='';
  G=fresh(1); safeBuild(G); running=false;
  if(!raf) raf=requestAnimationFrame(loop);
}
function updateIntro(dt){
  const I=intro,P=G.P;
  I.t=(performance.now()-I.start)/1000;
  for(let i=0;i<BEATS.length;i++){
    const b=BEATS[i];
    if(I.t>=b.at&&I.beat<i){
      I.beat=i; lineEl.textContent=b.text; introWrap.classList.add('show');
      if(i===1) hullGroan(); else if(i===3){ zGrowl(300,.5); hush(.02,1.2); }
    }
    if(I.beat===i&&I.t>=b.at+b.hold) introWrap.classList.remove('show');
  }
  const rise=Math.max(0,Math.min(1,(I.t-11.8)/3.8));
  const e=rise<.5?2*rise*rise:1-Math.pow(-2*rise+2,2)/2;
  G.camH=0.22+e*(EYE-0.22);
  G.roll=(1-e)*0.30;
  P.a=-0.55+e*0.55;
  P.breath+=dt*(2.6-e*1.0);
  let open;
  if(I.t<11.5) open=0;
  else if(I.t<12.7) open=(I.t-11.5)/1.2*0.55;
  else open=Math.min(1,0.55+(I.t-12.7)/1.9*0.45);
  I.blink-=dt;
  if(I.blink<=0&&I.t>11.7&&I.t<16.0){ I.blink=I.nextBlink; I.nextBlink=1.0+Math.random()*1.6; }
  const blinkK=(I.blink>0&&I.blink<0.16)?(1-Math.abs(I.blink-0.08)/0.08):0;
  const shut=Math.max(0,Math.min(1,1-open+blinkK*0.85));
  lidTop.style.transform=`translateY(${-(1-shut)*100}%)`;
  lidBot.style.transform=`translateY(${(1-shut)*100}%)`;
  if(on&&I.t>10.0) breathing(dt,.25,Math.max(0,1.1-(I.t-10.0)*.22),1);
  if(on&&I.t>=12.1&&!I.coughed){ I.coughed=true; cough(); }
  if(I.t>=15.6&&!I.titled){ I.titled=true; titleEl.classList.add('show'); }
  if(I.t>=18.4&&!I.done){ I.done=true; endIntro(); }
}
function endIntro(){
  intro=null; introEl.hidden=true;
  G.camH=EYE; G.roll=0;
  const s=SCREEN_TEXT[1];
  showVeil(s.eyebrow,s.title,s.body,'ابدأ',start);
}
document.getElementById('skipBtn').addEventListener('click',()=>{ if(intro) endIntro(); });
function hullGroan(){
  if(!on||!AC) return;
  vtone({type:'sawtooth',f0:58,f1:31,dur:2.6,vol:.13,cut:280,q:1.4,wobble:4,wobRate:2.2});
  nburst({dur:2.4,type:'bandpass',f0:220,f1:70,q:1.8,vol:.07,atk:.9});
}
function cough(){
  const b=d=>setTimeout(()=>{
    vtone({type:'sawtooth',f0:190,f1:96,dur:.20,vol:.10,cut:900,q:1.3,wobble:12});
    nburst({dur:.22,type:'bandpass',f0:1700,f1:420,q:.8,vol:.085,atk:.006});
  },d);
  b(0); b(260); b(560);
}

/* ---------------- closing ---------------- */
const outroEl=document.getElementById('outro'), outroLine=document.getElementById('outroLine'), outroWrap=document.getElementById('outroWrap');
const strobeEl=document.getElementById('strobe'), whatsNextEl=document.getElementById('whatsNext');
let outro=null;
function outroBeats(){
  const n=rescue.saved.length, names=rescue.saved.slice();
  const who=n===0?'لا أحد':n===1?names[0]:names.slice(0,-1).join(' و')+' و'+names[names.length-1];
  const sick=n===0?'ولا أحد معك لتراقبه.':n===1?`و${names[0]} لم يرمش منذ أن ركب.`:'ولا أحد منهم يرتجف من البرد. ولا واحد.';
  return [
    {at:0.5, hold:3.2,text:`دفعتَ القارب · نجا ${n} من أربعة`},
    {at:4.2, hold:3.4,text:n?`${who} معك على الماء`:'وحدك على الماء'},
    {at:8.0, hold:3.6,text:sick},
    {at:12.0,hold:3.6,text:'الطفيلي مصدره الماء — ونحن أتينا من الماء'},
    {at:16.0,hold:3.0,text:'كان القارب هو المكان الآمن'}
  ];
}
function startOutro(){
  outro={start:performance.now(),t:0,beat:-1,beats:outroBeats(),done:false,hit:0};
  outroEl.hidden=false; veil.hidden=true;
  whatsNextEl.classList.remove('show'); outroWrap.classList.remove('show'); outroLine.textContent='';
  running=false;
  if(on){ musicStart(); musicSet(1,.35); }
  if(!raf) raf=requestAnimationFrame(loop);
}
function updateOutro(dt){
  const O=outro;
  O.t=(performance.now()-O.start)/1000;
  for(let i=0;i<O.beats.length;i++){
    const b=O.beats[i];
    if(O.t>=b.at&&O.beat<i){
      O.beat=i; outroLine.textContent=b.text; outroWrap.classList.add('show');
      if(i===2&&on) zGrowl(120,-.4);
      if(i===4&&on) hush(.004,1.4);
    }
    if(O.beat===i&&O.t>=b.at+b.hold) outroWrap.classList.remove('show');
  }
  if(O.t>=19.4){
    const k=Math.min(1,(O.t-19.4)/3.2);
    if(on) musicSet(dt,1);
    const flash=Math.random()<dt*(6+k*16)?.30+Math.random()*.42:0;
    strobeEl.style.opacity = flash ? flash.toFixed(2) : (parseFloat(strobeEl.style.opacity||0)*.72).toFixed(3);
    G.shake=.08+k*.10;
    if(on&&O.t-O.hit>0.34+Math.random()*.5){
      O.hit=O.t;
      Math.random()<.45?scream((Math.random()-.5)*1.6):zShriek(60,(Math.random()-.5)*1.6);
    }
  }
  if(O.t>=23.4&&!O.shown){
    O.shown=true;
    outroWrap.classList.remove('show');
    whatsNextEl.classList.add('show');
    strobeEl.style.opacity=0; G.shake=0;
    if(on) musicSet(1,.55);
  }
}
function endOutro(restart){
  outro=null; outroEl.hidden=true; strobeEl.style.opacity=0;
  if(G) G.shake=0;
  if(restart) restartAll();
}
document.getElementById('outroRedo').addEventListener('click',()=>endOutro(true));

/* ---------------- boot ---------------- */
function boot(saved){
  initGL();
  bindPad();
  if(saved&&saved.counters) counters=saved.counters;
  if(saved&&saved.strain) strain=saved.strain;
  if(saved&&saved.rescue) rescue=saved.rescue;
  const resuming=saved&&saved.screen&&saved.screen>1;
  if(!resuming&&!(saved&&saved.seenIntro)){ startIntro(); return; }
  G=fresh(saved&&saved.screen?saved.screen:1);
  safeBuild(G);
  const s=SCREEN_TEXT[G.screen];
  showVeil(s.eyebrow,s.title,s.body,G.screen===1?'ابدأ':'ادخل',start);
  raf=requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({screen:G?G.screen:1,counters,strain,rescue,seenIntro:!intro}));
if(window.claude?.hot?.ready) window.claude.hot.ready(boot);
else boot(window.claude?.hot?.data??{});

})();
</script>
