<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<meta name="description" content="نموذج أولي ثلاثي الأبعاد بمنظور أول — Surviving Thuwaliidae">
<style>
  :root{color-scheme:dark}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Surviving Thuwaliidae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root{
  --void:#05080a; --deep:#0a1013; --panel:#0e161a;
  --hull:#9fc6d1; --hull-dim:#41606b;
  --paper:#d9d0bc; --ink:#191410;
  --warn:#c9302c; --text:#c6d0d3; --dim:#75858a; --faint:#465358; --line:#1a262b;
  --ok:#7fb08a;
  --ui:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --hand:"Amiri",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--void);color:var(--text);font-family:var(--ui);font-weight:300;margin:0;line-height:1.6}

.shell{direction:rtl;max-width:1060px;margin:0 auto;padding-inline:20px;padding-block:24px 48px}
.masthead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.4vw,34px);
   letter-spacing:-.01em;line-height:1.05;margin:0;color:var(--hull);direction:ltr}
.byline{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);direction:ltr;text-transform:uppercase}

.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;
       border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:crosshair}
.stage:focus-visible{outline:2px solid var(--hull);outline-offset:2px}
canvas#cv{display:block;width:100%;height:100%}

/* ---------- screen-space grade: vignette, grain, damage, proximity ---------- */
.fx{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 38%, rgba(3,2,2,.62) 100%)}
#grain{opacity:.16;mix-blend-mode:overlay;background-repeat:repeat;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.5'/></svg>");
  animation:grainShift .28s steps(3) infinite}
@keyframes grainShift{0%{background-position:0 0}33%{background-position:-30px 14px}66%{background-position:22px -26px}100%{background-position:0 0}}
#sense{opacity:0;transition:opacity .25s ease}
#hurt{box-shadow:inset 0 0 120px 30px var(--warn);opacity:0;transition:opacity .5s ease}
#hurt.on{opacity:.55;transition:opacity .04s ease}

/* ---------- in-frame HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--ui)}
.hud .pips{position:absolute;top:12px;inset-inline-start:14px;display:flex;gap:5px}
.pip{width:11px;height:11px;border:1px solid rgba(160,176,180,.45)}
.pip.out{background:var(--ok);border-color:var(--ok)}
.pip.with{background:#e0ce8c;border-color:#e0ce8c}
.pip.gone{border-color:rgba(201,48,44,.75);position:relative;background:
  linear-gradient(45deg,transparent 43%,var(--warn) 43%,var(--warn) 57%,transparent 57%),
  linear-gradient(-45deg,transparent 43%,var(--warn) 43%,var(--warn) 57%,transparent 57%)}
.hud .count{position:absolute;top:29px;inset-inline-start:14px;
  font-family:var(--mono);font-size:11px;color:rgba(190,200,203,.6);direction:ltr}
.hud .hp{position:absolute;top:12px;inset-inline-end:14px;display:flex;gap:5px;flex-direction:row-reverse}
.hp i{width:9px;height:9px;background:var(--warn);display:block}
.hp i.off{background:rgba(201,48,44,.18)}
.hud .wep{position:absolute;top:30px;inset-inline-end:14px;font-size:11.5px;color:rgba(200,190,164,.75)}
.hud .hide{position:absolute;top:50px;inset-inline-start:14px;font-size:11.5px;color:rgba(159,198,209,.85)}
.hud .toast{position:absolute;bottom:34px;left:0;right:0;text-align:center;
  font-size:13px;color:rgba(228,218,190,.95);opacity:0;transition:opacity .3s ease;
  text-shadow:0 2px 12px rgba(0,0,0,.9)}
.hud .toast.on{opacity:1}
.hud [hidden]{display:none!important}

/* ---------- overlays ---------- */
.veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:24px;cursor:default;
  background:radial-gradient(ellipse at 50% 60%, rgba(5,8,10,.72), rgba(5,8,10,.96) 70%)}
.veil[hidden]{display:none!important}
.veil h2{font-family:var(--display);font-weight:600;font-size:clamp(19px,3.4vw,27px);margin:0;color:var(--paper);text-wrap:balance}
.veil p{margin:0;max-width:48ch;font-size:clamp(13px,1.9vw,14.5px);color:var(--dim);text-wrap:pretty}
.veil .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;direction:ltr}

button{font-family:inherit}
.btn{font-family:var(--ui);font-weight:500;font-size:14px;color:var(--void);background:var(--hull);
  border:none;padding:11px 26px;border-radius:2px;cursor:pointer;transition:background .15s ease,transform .15s ease}
.btn:hover{background:#b9d9e2}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

.intro{position:absolute;inset:0;overflow:hidden}
.intro[hidden]{display:none!important}
.intro .lid{position:absolute;left:0;right:0;background:#03060a;height:52%}
.intro .lid.top{top:0}
.intro .lid.bot{bottom:0}
.intro .line{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);margin:0;padding:0 28px;
  text-align:center;font-family:var(--display);font-weight:500;font-size:clamp(15px,2.8vw,23px);
  line-height:1.55;color:#cfd7d9;text-wrap:balance;opacity:0;text-shadow:0 2px 18px rgba(0,0,0,.9)}
.intro .line.show{opacity:1;transition:opacity .9s ease}
.intro .titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;opacity:0;pointer-events:none}
.intro .titlecard.show{opacity:1;transition:opacity 1.1s ease}
.intro .tk{font-family:var(--display);font-weight:400;letter-spacing:.30em;font-size:clamp(11px,2vw,15px);
  color:#7d9aa3;direction:ltr;text-transform:uppercase}
.intro .tk.big{font-weight:700;letter-spacing:.02em;text-transform:none;font-size:clamp(26px,6.4vw,50px);
  color:var(--hull);text-shadow:0 0 34px rgba(159,198,209,.34)}
.intro .skip{position:absolute;bottom:12px;inset-inline-end:14px;background:rgba(8,12,15,.6);color:var(--dim);
  border:1px solid var(--line);border-radius:2px;padding:6px 13px;font-size:11.5px;cursor:pointer}
.intro .skip:hover{color:var(--text);border-color:var(--faint)}
.intro .sndhint{position:absolute;bottom:15px;inset-inline-start:14px;margin:0;font-size:11px;color:var(--faint)}

.outro{background:#03060a}
.outro .strobe{position:absolute;inset:0;background:var(--warn);opacity:0;mix-blend-mode:screen}
.whatsnext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;opacity:0;pointer-events:none}
.whatsnext.show{opacity:1;pointer-events:auto;transition:opacity .9s ease}
.whatsnext svg{filter:drop-shadow(0 0 14px rgba(201,48,44,.55))}
.wn-k{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.6vw,34px);color:var(--warn);
  text-shadow:0 0 26px rgba(201,48,44,.45)}
.wn-s{font-size:clamp(11px,2vw,13px);color:var(--dim);letter-spacing:.04em}
.whatsnext .btn{margin-top:10px}

.bar{display:flex;gap:9px;justify-content:flex-end;padding-top:12px;flex-wrap:wrap}
.tog{font-size:12px;color:var(--dim);background:transparent;border:1px solid var(--line);
  padding:6px 14px;border-radius:2px;cursor:pointer;transition:color .15s ease,border-color .15s ease}
.tog:hover{color:var(--text);border-color:var(--faint)}
.tog[aria-pressed="true"]{color:var(--hull);border-color:var(--hull-dim)}
.tog:focus-visible{outline:2px solid var(--hull);outline-offset:2px}

.jump{display:flex;gap:6px;margin:10px 0 2px}
.jump button{flex:1;font-family:var(--mono);font-size:10px;background:rgba(25,20,16,.08);color:#5d5348;
  border:1px solid rgba(25,20,16,.3);border-radius:2px;padding:5px 0;cursor:pointer}
.jump button:hover{background:rgba(25,20,16,.16);color:var(--ink)}
.jump button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.crewline{display:flex;justify-content:space-between;gap:8px;font-family:var(--hand);font-size:13.5px;color:#2a231c;padding:1px 0}
.crewline .s{font-family:var(--mono);font-size:9px;letter-spacing:.06em;align-self:center}
.crewline.out .s{color:#3f6b48}
.crewline.with .s{color:#2f5c6b}
.crewline.gone{opacity:.55}
.crewline.gone .n{text-decoration:line-through}
.crewline.gone .s{color:#8f2f2a}

.book{position:fixed;left:18px;bottom:18px;width:min(292px,calc(100vw - 36px));max-height:min(330px,52vh);
  display:flex;flex-direction:column;background:var(--paper);color:var(--ink);
  transform:translateY(calc(100% + 24px)) rotate(-.7deg);opacity:0;pointer-events:none;
  transition:transform .34s cubic-bezier(.22,.61,.36,1),opacity .24s ease;z-index:40;direction:rtl;
  box-shadow:0 16px 40px rgba(0,0,0,.66);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 21px,rgba(25,20,16,.07) 21px,rgba(25,20,16,.07) 22px)}
.book.open{transform:translateY(0) rotate(-.7deg);opacity:1;pointer-events:auto}
.book-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 8px 7px 11px;border-bottom:1px solid rgba(25,20,16,.24);background:rgba(25,20,16,.06)}
.book-bar .tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:#6b5f52;direction:ltr}
.book-scroll{overflow-y:auto;padding:12px 14px 16px}
.book h2{font-family:var(--hand);font-size:19px;font-weight:700;margin:0 0 6px;color:var(--ink);line-height:1.25}
.book .said{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b5f52;direction:ltr;text-align:right}
.book hr{border:none;border-top:1px solid rgba(25,20,16,.22);margin:10px 0}
.book p,.book li{font-family:var(--hand);font-size:13.5px;line-height:1.62;color:#2a231c}
.book p{margin:0 0 8px}
.book .plate{border:1px solid rgba(25,20,16,.3);padding:9px 10px;margin:10px 0;background:rgba(25,20,16,.05)}
.book .plate .cap{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:#6b5f52;margin-bottom:4px;direction:ltr;text-align:right}
.book .strike{text-decoration:line-through;opacity:.55}
.book .scrawl{font-family:var(--hand);font-style:italic;color:#8f2f2a;font-size:13.5px;line-height:1.5;transform:rotate(-.5deg);display:block;margin:9px 0 4px}
.book-close{flex:none;background:var(--ink);color:var(--paper);border:none;width:22px;height:22px;
  border-radius:2px;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center}

@media (max-width:720px){
  .shell{padding-block:18px 36px}
  .book{left:12px;bottom:12px;width:calc(100vw - 24px);max-height:44vh}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  #grain{animation:none}
}
</style>

</head>
<body>
<div class="shell">
  <header class="masthead">
    <h1>Surviving Thuwaliidae</h1>
    <span class="byline">samahkjj-cloud</span>
  </header>

  <div class="stage" id="stage" tabindex="0" role="application"
       aria-label="نموذج اللعبة بمنظور أول — تقدّم بـ W، التفت بالأسهم، أو اسحب بإصبعك">
    <canvas id="cv"></canvas>

    <div class="fx" id="sense"></div>
    <div class="fx" id="vig"></div>
    <div class="fx" id="grain"></div>
    <div class="fx" id="hurt"></div>

    <div class="hud" id="hud">
      <div class="pips" id="pips"></div>
      <div class="count" id="count">0 / 4</div>
      <div class="hp" id="hp"></div>
      <div class="wep" id="wep" hidden></div>
      <div class="hide" id="hideTag" hidden>مختبئ</div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="intro" id="intro">
      <div class="lid top" id="lidTop"></div>
      <div class="lid bot" id="lidBot"></div>
      <p class="line" id="introLine"></p>
      <div class="titlecard" id="titleCard">
        <span class="tk">Surviving</span>
        <span class="tk big">Thuwaliidae</span>
      </div>
      <button class="skip" id="skipBtn">تخطّي</button>
      <p class="sndhint">شغّل «الصوت» بالأسفل — نصف الرعب في السمع</p>
    </div>

    <div class="intro outro" id="outro" hidden>
      <div class="strobe" id="strobe"></div>
      <p class="line" id="outroLine"></p>
      <div class="whatsnext" id="whatsNext">
        <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="none" stroke="#c9302c" stroke-width="2"/>
          <path d="M19 15 L30 24 L19 33" fill="none" stroke="#c9302c" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="wn-k">ما التالي؟</span>
        <span class="wn-s">الفصل الأول من اللعبة الكاملة</span>
        <button class="btn" id="outroRedo">من البداية</button>
      </div>
    </div>

    <div class="veil" id="veil" hidden>
      <div class="eyebrow" id="veilEyebrow"></div>
      <h2 id="veilTitle"></h2>
      <p id="veilBody"></p>
      <button class="btn" id="veilBtn">ابدأ</button>
    </div>
  </div>

  <div class="bar">
    <button class="tog" id="redoBtn">إعادة</button>
    <button class="tog" id="sndBtn" aria-pressed="false">الصوت</button>
    <button class="tog" id="bookBtn" aria-pressed="false">دفتر الميدان</button>
  </div>
</div>

<aside class="book" id="book" aria-label="دفتر الميدان">
  <div class="book-bar">
    <span class="tag">Field Notebook</span>
    <button class="book-close" id="bookClose" aria-label="إغلاق الدفتر">✕</button>
  </div>
  <div class="book-scroll" id="bookBody"></div>
</aside>

<script>
(function(){
"use strict";

const stage=document.getElementById('stage');
const cv=document.getElementById('cv');
const veil=document.getElementById('veil');
const hurtEl=document.getElementById('hurt');
const senseEl=document.getElementById('sense');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* world units are ~3cm; S converts them to metres for the 3D scene */
const S=0.03, EYE=1.66;
const WX=x=>x*S, WZ=y=>y*S;

/* ============================================================
   procedural materials
   ============================================================ */
function rng(seed){ let s=seed>>>0; return ()=> (s=(s*1664525+1013904223)>>>0)/4294967296; }
function makeTex(w,h,paint){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  paint(c.getContext('2d'),w,h);
  return c;
}
function grit(x,w,h,seed,n,lo,hi,dark){
  const r=rng(seed);
  for(let i=0;i<n;i++){
    const a=lo+r()*(hi-lo);
    x.fillStyle=dark?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`;
    x.fillRect((r()*w)|0,(r()*h)|0,1+((r()*2)|0),1);
  }
}
const TEX={};
function buildTextures(){
  TEX.plank=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#8a7050'; x.fillRect(0,0,w,h);
    const r=rng(11);
    for(let i=0;i<8;i++){
      const y=i*32;
      x.fillStyle=`rgb(${118+r()*46|0},${92+r()*38|0},${62+r()*30|0})`;
      x.fillRect(0,y,w,29);
      x.fillStyle='rgba(30,20,12,.6)'; x.fillRect(0,y+29,w,3);
      for(let k=0;k<50;k++){
        x.fillStyle=`rgba(46,32,20,${.05+r()*.15})`;
        x.fillRect(r()*w,y+r()*29,10+r()*60,1+r()*2);
      }
    }
    grit(x,w,h,7,900,.02,.11,true);
  });
  TEX.concrete=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#8d9598'; x.fillRect(0,0,w,h);
    const r=rng(23);
    for(let i=0;i<340;i++){
      x.fillStyle=`rgba(${90+r()*62|0},${98+r()*58|0},${100+r()*56|0},${.22+r()*.36})`;
      const s=6+r()*34; x.fillRect(r()*w,r()*h,s,s*(.4+r()*.8));
    }
    for(let i=0;i<7;i++){ x.fillStyle=`rgba(46,58,62,${.10+r()*.14})`; x.fillRect(r()*w,0,3+r()*10,h); }
    grit(x,w,h,29,1400,.02,.12,true);
    grit(x,w,h,31,600,.02,.09,false);
  });
  TEX.hull=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#d5dcdc'; x.fillRect(0,0,w,h);
    x.fillStyle='#9fc6d1'; x.fillRect(0,h*.54,w,h*.28);
    x.fillStyle='#2f3d40'; x.fillRect(0,h*.49,w,7);
    const r=rng(41);
    for(let i=0;i<260;i++){
      x.fillStyle=`rgba(${60+r()*70|0},${70+r()*60|0},${70+r()*60|0},${.04+r()*.18})`;
      x.fillRect(r()*w,h*.5+r()*h*.5,6+r()*40,2+r()*5);
    }
    grit(x,w,h,43,700,.02,.08,true);
  });
  TEX.plaster=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#a3937b'; x.fillRect(0,0,w,h);
    const r=rng(59);
    for(let i=0;i<460;i++){
      x.fillStyle=`rgba(${120+r()*70|0},${104+r()*60|0},${82+r()*54|0},${.16+r()*.3})`;
      x.fillRect(r()*w,r()*h,10+r()*48,6+r()*30);
    }
    grit(x,w,h,61,1100,.02,.1,true);
  });
  TEX.sand=makeTex(512,512,(x,w,h)=>{
    x.fillStyle='#6d6154'; x.fillRect(0,0,w,h);
    const r=rng(71);
    for(let i=0;i<9000;i++){
      const g=r();
      x.fillStyle = g>.88 ? `rgba(206,214,216,${.2+r()*.5})`
                 : g>.56 ? `rgba(52,42,34,${.25+r()*.45})`
                         : `rgba(94,82,68,${.18+r()*.4})`;
      const s=1.5+r()*5;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*.72,r()*3,0,6.28); x.fill();
    }
  });
  TEX.dirt=makeTex(512,512,(x,w,h)=>{
    x.fillStyle='#6a5943'; x.fillRect(0,0,w,h);
    const r=rng(83);
    for(let i=0;i<6200;i++){
      x.fillStyle=`rgba(${(58+r()*72)|0},${(46+r()*60)|0},${(32+r()*46)|0},${.22+r()*.42})`;
      const s=1.5+r()*6;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*.7,0,0,6.28); x.fill();
    }
    for(let i=0;i<220;i++){ x.fillStyle=`rgba(198,206,204,${.08+r()*.2})`; x.fillRect(r()*w,r()*h,2,2); }
  });
  TEX.tile=makeTex(512,512,(x,w,h)=>{
    x.fillStyle='#79838a'; x.fillRect(0,0,w,h);
    const r=rng(97);
    for(let gy=0;gy<4;gy++) for(let gx=0;gx<4;gx++){
      const px=gx*128, py=gy*128;
      x.fillStyle=`rgb(${(106+r()*26)|0},${(114+r()*24)|0},${(118+r()*24)|0})`;
      x.fillRect(px+5,py+5,118,118);
      for(let i=0;i<160;i++){
        x.fillStyle=`rgba(${(70+r()*60)|0},${(78+r()*58)|0},${(82+r()*56)|0},${.14+r()*.26})`;

}

/* ---------------- input ---------------- */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k]=true;
  if(k==='escape') closeBook();

addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

let moveP=null,lookP=null;
stage.addEventListener('pointerdown',e=>{
  if(!running || e.target.closest('button')) return;
  stage.setPointerCapture(e.pointerId);
  stage.focus({preventScroll:true});
  const r=stage.getBoundingClientRect();
  const lx=e.clientX-r.left, ly=e.clientY-r.top;
  const rec={id:e.pointerId,ox:lx,oy:ly,x:lx,y:ly};
  if(lx<r.width/2) moveP=rec; else lookP=rec;
});
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect();
  const lx=e.clientX-r.left, ly=e.clientY-r.top;
  if(moveP&&moveP.id===e.pointerId){ moveP.x=lx; moveP.y=ly; }
  if(lookP&&lookP.id===e.pointerId){ lookP.x=lx; lookP.y=ly; }
});
function dropP(e){
  if(moveP&&moveP.id===e.pointerId) moveP=null;
  if(lookP&&lookP.id===e.pointerId) lookP=null;
}
stage.addEventListener('pointerup',dropP);
stage.addEventListener('pointercancel',dropP);

function readMove(){
  let f=0,s=0;
  if(keys['w']||keys['arrowup']) f+=1;
  if(keys['s']||keys['arrowdown']) f-=1;
  if(keys['d']) s+=1;
  if(keys['a']) s-=1;
  if(moveP){
    const vx=moveP.x-moveP.ox, vy=moveP.y-moveP.oy, d=Math.hypot(vx,vy);
    if(d>10){ f+=-vy/d; s+=vx/d; }
  }
  const m=Math.hypot(f,s);
  return m>1?{f:f/m,s:s/m}:{f,s};
}
function readTurn(dt){
  let r=0;
  if(keys['arrowleft']) r-=1;
  if(keys['arrowright']) r+=1;
  let turn=r*2.1*dt;
  if(lookP){ turn+=(lookP.x-lookP.ox)*0.0042; lookP.ox=lookP.x; }
  return turn;
}

/* ---------------- collision ---------------- */
function hitsRect(cx,cy,rad,o){
  const nx=Math.max(o.x,Math.min(cx,o.x+o.w));
  const ny=Math.max(o.y,Math.min(cy,o.y+(o.d!==undefined?o.d:o.h)));
  return (cx-nx)**2+(cy-ny)**2 < rad*rad;
}
function inRect(cx,cy,o){ return cx>o.x&&cx<o.x+o.w&&cy>o.y&&cy<o.y+o.h; }
function slide(g,e,dx,dy){
  const rs=g.solids;
  const stuck=rs.some(o=>hitsRect(e.x,e.y,e.r,o));
  e.x+=dx;
  if(!stuck) for(const o of rs) if(hitsRect(e.x,e.y,e.r,o)){ e.x-=dx; break; }
  e.y+=dy;
  if(!stuck) for(const o of rs) if(hitsRect(e.x,e.y,e.r,o)){ e.y-=dy; break; }
  e.x=Math.max(e.r,Math.min(g.W-e.r,e.x));
  e.y=Math.max(e.r,Math.min(g.H-e.r,e.y));
}
function toCam(g,wx,wy){
  const dx=wx-g.P.x, dy=wy-g.P.y;
  const ca=Math.cos(g.P.a), sa=Math.sin(g.P.a);
  return {d:dx*ca+dy*sa, s:-dx*sa+dy*ca};
}
function panOf(g,e){ const c=toCam(g,e.x,e.y); return Math.max(-1,Math.min(1,c.s/(Math.abs(c.d)+40))); }
function toast(g,m){ g.toast=m; g.toastT=2.6; }

/* ---------------- update ---------------- */
function update(dt){
  const g=G,P=g.P;
  if(g.over) return;

  P.a+=readTurn(dt);
  const mv=readMove();
  const ca=Math.cos(P.a), sa=Math.sin(P.a);
  slide(g,P,(ca*mv.f-sa*mv.s)*108*dt,(sa*mv.f+ca*mv.s)*108*dt);
  const moving=Math.hypot(mv.f,mv.s)>.05;
  P.bob = moving ? Math.sin(t*11)*.022 : P.bob*.9;
  P.breath += dt*(1.4+g.dread*2.2);
  P.iframe=Math.max(0,P.iframe-dt);
  P.hidden=g.covers.some(c=>inRect(P.x,P.y,c));

  for(const it of g.items){
    if(it.taken) continue;
    if(Math.hypot(P.x-it.x,P.y-it.y)<34){
      it.taken=true; P.weapon=WEAPONS[it.kind]||WEAPONS.oar; P.pickup=1.4;
      beep(300,.08,.05);
      if(g.screen===1) g.exit.locked=false;
    }
  }
  P.swing=Math.max(0,P.swing-dt);
  P.atkCd=Math.max(0,P.atkCd-dt);
  P.pickup=Math.max(0,P.pickup-dt);

  let following=0;
  for(const s of g.survivors){
    if(s.state==='down'||s.state==='out'||s.state==='left') continue;
    s.hurtCd=Math.max(0,s.hurtCd-dt); s.voice-=dt; s.wave+=dt*2.4;
    const ds=Math.hypot(P.x-s.x,P.y-s.y), pan=panOf(g,s);
    if(s.state==='trapped'){
      if(s.voice<=0){ s.voice=3.2+Math.random()*3; callOut(ds,pan,true); }
      if(ds<30){ s.state='follow'; s.voice=1.2; toast(g,s.name+' معك الآن'); callOut(ds,pan,false); hush(.012,.5); }
    } else {
      following++;
      if(s.voice<=0){ s.voice=5+Math.random()*5; callOut(ds,pan,false); }
      if(ds>34){
        const a=Math.atan2(P.y-s.y,P.x-s.x);
        slide(g,s,Math.cos(a)*Math.min(104,62+ds*.45)*dt,Math.sin(a)*Math.min(104,62+ds*.45)*dt);
        s.gait+=dt*7;
      } else s.gait+=dt*1.6;
    }
  }
  g.following=following;
  const noise=1+following*0.24;

  let nearest=1e9, behind=0;
  for(const z of g.infected){
    z.hitCd=Math.max(0,z.hitCd-dt); z.stagger=Math.max(0,z.stagger-dt);
    z.atk=Math.max(0,z.atk-dt); z.ring+=dt; z.moan-=dt;
    const d=Math.hypot(P.x-z.x,P.y-z.y);
    nearest=Math.min(nearest,d);
    const c=toCam(g,z.x,z.y);
    const inView=c.d>0 && Math.abs(c.s/Math.max(1,c.d))<.62 && d<340;
    z.watched=inView&&!P.hidden;
    if(d<190 && (c.d<=0 || Math.abs(c.s/Math.max(1,c.d))>.78)) behind=Math.max(behind,1-d/190);

    const range=z.sense*noise;
    const canSense = z.strain==='stealth' ? d<range : (d<range && !P.hidden);
    const wasSeen=z.seen;
    if(canSense) z.aggro=2.4; else z.aggro=Math.max(0,z.aggro-dt);
    z.seen=z.aggro>0;
    if(z.seen&&!wasSeen){ zShriek(d,panOf(g,z)); hush(.01,.55); }

    z.lunge=Math.max(0,z.lunge-dt);
    let mul=1;
    if(z.watched) mul = d<150 ? .62 : (z.strain==='flee'?.40:.26);
    else if(z.seen) mul=2.0;
    if(z.seen&&d<120&&z.lunge<=0) z.lunge=1.5;
    if(z.lunge>0.9) mul*=1.7;

    z.gait+=dt*(z.seen&&!z.watched?7.5:2.2);
    if(z.stagger<=0){
      if(z.seen||z.watched){
        const a=Math.atan2(P.y-z.y,P.x-z.x);
        slide(g,z,Math.cos(a)*z.speed*mul*dt,Math.sin(a)*z.speed*mul*dt);
        z.face=a;
      } else {
        z.wander+=(Math.random()-.5)*dt*3;
        const hx=z.home.x-z.x, hy=z.home.y-z.y;
        const pull=Math.hypot(hx,hy)>150?Math.atan2(hy,hx):z.wander;
        slide(g,z,Math.cos(pull)*24*dt,Math.sin(pull)*24*dt);
        z.face=pull;
      }
    }

    const wep=P.weapon;
    const facing=c.d>0&&Math.abs(c.s/Math.max(1,c.d))<.55;
    if(wep.dmg>0&&facing&&d<P.r+z.r+wep.reach&&P.atkCd<=0){
      z.hp-=wep.dmg; P.atkCd=wep.cd; P.swing=wep.cd*.75; z.stagger=.34; z.hitCd=.3;
      const a=Math.atan2(z.y-P.y,z.x-P.x);
      z.x+=Math.cos(a)*18; z.y+=Math.sin(a)*18;
      counters.engage+=1.2; g.shake=.05;
      gruntEffort(); zHurt(panOf(g,z));
      if(z.hp<=0){ z.dead=true; }
    }
    if(d<P.r+z.r+5&&P.iframe<=0&&z.stagger<=0&&z.atk<=0){ z.atk=1.5; damage(); }

    if(z.seen&&!z.dead){
      const away=((P.x-z.x)*ca+(P.y-z.y)*sa)*mv.f;
      if(away>0.2&&moving) counters.flee+=dt*1.25;
    }
    if(!z.dead&&P.hidden&&d<z.sense*1.45) counters.stealth+=dt*1.0;
    if(z.moan<=0&&Math.random()<dt*(z.seen?.9:.35)){ z.moan=2.6; zGrowl(d,panOf(g,z)); }

    for(const s of g.survivors){
      if(s.state!=='follow') continue;
      if(Math.hypot(s.x-z.x,s.y-z.y)<s.r+z.r+5&&s.hurtCd<=0){
        s.hp-=1; s.hurtCd=1.3;
        const pan=panOf(g,s);
        if(s.hp<=0){ s.state='down'; markLost(s.name); scream(pan); hush(.004,1.1); toast(g,'فقدتَ '+s.name); }
        else callOut(0,pan,true);
      }
    }
  }
  g.infected=g.infected.filter(z=>{
    if(z.dead) zDeath(Math.hypot(P.x-z.x,P.y-z.y),panOf(g,z));
    return !z.dead;
  });

  if(moving){ P.step+=dt*3.1; if(P.step>=1){ P.step=0; footstep(g.screen,.035+Math.random()*.02,0); } }
  breathing(dt,moving?1:0,g.dread,P.hp<=1?1:0);

  const target=nearest<1e8?Math.max(0,1-nearest/300):0;
  g.dread+=(target-g.dread)*Math.min(1,dt*2.4);
  heartbeat(dt,g.dread);
  g.behind=behind;

  let hunted=false,eyed=false;
  for(const z of g.infected){ if(z.seen) hunted=true; if(z.watched) eyed=true; }
  let want=0.18;
  if(eyed) want=Math.max(want,0.50);
  if(hunted) want=Math.max(want,0.86);
  want=Math.max(want,0.22+g.dread*0.72);
  musicSet(dt,Math.min(1,want));

  g.lightJitter += ((1-Math.random()*g.dread*.5)-g.lightJitter)*Math.min(1,dt*9);
  if(Math.random()<dt*g.dread*1.4) g.lightJitter=.45;

  if(g.exit&&!g.exit.locked&&inRect(P.x,P.y,g.exit)){
    for(const s of g.survivors) if(s.state==='follow'){ s.state='out'; markSaved(s.name); }
    for(const s of g.survivors) if(s.state==='trapped'){ s.state='left'; markLost(s.name); }
    finishScreen();
  }
  g.toastT=Math.max(0,g.toastT-dt);
  g.shake=Math.max(0,g.shake-dt*.35);
}

function damage(){
  const P=G.P;
  P.hp-=1; P.iframe=1.0; G.shake=.12;
  hurtEl.classList.add('on');
  setTimeout(()=>hurtEl.classList.remove('on'),100);
  gruntPain(); hush(.006,.8);
  if(P.hp<=0) endScreen('fail');
}
function leader(){
  let best='engage',v=-1;
  for(const k of ['engage','stealth','flee']) if(counters[k]>v){ v=counters[k]; best=k; }
  return best;
}
function finishScreen(){
  if(G.screen===1){ go(2); return; }
  if(G.screen===2){ strain=leader(); go(3); return; }
  closeBook(); startOutro();
}
function endScreen(kind){
  G.over=true; running=false;
  if(kind==='fail'){
    showVeil('Screen 0'+G.screen+' · Down','أصابك',
      'سقطت. العدّادات ومن أنقذتهم محفوظون — أعد الشاشة وجرّب أسلوباً آخر.',
      'أعد الشاشة',()=>go(G.screen));
  }
}

/* ============================================================
   WebGL scene — real geometry, real lights, real shadows
   ============================================================ */
let renderer,scene,camera,torch,hemi,ambientL,signLight,viewModel;
let dyn={infected:[],survivors:[],items:[]};
let texCache=new Map();

function tex(canvas,repeat){
  const key=canvas.__id||(canvas.__id=Math.random());
  const k=key+'|'+repeat;
  if(texCache.has(k)) return texCache.get(k);
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(repeat,repeat);
  t.anisotropy=4;
  texCache.set(k,t);
  return t;
}

function initGL(){
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(1.6,window.devicePixelRatio||1));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=0.82;
  camera=new THREE.PerspectiveCamera(72,16/9,0.08,260);
  resizeGL();
  addEventListener('resize',resizeGL);
}
function resizeGL(){
  if(!renderer) return;
  const r=stage.getBoundingClientRect();
  const w=Math.max(320,Math.round(r.width)), h=Math.max(180,Math.round(r.height));
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}

function disposeScene(){
  if(!scene) return;
  scene.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      const m=Array.isArray(o.material)?o.material:[o.material];
      m.forEach(x=>x.dispose());
    }
  });
}

/* a person, built from real solids so it reads from every angle */
function makeHuman(p){
  const grp=new THREE.Group();
  const skin=new THREE.MeshStandardMaterial({color:p.skin,roughness:.86});
  const cloth=new THREE.MeshStandardMaterial({color:p.cloth,roughness:.94});
  const mk=(geo,mat,x,y,z)=>{
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
    grp.add(m); return m;
  };
  const torso=mk(new THREE.CapsuleGeometry? new THREE.CapsuleGeometry(.17,.42,4,10)
                 : new THREE.CylinderGeometry(.17,.19,.62,10), cloth, 0,1.12,0);
  const head=mk(new THREE.SphereGeometry(.115,16,12),skin,0,1.52,0);
  const armL=mk(new THREE.CylinderGeometry(.052,.045,.62,8),skin,-.235,1.14,0);
  const armR=mk(new THREE.CylinderGeometry(.052,.045,.62,8),skin, .235,1.14,0);
  const legL=mk(new THREE.CylinderGeometry(.072,.058,.84,8),cloth,-.10,.42,0);
  const legR=mk(new THREE.CylinderGeometry(.072,.058,.84,8),cloth, .10,.42,0);
  const parts={grp,torso,head,armL,armR,legL,legR,mats:[skin,cloth]};

  if(p.eyes){
    const em=new THREE.MeshBasicMaterial({color:0xff3b30});
    const g=new THREE.SphereGeometry(.018,8,6);
    const eL=new THREE.Mesh(g,em), eR=new THREE.Mesh(g,em);
    eL.position.set(-.042,1.545,.10); eR.position.set(.042,1.545,.10);
    grp.add(eL); grp.add(eR);
    parts.eyes=[eL,eR]; parts.eyeMat=em;
  }
  if(p.vis){   // survivors wear something that catches the torch
    const vm=new THREE.MeshStandardMaterial({color:0xe6d58a,emissive:0x2a2408,roughness:.7});
    const band=new THREE.Mesh(new THREE.CylinderGeometry(.185,.185,.10,12),vm);
    band.position.set(0,1.30,0); band.castShadow=true;
    grp.add(band); parts.mats.push(vm);
  }
  return parts;
}

function makeWeaponMesh(kind){
  const g=new THREE.Group();
  const wood=new THREE.MeshStandardMaterial({color:0x8a7150,roughness:.9});
  const steel=new THREE.MeshStandardMaterial({color:0xc8d2d6,roughness:.28,metalness:.85});
  if(kind==='knife'){
    const h=new THREE.Mesh(new THREE.CylinderGeometry(.018,.02,.11,8),wood); h.position.y=.05; g.add(h);
    const b=new THREE.Mesh(new THREE.ConeGeometry(.026,.20,4),steel); b.position.y=.20; g.add(b);
  } else if(kind==='spear'){
    const s=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,1.35,8),wood); s.position.y=.62; g.add(s);
    const b=new THREE.Mesh(new THREE.ConeGeometry(.035,.26,6),steel); b.position.y=1.42; g.add(b);
  } else {
    const s=new THREE.Mesh(new THREE.CylinderGeometry(.020,.022,1.05,8),wood); s.position.y=.5; g.add(s);
    const bl=new THREE.Mesh(new THREE.BoxGeometry(.13,.34,.022),wood); bl.position.y=1.12; g.add(bl);
  }
  g.traverse(o=>{ if(o.isMesh) o.castShadow=false; });
  return g;
}

function buildScene(g){
  disposeScene();
  dyn={infected:[],survivors:[],items:[]};
  scene=new THREE.Scene();
  scene.background=new THREE.Color(g.fogColor);
  scene.fog=new THREE.FogExp2(g.fogColor,g.fogDensity);

  // ground
  const floorTex=tex(g.floor,g.floorRepeat);
  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(WX(g.W),WZ(g.H)),
    new THREE.MeshStandardMaterial({map:floorTex,bumpMap:floorTex,bumpScale:.035,roughness:.98,metalness:0})
  );
  floor.rotation.x=-Math.PI/2;
  floor.position.set(WX(g.W)/2,0,WZ(g.H)/2);
  floor.receiveShadow=true;
  scene.add(floor);

  // the sea, on the far side of the beach
  if(g.sky==='beach'||g.sky==='night'){
    const sea=new THREE.Mesh(
      new THREE.PlaneGeometry(WX(g.W)*3,120),
      new THREE.MeshStandardMaterial({color:g.sky==='night'?0x0a1418:0x46585f,roughness:.35,metalness:.2})
    );
    sea.rotation.x=-Math.PI/2;
    sea.position.set(WX(g.W)/2,-0.12,-60+WZ(0));
    scene.add(sea);
  }

  // solids
  for(const o of g.solids){
    if(o.ghost) continue;
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(WX(o.w),WX(o.h),WZ(o.d)),
      new THREE.MeshStandardMaterial({
        map:tex(o.tex,Math.max(1,Math.round(o.w/60))),
        bumpMap:tex(o.tex,Math.max(1,Math.round(o.w/60))),
        bumpScale:.03,
        color:new THREE.Color(o.tint,o.tint,o.tint),
        roughness:.95
      })
    );
    m.position.set(WX(o.x+o.w/2),WX(o.h)/2,WZ(o.y+o.d/2));
    m.castShadow=true; m.receiveShadow=true;
    scene.add(m);
  }

  // boats: a real hull outline with an open interior, so walking past one reads
  // as a boat rather than a drum
  const HULL=[                       // normalised half-outline, bow first
    [ .50,.000],[ .47,.075],[ .40,.165],[ .28,.245],[ .12,.290],
    [-.06,.300],[-.24,.292],[-.38,.268],[-.47,.238],[-.50,.215]
  ];
  function hullPath(sx,sy,inset){
    const p=new THREE.Path? new THREE.Shape():new THREE.Shape();
    const pts=[];
    for(const q of HULL) pts.push([q[0]*sx*(1-inset*.10), q[1]*sy*(1-inset)]);
    for(let i=HULL.length-1;i>=0;i--){
      const q=HULL[i];
      pts.push([q[0]*sx*(1-inset*.10), -q[1]*sy*(1-inset)]);
    }
    pts.forEach((q,i)=> i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));
    p.closePath();
    return p;
  }
  for(const b of g.boats){
    const sx=WX(b.len), sy=WX(b.beam);
    const shape=hullPath(sx,sy,0);
    const hole=hullPath(sx,sy,0.22);
    shape.holes.push(hole);
    const geo=new THREE.ExtrudeGeometry(shape,{depth:WX(50),bevelEnabled:true,
      bevelThickness:.035,bevelSize:.03,bevelSegments:2});
    const mat=new THREE.MeshStandardMaterial({map:tex(TEX.hull,3),bumpMap:tex(TEX.hull,3),
      bumpScale:.02,roughness:.55,color:0xbcc4c4});
    const m=new THREE.Mesh(geo,mat);
    m.rotation.x=-Math.PI/2; m.rotation.z=-b.rot;
    m.position.set(WX(b.cx),0,WZ(b.cy));
    m.castShadow=true; m.receiveShadow=true;
    scene.add(m);
    // the sole inside, plus two thwarts
    const sole=new THREE.Mesh(new THREE.PlaneGeometry(sx*.82,sy*.52),
      new THREE.MeshStandardMaterial({color:0x7d8e92,roughness:.9}));
    sole.rotation.x=-Math.PI/2; sole.rotation.z=-b.rot;
    sole.position.set(WX(b.cx),WX(12),WZ(b.cy));
    sole.receiveShadow=true; scene.add(sole);
    for(const o of [-0.16,0.16]){
      const th=new THREE.Mesh(new THREE.BoxGeometry(sx*.09,WX(7),sy*.62),
        new THREE.MeshStandardMaterial({color:0x8e8371,roughness:.95}));
      th.position.set(WX(b.cx)+Math.cos(-b.rot)*sx*o, WX(44), WZ(b.cy)+Math.sin(-b.rot)*sx*o);
      th.rotation.y=-b.rot;
      th.castShadow=true; scene.add(th);
    }
  }

  // shelter sheets over the cover zones
  for(const c of g.covers){
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(WX(c.w),.04,WZ(c.h)),
      new THREE.MeshStandardMaterial({color:0x3a2c20,roughness:.95})
    );
    m.position.set(WX(c.x+c.w/2),WX(104),WZ(c.y+c.h/2));
    m.castShadow=true;
    scene.add(m);
    for(const p of [[c.x,c.y],[c.x+c.w,c.y],[c.x,c.y+c.h],[c.x+c.w,c.y+c.h]]){
      const post=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,WX(104),6),
        new THREE.MeshStandardMaterial({color:0x4a3a28,roughness:.95}));
      post.position.set(WX(p[0]),WX(104)/2,WZ(p[1]));
      post.castShadow=true; scene.add(post);
    }
  }

  // the sign — the only saturated thing in the game
  if(g.sign){
    const grp=new THREE.Group();
    const plate=new THREE.Mesh(new THREE.BoxGeometry(WX(90),WX(64),.03),
      new THREE.MeshStandardMaterial({color:0xe8e4da,roughness:.6,emissive:0x140404}));
    plate.position.y=WX(120); plate.castShadow=true;
    const frame=new THREE.Mesh(new THREE.BoxGeometry(WX(96),WX(70),.02),
      new THREE.MeshStandardMaterial({color:0xc9302c,emissive:0x5a0f0d,roughness:.7}));
    frame.position.set(0,WX(120),-.02);
    for(const px of [-WX(34),WX(34)]){
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,WX(120),6),
        new THREE.MeshStandardMaterial({color:0x6e6a63,roughness:.9}));
      leg.position.set(px,WX(60),0); leg.castShadow=true; grp.add(leg);
    }
    for(let i=0;i<3;i++){
      const bar=new THREE.Mesh(new THREE.BoxGeometry(WX(60-i*10),WX(7),.01),
        new THREE.MeshBasicMaterial({color:0xc9302c}));
      bar.position.set(0,WX(136-i*16),.02); grp.add(bar);
    }
    grp.add(plate); grp.add(frame);
    grp.position.set(WX(g.sign.x),0,WZ(g.sign.y));
    scene.add(grp);
    signLight=new THREE.PointLight(0xc9302c,2.2,9,2);
    signLight.position.set(WX(g.sign.x),WX(130),WZ(g.sign.y)+.3);
    scene.add(signLight);
  } else signLight=null;

  // lights
  hemi=new THREE.HemisphereLight(0x9fb4bd,0x3a3229,g.ambient);
  scene.add(hemi);
  ambientL=new THREE.AmbientLight(0x5a6a72,g.ambient*.22);
  scene.add(ambientL);
  if(g.sky==='beach'){
    const sun=new THREE.DirectionalLight(0xaab6ba,.30);
    sun.position.set(WX(g.W)*.3,26,WZ(g.H)*.2);
    scene.add(sun);
  }

  torch=new THREE.SpotLight(0xfff0d6,g.torch*3.1,34,0.52,0.55,1.4);
  torch.castShadow=true;
  torch.shadow.mapSize.width=1024;
  torch.shadow.mapSize.height=1024;
  torch.shadow.camera.near=.4;
  torch.shadow.camera.far=30;
  torch.shadow.bias=-0.0012;
  torch.position.set(.16,-.12,0);
  camera.add(torch);
  camera.add(torch.target);
  torch.target.position.set(0,-.05,-1);
  scene.add(camera);

  // dynamic bodies
  for(const z of g.infected){
    const h=makeHuman({skin:0x93887a,cloth:0x3c3330,eyes:true});
    h.grp.rotation.order='YXZ';
    scene.add(h.grp); dyn.infected.push({z,h});
  }
  for(const s of g.survivors){
    const h=makeHuman({skin:0xbc9c80,cloth:0xa9a698,vis:true});
    scene.add(h.grp); dyn.survivors.push({s,h});
  }
  for(const it of g.items){
    const m=makeWeaponMesh(it.kind);
    m.position.set(WX(it.x),0,WZ(it.y));
    m.rotation.z=0.42;
    m.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
    scene.add(m); dyn.items.push({it,m});
  }

  // held weapon rides the camera
  if(viewModel){ camera.remove(viewModel); viewModel=null; }
  syncWeapon(g);
}

function syncWeapon(g){
  const k=g.P.weapon.key;
  if(viewModel && viewModel.userData.kind===k) return;
  if(viewModel){ camera.remove(viewModel); viewModel=null; }
  if(k==='none') return;
  const m=makeWeaponMesh(k);
  m.userData.kind=k;
  m.scale.setScalar(.85);
  camera.add(m);
  viewModel=m;
}

const _v=new THREE.Vector3();
function syncScene(g,dt){
  if(!scene) return;
  const P=g.P;
  // camera
  camera.position.set(WX(P.x), (g.camH||EYE)+P.bob, WZ(P.y));
  camera.rotation.order='YXZ';
  camera.rotation.y = -P.a - Math.PI/2;
  camera.rotation.x = Math.sin(P.breath)*0.006;
  camera.rotation.z = (g.roll||0) + (g.shake? (Math.random()-.5)*g.shake : 0);

  if(torch){
    torch.intensity = g.torch*3.1*(g.lightJitter||1);
    torch.position.x = .16 + P.bob*.5;
  }
  if(signLight) signLight.intensity = 2.0+Math.sin(t*2.1)*.25;

  // infected
  for(const e of dyn.infected){
    const z=e.z,h=e.h;
    if(z.dead||!g.infected.includes(z)){ h.grp.visible=false; continue; }
    h.grp.visible=true;
    h.grp.position.set(WX(z.x),0,WZ(z.y));
    h.grp.rotation.y = -(z.face!==undefined?z.face:0) - Math.PI/2;
    const sw=Math.sin(z.gait)*.55;
    h.legL.rotation.x= sw; h.legR.rotation.x=-sw;
    h.armL.rotation.x=-sw*.7; h.armR.rotation.x= sw*.7;
    h.torso.rotation.x = 0.22 + (z.seen?0.12:0);        // the hunch
    h.head.rotation.z = z.lean;
    h.grp.position.y = Math.abs(Math.sin(z.gait))*.03;
    if(h.eyeMat) h.eyeMat.color.setHex(z.seen||z.watched?0xff3b30:0x5a1512);
  }
  // survivors
  for(const e of dyn.survivors){
    const s=e.s,h=e.h;
    if(s.state==='out'){ h.grp.visible=false; continue; }
    h.grp.visible=true;
    h.grp.position.set(WX(s.x),0,WZ(s.y));
    if(s.state==='down'){
      h.grp.rotation.x=-Math.PI/2.1; h.grp.position.y=.16;
    } else {
      h.grp.rotation.x=0;
      const a=Math.atan2(P.y-s.y,P.x-s.x);
      h.grp.rotation.y=-a-Math.PI/2;
      const sw=s.state==='follow'?Math.sin(s.gait)*.5:0;
      h.legL.rotation.x=sw; h.legR.rotation.x=-sw;
      if(s.state==='trapped'){
        h.grp.position.y=-.34;                            // pinned low
        h.armL.rotation.z = -1.1+Math.sin(s.wave*2.2)*.5; // waving for you
        h.armR.rotation.z = 0;
      } else {
        h.grp.position.y=Math.abs(Math.sin(s.gait))*.02;
        h.armL.rotation.z=0; h.armL.rotation.x=-sw*.6; h.armR.rotation.x=sw*.6;
      }
    }
  }
  // pickups
  for(const e of dyn.items){
    e.m.visible=!e.it.taken;
    if(e.m.visible) e.m.rotation.y+=dt*.7;
  }
  syncWeapon(g);
  if(viewModel){
    const lunge=Math.sin(Math.min(1,(P.swing/(P.weapon.cd||1))/.75)*Math.PI);
    viewModel.position.set(.30-lunge*.10, -.42+P.bob*.6-lunge*.05, -.52+lunge*.26);
    viewModel.rotation.set(-1.15+lunge*.55, .25, .30);
  }
}

/* ---------------- loop ---------------- */
let frameAvg=16;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now; t+=dt;
  frameAvg+=((dt*1000)-frameAvg)*0.05;
  if(frameAvg>34 && renderer.getPixelRatio()>0.85) renderer.setPixelRatio(Math.max(0.85,renderer.getPixelRatio()-0.12));
  if(intro) updateIntro(dt);
  else if(outro) updateOutro(dt);
  else if(running) update(dt);
  syncScene(G,dt);
  renderer.render(scene,camera);
  updateHUD();
  raf=requestAnimationFrame(loop);
}

/* ---------------- HUD ---------------- */
const pipsEl=document.getElementById('pips'), countEl=document.getElementById('count');
const hpEl=document.getElementById('hp'), wepEl=document.getElementById('wep');
const hideEl=document.getElementById('hideTag'), toastEl=document.getElementById('toast');
let hudSig='';
function updateHUD(){
  if(!G) return;
  const P=G.P, sec=rescue.saved.length, wi=G.following||0, lost=rescue.lost.length;
  const sig=[sec,wi,lost,P.hp,P.weapon.key,P.hidden,G.toastT>0?G.toast:'',Math.round((G.behind||0)*10)].join('|');
  if(sig!==hudSig){
    hudSig=sig;
    let ph='';
    for(let i=0;i<4;i++){
      const cls = i<sec?'out' : i<sec+wi?'with' : i<4-lost?'' : 'gone';
      ph+=`<span class="pip ${cls}"></span>`;
    }
    pipsEl.innerHTML=ph;
    countEl.textContent=(sec+wi)+' / 4';
    let hh='';
    for(let i=0;i<4;i++) hh+=`<i class="${i<P.hp?'':'off'}"></i>`;
    hpEl.innerHTML=hh;
    wepEl.hidden = P.weapon.key==='none';
    wepEl.textContent = P.weapon.name;
    hideEl.hidden = !P.hidden;
    toastEl.textContent = G.toast||'';
    toastEl.classList.toggle('on', G.toastT>0);
    senseEl.style.opacity = (G.behind||0)*0.55;
    senseEl.style.background = `radial-gradient(ellipse at ${(G.behind||0)>0?'50%':'50%'} 120%, rgba(201,48,44,.5), transparent 60%)`;
  }
}

/* ============================================================
   audio (unchanged: everything synthesised)
   ============================================================ */
let AC=null,master=null,seaGain=null,on=false,hbPhase=0,NOISE=null;
function audio(){
  if(AC) return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  const len=AC.sampleRate*2;
  NOISE=AC.createBuffer(1,len,AC.sampleRate);
  const d=NOISE.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;

function nburst(o){

let breathPhase=0,breathIn=true;
function breathing(dt,exertion,dread,hurt){
  if(!on||!AC) return;

  breathPhase+=dt*rate;
  const lvl=.075+dread*.135+exertion*.060+hurt*.075;
  if(breathIn&&breathPhase>=.46){
    breathIn=false;
    nburst({dur:.40+.16*(1-dread),type:'bandpass',f0:520,f1:220,q:1.0,vol:lvl});
    vtone({type:'sawtooth',f0:126,f1:100,dur:.30,vol:lvl*(.34+dread*.36),cut:400,wobble:5});
  }
  if(breathPhase>=1){
    breathPhase=0; breathIn=true;
    nburst({dur:.30,type:'bandpass',f0:260,f1:800,q:1.4,vol:lvl*1.05});
    if(dread>.45) nburst({dur:.14,type:'highpass',f0:1400,f1:2600,q:.8,vol:lvl*.5});
  }
}

/* chase score */
const BPM=128,STEP=60/BPM/4,ROOT=55;
const ARP=[0,3,7,10,12,10,7,3];
const BASS=[0,0,3,0,0,0,-2,0,0,0,5,0,3,3,-2,0];
let mus={playing:false,step:0,next:0,timer:null,gain:null,level:0};
function musicInit(){
  if(mus.gain) return;
  mus.gain=AC.createGain(); mus.gain.gain.value=0;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-18; comp.ratio.value=6;
  mus.gain.connect(comp).connect(master);
}
function note(s){ return ROOT*Math.pow(2,s/12); }
function mKick(t0){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t0);
  o.frequency.exponentialRampToValueAtTime(42,t0+.09);
  g.gain.setValueAtTime(.9,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.26);
  o.connect(g).connect(mus.gain); o.start(t0); o.stop(t0+.28);
}
function mHat(t0,open){
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=7200;
  const g=AC.createGain(), d=open?.15:.045;
  g.gain.setValueAtTime(open?.16:.10,t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(f).connect(g).connect(mus.gain); s.start(t0); s.stop(t0+d+.02);
}
function mClap(t0){
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1700; f.Q.value=1.1;
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(.42,t0+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t0+.17);
  s.connect(f).connect(g).connect(mus.gain); s.start(t0); s.stop(t0+.2);
}
function mBass(t0,semi){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=note(semi);
  f.type='lowpass'; f.Q.value=7;
  f.frequency.setValueAtTime(1400,t0);
  f.frequency.exponentialRampToValueAtTime(220,t0+STEP*1.6);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(.30,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+STEP*1.85);
  o.connect(f).connect(g).connect(mus.gain); o.start(t0); o.stop(t0+STEP*2);
}
function mArp(t0,semi){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type='square'; o.frequency.value=note(semi+24);
  f.type='bandpass'; f.frequency.value=note(semi+24)*2.2; f.Q.value=3.2;
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(.13,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t0+STEP*1.4);
  o.connect(f).connect(g).connect(mus.gain); o.start(t0); o.stop(t0+STEP*1.5);
}
function musicTick(){
  if(!on||!AC||!mus.playing) return;
  const ahead=AC.currentTime+.14;
  while(mus.next<ahead){
    const t0=mus.next,s=mus.step,L=mus.level;
    if(s%4===0) mKick(t0);
    if(L>.30){ mHat(t0,s%4===2); if(s%8===4) mClap(t0); }
    if(L>.45&&s%2===0) mBass(t0,BASS[s%16]);
    if(L>.72) mArp(t0,ARP[s%8]);
    if(L>.88&&s%16===15){ mClap(t0); mClap(t0+STEP*.5); }
    mus.next+=STEP; mus.step=(s+1)%64;
  }
}
function musicStart(){
  if(!on||!AC) return;
  musicInit();
  if(mus.playing) return;
  mus.playing=true; mus.step=0; mus.next=AC.currentTime+.08;
  mus.timer=setInterval(musicTick,45);
}
function musicStop(){
  mus.playing=false;
  if(mus.timer){ clearInterval(mus.timer); mus.timer=null; }
  if(mus.gain&&AC) mus.gain.gain.setTargetAtTime(0,AC.currentTime,.25);
}
function musicSet(dt,want){
  if(!on||!AC) return;
  mus.level+=(want-mus.level)*Math.min(1,dt*1.6);
  if(mus.level>.06){
    musicStart(); musicInit();
    mus.gain.gain.setTargetAtTime(Math.min(.55,mus.level*.55),AC.currentTime,.18);
  } else if(mus.playing) musicStop();
}

function startIntro(){
  intro={start:performance.now(),t:0,beat:-1,done:false,blink:0,nextBlink:1.2};
  introEl.hidden=false; veil.hidden=true;

  G=fresh(1); buildScene(G); running=false;
  if(!raf) raf=requestAnimationFrame(loop);

function updateIntro(dt){
  const I=intro,P=G.P;
  I.t=(performance.now()-I.start)/1000;
  for(let i=0;i<BEATS.length;i++){
    const b=BEATS[i];
    if(I.t>=b.at&&I.beat<i){
      I.beat=i; lineEl.textContent=b.text; lineEl.classList.add('show');
      if(i===1) hullGroan(); else if(i===3){ zGrowl(300,.5); hush(.02,1.2); }
    }
    if(I.beat===i&&I.t>=b.at+b.hold) lineEl.classList.remove('show');
  }
  const rise=Math.max(0,Math.min(1,(I.t-11.8)/3.8));
  const e=rise<.5?2*rise*rise:1-Math.pow(-2*rise+2,2)/2;
  G.camH=0.22+e*(EYE-0.22);
  G.roll=(1-e)*0.30;
  P.a=-0.55+e*0.55;
  P.breath+=dt*(2.6-e*1.0);
  let open;
  if(I.t<11.5) open=0;
  else if(I.t<12.7) open=(I.t-11.5)/1.2*0.55;
  else open=Math.min(1,0.55+(I.t-12.7)/1.9*0.45);
  I.blink-=dt;
  if(I.blink<=0&&I.t>11.7&&I.t<16.0){ I.blink=I.nextBlink; I.nextBlink=1.0+Math.random()*1.6; }
  const blinkK=(I.blink>0&&I.blink<0.16)?(1-Math.abs(I.blink-0.08)/0.08):0;
  const shut=Math.max(0,Math.min(1,1-open+blinkK*0.85));
  lidTop.style.transform=`translateY(${-(1-shut)*100}%)`;
  lidBot.style.transform=`translateY(${(1-shut)*100}%)`;
  if(on&&I.t>10.0) breathing(dt,.25,Math.max(0,1.1-(I.t-10.0)*.22),1);
  if(on&&I.t>=12.1&&!I.coughed){ I.coughed=true; cough(); }
  if(I.t>=15.6&&!I.titled){ I.titled=true; titleEl.classList.add('show'); }
  if(I.t>=18.4&&!I.done){ I.done=true; endIntro(); }
}

  return [
    {at:0.5, hold:3.2,text:`دفعتَ القارب · نجا ${n} من أربعة`},
    {at:4.2, hold:3.4,text:n?`${who} معك على الماء`:'وحدك على الماء'},
    {at:8.0, hold:3.6,text:sick},
    {at:12.0,hold:3.6,text:'الطفيلي مصدره الماء — ونحن أتينا من الماء'},
    {at:16.0,hold:3.0,text:'كان القارب هو المكان الآمن'}
  ];
}
function startOutro(){
  outro={start:performance.now(),t:0,beat:-1,beats:outroBeats(),done:false,hit:0};
  outroEl.hidden=false; veil.hidden=true;
  whatsNextEl.classList.remove('show'); outroLine.classList.remove('show'); outroLine.textContent='';
  running=false;
  if(on){ musicStart(); musicSet(1,.35); }
  if(!raf) raf=requestAnimationFrame(loop);
}
function updateOutro(dt){
  const O=outro;
  O.t=(performance.now()-O.start)/1000;
  for(let i=0;i<O.beats.length;i++){
    const b=O.beats[i];
    if(O.t>=b.at&&O.beat<i){
      O.beat=i; outroLine.textContent=b.text; outroLine.classList.add('show');
      if(i===2&&on) zGrowl(120,-.4);
      if(i===4&&on) hush(.004,1.4);
    }
    if(O.beat===i&&O.t>=b.at+b.hold) outroLine.classList.remove('show');
  }
  if(O.t>=19.4){
    const k=Math.min(1,(O.t-19.4)/3.2);
    if(on) musicSet(dt,1);
    const flash=Math.random()<dt*(6+k*16)?.30+Math.random()*.42:0;
    strobeEl.style.opacity = flash ? flash.toFixed(2) : (parseFloat(strobeEl.style.opacity||0)*.72).toFixed(3);
    G.shake=.08+k*.10;
    if(on&&O.t-O.hit>0.34+Math.random()*.5){
      O.hit=O.t;
      Math.random()<.45?scream((Math.random()-.5)*1.6):zShriek(60,(Math.random()-.5)*1.6);
    }
  }
  if(O.t>=23.4&&!O.shown){
    O.shown=true;
    outroLine.classList.remove('show');
    whatsNextEl.classList.add('show');
    strobeEl.style.opacity=0; G.shake=0;
    if(on) musicSet(1,.55);
  }
}
function endOutro(restart){
  outro=null; outroEl.hidden=true; strobeEl.style.opacity=0;
  if(G) G.shake=0;
  if(restart) restartAll();
}
document.getElementById('outroRedo').addEventListener('click',()=>endOutro(true));

/* ---------------- boot ---------------- */
function boot(saved){
  initGL();
  if(saved&&saved.counters) counters=saved.counters;
  if(saved&&saved.strain) strain=saved.strain;
  if(saved&&saved.rescue) rescue=saved.rescue;
  const resuming=saved&&saved.screen&&saved.screen>1;
  if(!resuming&&!(saved&&saved.seenIntro)){ startIntro(); return; }
  G=fresh(saved&&saved.screen?saved.screen:1);
  buildScene(G);
  const s=SCREEN_TEXT[G.screen];
  showVeil(s.eyebrow,s.title,s.body,G.screen===1?'ابدأ':'ادخل',start);
  raf=requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({screen:G?G.screen:1,counters,strain,rescue,seenIntro:!intro}));
if(window.claude?.hot?.ready) window.claude.hot.ready(boot);
else boot(window.claude?.hot?.data??{});

})();
</script>
