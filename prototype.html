<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="نموذج أولي ثلاثي الأبعاد بمنظور أول — Surviving Thuwaliidae">
<style>
  :root{color-scheme:dark}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Surviving Thuwaliidae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Blaka+Ink&family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root{
  --void:#000000; --deep:#070707; --panel:#0c0c0d;
  --hull:#9fc6d1; --hull-dim:#41606b;
  --paper:#d9d0bc; --ink:#191410;
  --warn:#c9302c; --text:#c6d0d3; --dim:#75858a; --faint:#465358; --line:#151617; --frame:#000000;
  --ok:#7fb08a;
  --ui:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --hand:"Aref Ruqaa","Amiri",Georgia,serif;
  --smear:"Blaka Ink","Aref Ruqaa",system-ui,serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --pulp:#cfc4ac;
  --blood:#8e1f18;
}

/* ============================================================
   paper and ink: every narrative surface is a wet page, and the
   ink on it was written by a shaking hand
   ============================================================ */
.paper{
  position:relative;
  background:var(--pulp);
  background-image:
    radial-gradient(circle at 16% 20%, rgba(120,96,60,.18), transparent 44%),
    radial-gradient(circle at 80% 74%, rgba(88,68,42,.16), transparent 48%),
    repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(20,17,13,.05) 24px,rgba(20,17,13,.05) 25px);
  border:1px solid #9c8f76;
  box-shadow:0 14px 34px rgba(0,0,0,.66);
  padding:26px 30px 28px;
  max-width:min(640px,88%);
  transform:rotate(-.5deg);
}
/* the sheet has been torn out, not cut */
.paper.torn{
  clip-path:polygon(0 1.2%,3% 0,12% 1%,26% .2%,41% 1.4%,57% .3%,73% 1.2%,88% .2%,97% 1.1%,100% 2.4%,
                    99.2% 18%,100% 37%,99% 56%,100% 74%,99.3% 92%,100% 98.6%,
                    95% 100%,79% 98.9%,63% 100%,47% 98.8%,31% 99.8%,16% 98.7%,4% 99.9%,0 98%,
                    .8% 78%,0 61%,.9% 42%,0 24%,.7% 9%);
}
.paper::after{
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  background:
    radial-gradient(ellipse 70px 30px at 10% 91%, rgba(142,31,24,.36), transparent 70%),
    radial-gradient(ellipse 36px 54px at 93% 14%, rgba(142,31,24,.28), transparent 72%),
    radial-gradient(ellipse 22px 16px at 68% 96%, rgba(142,31,24,.30), transparent 74%);
}
.ink{ font-family:var(--hand); color:#14110d; }
.shaky{ filter:url(#smudge); }
.bleed{
  text-shadow:
    1px 1px 0 rgba(142,31,24,.55),
   -1px 0   0 rgba(142,31,24,.30),
    0   2px 3px rgba(142,31,24,.26);
}
.drip::before{
  content:"";position:absolute;inset-inline-end:14%;top:88%;
  width:3px;height:22px;border-radius:0 0 3px 3px;
  background:linear-gradient(to bottom,var(--blood),rgba(142,31,24,0));
  opacity:.7;
}
*{box-sizing:border-box}
body{background:var(--void);color:var(--text);font-family:var(--ui);font-weight:300;margin:0;line-height:1.6}

.shell{direction:rtl;max-width:1060px;margin:0 auto;padding-inline:20px;padding-block:24px 48px}
.masthead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px;max-width:760px;margin-inline:auto}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.4vw,34px);
   letter-spacing:.055em;line-height:1.05;margin:0;color:#ffffff;direction:ltr}
h1 .r{color:var(--warn)}
.byline{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);direction:ltr;text-transform:uppercase}
svg.defs{position:absolute;width:0;height:0;overflow:hidden}

.stage{position:relative;width:100%;max-width:760px;margin:0 auto;aspect-ratio:16/9;background:#000;
       border:1px solid var(--frame);overflow:hidden;touch-action:none;cursor:crosshair}
.stage:focus-visible{outline:2px solid var(--hull);outline-offset:2px}
canvas#cv{display:block;width:100%;height:100%}

/* ---------- screen-space grade: vignette, grain, damage, proximity ---------- */
.fx{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 38%, rgba(3,2,2,.62) 100%)}
#grain{opacity:.16;mix-blend-mode:overlay;background-repeat:repeat;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.5'/></svg>");
  animation:grainShift .28s steps(3) infinite}
@keyframes grainShift{0%{background-position:0 0}33%{background-position:-30px 14px}66%{background-position:22px -26px}100%{background-position:0 0}}
#sense{opacity:0;transition:opacity .25s ease}
#hurt{box-shadow:inset 0 0 120px 30px var(--warn);opacity:0;transition:opacity .5s ease}
#hurt.on{opacity:.55;transition:opacity .04s ease}

/* ---------- in-frame HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--ui)}
.hud .pips{position:absolute;top:12px;inset-inline-start:14px;display:flex;gap:5px}
.pip{width:11px;height:11px;border:1px solid rgba(160,176,180,.45)}
.pip.out{background:var(--ok);border-color:var(--ok)}
.pip.with{background:#e0ce8c;border-color:#e0ce8c}
.pip.gone{border-color:rgba(201,48,44,.75);position:relative;background:
  linear-gradient(45deg,transparent 43%,var(--warn) 43%,var(--warn) 57%,transparent 57%),
  linear-gradient(-45deg,transparent 43%,var(--warn) 43%,var(--warn) 57%,transparent 57%)}
.hud .count{position:absolute;top:29px;inset-inline-start:14px;
  font-family:var(--mono);font-size:11px;color:rgba(190,200,203,.6);direction:ltr}
.hud .hp{position:absolute;top:12px;inset-inline-end:14px;display:flex;gap:5px;flex-direction:row-reverse}
.hp i{width:9px;height:9px;background:var(--warn);display:block}
.hp i.off{background:rgba(201,48,44,.18)}
.hud .wep{position:absolute;top:30px;inset-inline-end:14px;font-size:11.5px;color:rgba(200,190,164,.75)}
.hud .hide{position:absolute;top:50px;inset-inline-start:14px;font-size:11.5px;color:rgba(159,198,209,.85)}
.hud .toast{position:absolute;bottom:34px;left:0;right:0;text-align:center;
  font-size:13px;color:rgba(228,218,190,.95);opacity:0;transition:opacity .3s ease;
  text-shadow:0 2px 12px rgba(0,0,0,.9)}
.hud .toast.on{opacity:1}
.hud [hidden]{display:none!important}

/* ---------- overlays ---------- */
/* ---------- thumb controls, only where there are thumbs ---------- */
.pad,.acts{position:absolute;bottom:12px;display:none;z-index:6;user-select:none;-webkit-user-select:none}
.pad{inset-inline-start:12px;display:none;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px}
.acts{inset-inline-end:12px;flex-direction:column;gap:6px}
.stage.touch .pad{display:grid}
.stage.touch .acts{display:flex}
.k{
  background:rgba(12,14,16,.52);border:1px solid rgba(180,196,200,.30);
  color:#dde5e7;border-radius:4px;font-size:15px;line-height:1;
  display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:none;
  backdrop-filter:blur(2px);
}
.k:active,.k.on{background:rgba(159,198,209,.78);color:#05080a;border-color:#9fc6d1}
.k.up{grid-area:1/2} .k.left{grid-area:2/1} .k.right{grid-area:2/3} .k.down{grid-area:3/2}
.k.wide{width:74px;height:38px;font-family:var(--ui);font-size:12.5px;font-weight:500}
.k:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- turn the phone ---------- */
.tilt{
  position:absolute;inset:0;z-index:30;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(3,5,7,.94);text-align:center;padding:24px;
}
.tilt p{margin:0;font-family:var(--display);font-size:19px;color:#dde5e7}
.tilt span{font-size:12.5px;color:var(--dim);max-width:30ch}
@media (orientation:portrait) and (pointer:coarse){ .tilt{display:flex} }

.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px;cursor:default;
  background:radial-gradient(ellipse at 50% 60%, rgba(5,8,10,.74), rgba(5,8,10,.95) 70%)}
.veil[hidden]{display:none!important}
.veil .paper{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.veil h2{font-family:var(--hand);font-weight:700;font-size:clamp(21px,3.8vw,31px);margin:0;color:#14110d;text-wrap:balance;line-height:1.4}
.veil p{margin:0;max-width:44ch;font-family:var(--hand);font-size:clamp(14px,2.1vw,17px);line-height:1.85;color:#241d16;text-wrap:pretty}
.veil .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:#7a6d58;text-transform:uppercase;direction:ltr}

button{font-family:inherit}
.btn{font-family:var(--ui);font-weight:500;font-size:14px;color:var(--void);background:var(--hull);
  border:none;padding:11px 26px;border-radius:2px;cursor:pointer;transition:background .15s ease,transform .15s ease}
.btn:hover{background:#b9d9e2}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

.intro{position:absolute;inset:0;overflow:hidden}
.intro[hidden]{display:none!important}
.intro .lid{position:absolute;left:0;right:0;background:#03060a;height:52%}
.intro .lid.top{top:0}
.intro .lid.bot{bottom:0}
/* narration arrives as a torn page held up in the dark */
.intro .lineWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:22px;opacity:0;pointer-events:none}
.intro .lineWrap.show{opacity:1;transition:opacity .9s ease}
.intro .line{margin:0;text-align:center;font-family:var(--hand);font-weight:700;
  font-size:clamp(16px,3vw,26px);line-height:1.6;color:#14110d;text-wrap:balance}
.intro .titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;opacity:0;pointer-events:none}
.intro .titlecard.show{opacity:1;transition:opacity 1.1s ease}
.intro .tk{font-family:var(--display);font-weight:400;letter-spacing:.30em;font-size:clamp(11px,2vw,15px);
  color:#7d9aa3;direction:ltr;text-transform:uppercase}
/* the title keeps the original geometric kufic — it is the one thing that stays steady */
.intro .tk.big{font-family:var(--display);font-weight:700;letter-spacing:.055em;text-transform:none;
  font-size:clamp(26px,6.4vw,50px);color:#ffffff;
  text-shadow:0 0 38px rgba(255,255,255,.18)}
.intro .tk.big .r{color:var(--warn)}
.intro .skip{position:absolute;bottom:12px;inset-inline-end:14px;background:rgba(8,12,15,.6);color:var(--dim);
  border:1px solid var(--line);border-radius:2px;padding:6px 13px;font-size:11.5px;cursor:pointer}
.intro .skip:hover{color:var(--text);border-color:var(--faint)}
.intro .sndhint{position:absolute;bottom:15px;inset-inline-start:14px;margin:0;font-size:11px;color:var(--faint)}

.outro{background:#03060a}
.outro .strobe{position:absolute;inset:0;background:var(--warn);opacity:0;mix-blend-mode:screen}
.whatsnext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;opacity:0;pointer-events:none}
.whatsnext.show{opacity:1;pointer-events:auto;transition:opacity .9s ease}
.whatsnext .paper{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;transform:rotate(.6deg)}
.whatsnext svg{filter:drop-shadow(0 2px 6px rgba(142,31,24,.4))}
.wn-k{font-family:var(--smear);font-weight:400;font-size:clamp(26px,6vw,46px);color:#14110d;line-height:1.35;
  text-shadow:2px 2px 0 rgba(142,31,24,.6), -2px 1px 0 rgba(142,31,24,.34)}
.wn-s{font-family:var(--hand);font-size:clamp(13px,2.2vw,16px);color:#3a2f24;letter-spacing:.02em}
.whatsnext .btn{margin-top:12px}

.bar{display:flex;gap:9px;justify-content:flex-end;padding-top:12px;flex-wrap:wrap;max-width:760px;margin:0 auto}
.tog{font-size:12px;color:var(--dim);background:transparent;border:1px solid var(--line);
  padding:6px 14px;border-radius:2px;cursor:pointer;transition:color .15s ease,border-color .15s ease}
.tog:hover{color:var(--text);border-color:var(--faint)}
.tog[aria-pressed="true"]{color:var(--hull);border-color:var(--hull-dim)}
.tog:focus-visible{outline:2px solid var(--hull);outline-offset:2px}

.jump{display:flex;gap:6px;margin:10px 0 2px}
.jump button{flex:1;font-family:var(--mono);font-size:10px;background:rgba(25,20,16,.08);color:#5d5348;
  border:1px solid rgba(25,20,16,.3);border-radius:2px;padding:5px 0;cursor:pointer}
.jump button:hover{background:rgba(25,20,16,.16);color:var(--ink)}
.jump button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.crewline{display:flex;justify-content:space-between;gap:8px;font-family:var(--hand);font-size:13.5px;color:#2a231c;padding:1px 0}
.crewline .s{font-family:var(--mono);font-size:9px;letter-spacing:.06em;align-self:center}
.crewline.out .s{color:#3f6b48}
.crewline.with .s{color:#2f5c6b}
.crewline.gone{opacity:.55}
.crewline.gone .n{text-decoration:line-through}
.crewline.gone .s{color:#8f2f2a}

.book{position:fixed;left:18px;bottom:18px;width:min(292px,calc(100vw - 36px));max-height:min(330px,52vh);
  display:flex;flex-direction:column;background:var(--paper);color:var(--ink);
  transform:translateY(calc(100% + 24px)) rotate(-.7deg);opacity:0;pointer-events:none;
  transition:transform .34s cubic-bezier(.22,.61,.36,1),opacity .24s ease;z-index:40;direction:rtl;
  box-shadow:0 16px 40px rgba(0,0,0,.66);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 21px,rgba(25,20,16,.07) 21px,rgba(25,20,16,.07) 22px)}
.book.open{transform:translateY(0) rotate(-.7deg);opacity:1;pointer-events:auto}
.book-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 8px 7px 11px;border-bottom:1px solid rgba(25,20,16,.24);background:rgba(25,20,16,.06)}
.book-bar .tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:#6b5f52;direction:ltr}
.book-scroll{overflow-y:auto;padding:12px 14px 16px}
.book h2{font-family:var(--hand);font-size:19px;font-weight:700;margin:0 0 6px;color:var(--ink);line-height:1.25}
.book .said{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b5f52;direction:ltr;text-align:right}
.book hr{border:none;border-top:1px solid rgba(25,20,16,.22);margin:10px 0}
.book p,.book li{font-family:var(--hand);font-size:13.5px;line-height:1.62;color:#2a231c}
.book p{margin:0 0 8px}
.book .plate{border:1px solid rgba(25,20,16,.3);padding:9px 10px;margin:10px 0;background:rgba(25,20,16,.05)}
.book .plate .cap{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:#6b5f52;margin-bottom:4px;direction:ltr;text-align:right}
.book .strike{text-decoration:line-through;opacity:.55}
.book .scrawl{font-family:var(--hand);font-style:italic;color:#8f2f2a;font-size:13.5px;line-height:1.5;transform:rotate(-.5deg);display:block;margin:9px 0 4px}
.book-close{flex:none;background:var(--ink);color:var(--paper);border:none;width:30px;height:30px;
  border-radius:2px;cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;
  -webkit-tap-highlight-color:transparent}
.book-close:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

@media (max-width:720px){
  .shell{padding-block:18px 36px}
  /* a slip, not a curtain: it must never swallow the screen or bury its own ✕ */
  .book{left:10px;bottom:10px;width:min(270px,74vw);max-height:38vh}
  .book-scroll{padding:10px 12px 12px}
  .book h2{font-size:17px}
  .book p,.book li,.book .scrawl{font-size:12.5px;line-height:1.55}
  .book-bar{padding:6px 6px 6px 10px}
  .book-close{width:38px;height:38px;font-size:16px}   /* a real thumb target */
  .jump button{padding:9px 0;font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  #grain{animation:none}
}
</style>

</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <filter id="smudge" x="-12%" y="-14%" width="124%" height="128%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028 0.06" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="shell">
  <header class="masthead">
    <h1>SURV<span class="r">I</span>V<span class="r">I</span>NG THUWAL<span class="r">II</span>DAE</h1>
    <span class="byline">samahkjj-cloud</span>
  </header>

  <div class="stage" id="stage" tabindex="0" role="application"
       aria-label="نموذج اللعبة بمنظور أول — تقدّم بـ W، التفت بالأسهم، اقفز بالمسافة، أو اسحب بإصبعك">
    <canvas id="cv"></canvas>

    <div class="fx" id="sense"></div>
    <div class="fx" id="vig"></div>
    <div class="fx" id="grain"></div>
    <div class="fx" id="hurt"></div>

    <div class="hud" id="hud">
      <div class="pips" id="pips"></div>
      <div class="count" id="count">0 / 4</div>
      <div class="hp" id="hp"></div>
      <div class="wep" id="wep" hidden></div>
      <div class="hide" id="hideTag" hidden>مختبئ</div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="pad" id="padMove" aria-hidden="true">
      <button class="k up"    data-k="w" aria-label="تقدّم">▲</button>
      <button class="k left"  data-k="a" aria-label="يسار">◀</button>
      <button class="k right" data-k="d" aria-label="يمين">▶</button>
      <button class="k down"  data-k="s" aria-label="تراجع">▼</button>
    </div>
    <div class="acts" id="padActs" aria-hidden="true">
      <button class="k wide" data-k="run"  aria-label="ركض">ركض</button>
      <button class="k wide" data-k="jump" aria-label="قفز">قفز</button>
      <button class="k wide" data-k="pick" aria-label="التقاط">التقاط</button>
    </div>

    <div class="tilt" id="tilt">
      <svg viewBox="0 0 64 64" width="58" height="58" aria-hidden="true">
        <rect x="23" y="6" width="18" height="34" rx="3" fill="none" stroke="#9fc6d1" stroke-width="2.4"/>
        <path d="M14 46 a20 20 0 0 0 36 0" fill="none" stroke="#c9302c" stroke-width="2.4"
              stroke-linecap="round" stroke-dasharray="3 4"/>
        <path d="M46 40 l5 7 l-8 1 z" fill="#c9302c"/>
      </svg>
      <p>أدِر جوالك أفقياً</p>
      <span>الشاشة العريضة تُظهر ما يقترب من الجانب</span>
    </div>

    <div class="intro" id="intro">
      <div class="lid top" id="lidTop"></div>
      <div class="lid bot" id="lidBot"></div>
      <div class="lineWrap" id="introWrap">
        <div class="paper torn"><p class="line ink shaky bleed" id="introLine"></p></div>
      </div>
      <div class="titlecard" id="titleCard">
        <span class="tk">Surviving</span>
        <span class="tk big">THUWAL<span class="r">II</span>DAE</span>
      </div>
      <button class="skip" id="skipBtn">تخطّي</button>
      <p class="sndhint">شغّل «الصوت» بالأسفل — نصف الرعب في السمع</p>
    </div>

    <div class="intro outro" id="outro" hidden>
      <div class="strobe" id="strobe"></div>
      <div class="lineWrap" id="outroWrap">
        <div class="paper torn"><p class="line ink shaky bleed" id="outroLine"></p></div>
      </div>
      <div class="whatsnext" id="whatsNext">
        <div class="paper torn">
          <svg viewBox="0 0 48 48" width="42" height="42" aria-hidden="true">

<script>
(function(){
"use strict";

const stage=document.getElementById('stage');
const cv=document.getElementById('cv');
const veil=document.getElementById('veil');
const hurtEl=document.getElementById('hurt');
const senseEl=document.getElementById('sense');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* world units are ~3cm; S converts them to metres for the 3D scene */
const S=0.03, EYE=1.66;
const WX=x=>x*S, WZ=y=>y*S;

/* ============================================================
   procedural materials
   ============================================================ */
function rng(seed){ let s=seed>>>0; return ()=> (s=(s*1664525+1013904223)>>>0)/4294967296; }
function makeTex(w,h,paint){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  paint(c.getContext('2d'),w,h);
  return c;
}
function grit(x,w,h,seed,n,lo,hi,dark){
  const r=rng(seed);
  for(let i=0;i<n;i++){
    const a=lo+r()*(hi-lo);
    x.fillStyle=dark?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`;
    x.fillRect((r()*w)|0,(r()*h)|0,1+((r()*2)|0),1);
  }
}
const TEX={};
function buildTextures(){
  TEX.plank=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#8a7050'; x.fillRect(0,0,w,h);
    const r=rng(11);
    for(let i=0;i<8;i++){
      const y=i*32;
      x.fillStyle=`rgb(${118+r()*46|0},${92+r()*38|0},${62+r()*30|0})`;
      x.fillRect(0,y,w,29);
      x.fillStyle='rgba(30,20,12,.6)'; x.fillRect(0,y+29,w,3);
      for(let k=0;k<50;k++){
        x.fillStyle=`rgba(46,32,20,${.05+r()*.15})`;
        x.fillRect(r()*w,y+r()*29,10+r()*60,1+r()*2);
      }
    }
    grit(x,w,h,7,900,.02,.11,true);
  });
  TEX.concrete=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#8d9598'; x.fillRect(0,0,w,h);
    const r=rng(23);
    for(let i=0;i<340;i++){
      x.fillStyle=`rgba(${90+r()*62|0},${98+r()*58|0},${100+r()*56|0},${.22+r()*.36})`;
      const s=6+r()*34; x.fillRect(r()*w,r()*h,s,s*(.4+r()*.8));
    }
    for(let i=0;i<7;i++){ x.fillStyle=`rgba(46,58,62,${.10+r()*.14})`; x.fillRect(r()*w,0,3+r()*10,h); }
    grit(x,w,h,29,1400,.02,.12,true);
    grit(x,w,h,31,600,.02,.09,false);
  });
  TEX.hull=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#d5dcdc'; x.fillRect(0,0,w,h);
    x.fillStyle='#9fc6d1'; x.fillRect(0,h*.54,w,h*.28);
    x.fillStyle='#2f3d40'; x.fillRect(0,h*.49,w,7);
    const r=rng(41);
    for(let i=0;i<260;i++){
      x.fillStyle=`rgba(${60+r()*70|0},${70+r()*60|0},${70+r()*60|0},${.04+r()*.18})`;
      x.fillRect(r()*w,h*.5+r()*h*.5,6+r()*40,2+r()*5);
    }
    grit(x,w,h,43,700,.02,.08,true);
  });
  TEX.plaster=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#a3937b'; x.fillRect(0,0,w,h);
    const r=rng(59);
    for(let i=0;i<460;i++){
      x.fillStyle=`rgba(${120+r()*70|0},${104+r()*60|0},${82+r()*54|0},${.16+r()*.3})`;
      x.fillRect(r()*w,r()*h,10+r()*48,6+r()*30);
    }
    grit(x,w,h,61,1100,.02,.1,true);
  });
  // a soft falloff disc — without a map a sprite draws as a hard white square
  TEX.glow=makeTex(128,128,(x,w,h)=>{
    const g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(.28,'rgba(255,255,255,.55)');
    g.addColorStop(.62,'rgba(255,255,255,.14)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g; x.fillRect(0,0,w,h);
  });

  // drowned flesh: grey-green, blotched, with veins showing through
  TEX.flesh=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#7e8574'; x.fillRect(0,0,w,h);
    const r=rng(131);
    for(let i=0;i<300;i++){
      const g=r();
      x.fillStyle = g>.72 ? `rgba(${(96+r()*30)|0},${(104+r()*26)|0},${(84+r()*22)|0},${.25+r()*.4})`
                          : `rgba(${(58+r()*28)|0},${(64+r()*26)|0},${(52+r()*22)|0},${.2+r()*.4})`;
      const s=8+r()*46;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*(.4+r()*.7),r()*3,0,6.28); x.fill();
    }
    for(let i=0;i<46;i++){                       // veins
      x.strokeStyle=`rgba(${(52+r()*26)|0},${(40+r()*24)|0},${(58+r()*30)|0},${.16+r()*.26})`;
      x.lineWidth=.8+r()*1.6;
      x.beginPath();
      let px=r()*w, py=r()*h;
      x.moveTo(px,py);
      for(let k=0;k<5;k++){ px+=(r()-.5)*50; py+=(r()-.5)*50; x.lineTo(px,py); }
      x.stroke();
    }
    for(let i=0;i<24;i++){                       // wounds
      x.fillStyle=`rgba(${(72+r()*44)|0},${(14+r()*14)|0},${(12+r()*12)|0},${.3+r()*.45})`;
      const s=3+r()*13;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*(.35+r()*.5),r()*3,0,6.28); x.fill();
    }
    grit(x,w,h,137,600,.02,.12,true);
  });
  // what is left of their clothes
  TEX.rag=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#3a352c'; x.fillRect(0,0,w,h);
    const r=rng(149);
    for(let i=0;i<220;i++){
      x.fillStyle=`rgba(${(30+r()*40)|0},${(28+r()*34)|0},${(24+r()*28)|0},${.3+r()*.5})`;
      x.fillRect(r()*w,r()*h,8+r()*44,4+r()*26);
    }
    for(let i=0;i<30;i++){                       // dried blood down the front
      x.fillStyle=`rgba(${(60+r()*40)|0},${(12+r()*12)|0},${(10+r()*10)|0},${.22+r()*.4})`;
      x.fillRect(r()*w,r()*h,3+r()*10,14+r()*54);
    }
    grit(x,w,h,151,700,.02,.14,true);
  });

  TEX.sand=makeTex(512,512,(x,w,h)=>{
    x.fillStyle='#6d6154'; x.fillRect(0,0,w,h);
    const r=rng(71);
    for(let i=0;i<9000;i++){
      const g=r();
      x.fillStyle = g>.88 ? `rgba(206,214,216,${.2+r()*.5})`
                 : g>.56 ? `rgba(52,42,34,${.25+r()*.45})`
                         : `rgba(94,82,68,${.18+r()*.4})`;
      const s=1.5+r()*5;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*.72,r()*3,0,6.28); x.fill();
    }
  });
  TEX.dirt=makeTex(512,512,(x,w,h)=>{
    x.fillStyle='#6a5943'; x.fillRect(0,0,w,h);
    const r=rng(83);
    for(let i=0;i<6200;i++){
      x.fillStyle=`rgba(${(58+r()*72)|0},${(46+r()*60)|0},${(32+r()*46)|0},${.22+r()*.42})`;
      const s=1.5+r()*6;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*.7,0,0,6.28); x.fill();
    }
    for(let i=0;i<220;i++){ x.fillStyle=`rgba(198,206,204,${.08+r()*.2})`; x.fillRect(r()*w,r()*h,2,2); }
  });
  TEX.tile=makeTex(512,512,(x,w,h)=>{
    x.fillStyle='#79838a'; x.fillRect(0,0,w,h);
    const r=rng(97);
    for(let gy=0;gy<4;gy++) for(let gx=0;gx<4;gx++){
      const px=gx*128, py=gy*128;
      x.fillStyle=`rgb(${(106+r()*26)|0},${(114+r()*24)|0},${(118+r()*24)|0})`;
      x.fillRect(px+5,py+5,118,118);
      for(let i=0;i<160;i++){
        x.fillStyle=`rgba(${(70+r()*60)|0},${(78+r()*58)|0},${(82+r()*56)|0},${.14+r()*.26})`;
        x.fillRect(px+6+r()*112,py+6+r()*112,2+r()*8,2+r()*5);
      }
    }
    x.fillStyle='rgba(28,34,38,.8)';
    for(let i=0;i<=4;i++){ x.fillRect(0,i*128-2,w,5); x.fillRect(i*128-2,0,5,h); }
    grit(x,w,h,101,900,.02,.09,true);
  });
}
buildTextures();

/* ============================================================
   game state (unchanged logic, now driving a 3D scene)
   ============================================================ */
const STRAINS={
  engage :{key:'engage', name:'جِلد متيبّس', said:'RIGID DERMIS',
           note:'واجهتَه كثيراً. تصلّبت طبقته الخارجية — الضربة الواحدة لم تعد تكفي.'},
  stealth:{key:'stealth',name:'حاسّة صدى',  said:'ECHO SENSE',
           note:'اختبأت كثيراً. فقد بصره تماماً وطوّر سمعاً يلتقط نفَسك — صار يفتّش المخابئ.'},
  flee   :{key:'flee',   name:'أوتار أطول', said:'LENGTHENED TENDONS',
           note:'ركضتَ كثيراً. استطالت أوتاره — يسبقك في المستقيم. الهرب لم يعد خياراً.'}
};
const WEAPONS={
  none :{key:'none', name:'أعزل',  said:'UNARMED', reach:0,  cd:0,   dmg:0},
  knife:{key:'knife',name:'سكين',  said:'KNIFE',   reach:26, cd:.34, dmg:1},
  oar  :{key:'oar',  name:'مجداف', said:'OAR',     reach:40, cd:.52, dmg:1},
  spear:{key:'spear',name:'رمح',   said:'SPEAR',   reach:64, cd:.78, dmg:2}
};
const CREW=[
  {name:'نورة',role:'مهندسة السفينة',screen:1},
  {name:'فهد', role:'بحّار',          screen:2},
  {name:'ماجد',role:'طبّاخ السفينة',  screen:2},
  {name:'سارة',role:'ضابطة الملاحة',  screen:3}
];
let rescue={saved:[],lost:[]};
function markSaved(n){ pull(n); if(!rescue.saved.includes(n)) rescue.saved.push(n); }
function markLost(n){ pull(n); if(!rescue.lost.includes(n)) rescue.lost.push(n); }
function pull(n){ rescue.saved=rescue.saved.filter(x=>x!==n); rescue.lost=rescue.lost.filter(x=>x!==n); }
function clearFrom(screen){
  const names=CREW.filter(c=>c.screen>=screen).map(c=>c.name);
  rescue.saved=rescue.saved.filter(n=>!names.includes(n));
  rescue.lost =rescue.lost.filter(n=>!names.includes(n));
}

let G,keys={},raf=null,last=0,running=false,t=0;
let counters={engage:0,stealth:0,flee:0}, strain=null;

function fresh(screen){
  const g={
    screen, over:false, W:960, H:540,
    P:{x:0,y:0,a:0,r:9,hp:4,iframe:0,hidden:false,bob:0,breath:0,step:0,
       z:0,vz:0,air:false,
       weapon:WEAPONS.none,atkCd:0,swing:0,pickup:0},
    solids:[], covers:[], items:[], infected:[], survivors:[], boats:[],
    exit:null, sign:null, following:0, toast:'', toastT:0,
    camH:EYE, roll:0, shake:0, dread:0, lightJitter:1,
    sky:'beach', fogColor:0x697377, fogDensity:.030, ambient:.62, torch:1.0
  };
  if(screen===1) buildBeach(g);
  if(screen===2) buildMarket(g);
  if(screen===3) buildCorniche(g);
  return g;
}
function box(g,x,y,w,d,h,tex,tint){ g.solids.push({x,y,w,d,h,tex,tint:tint||1}); }
function boat(g,cx,cy,len,beam,rot){ g.boats.push({cx,cy,len,beam,rot}); g.solids.push({x:cx-len/2,y:cy-beam/2,w:len,d:beam,h:46,ghost:true}); }
function mkSurvivor(x,y,name){
  return {x,y,r:9,name,state:'trapped',hp:2,hurtCd:0,voice:1.2+Math.random()*2,
          gait:Math.random()*6.28,wave:Math.random()*6.28};
}
function mkInfected(x,y,st,scale){
  const k=scale||1;
  const b={x,y,r:11,hp:2,aggro:0,seen:false,watched:false,speed:80*k,sense:240*k,
           hitCd:0,stagger:0,atk:0,strain:st,ring:0,home:{x,y},wander:Math.random()*6.28,
           moan:0,lunge:0,gait:Math.random()*6.28,lean:(Math.random()-.5)*.25};
  if(st==='engage'){ b.hp=4; b.speed=74*k; }
  if(st==="stealth"){ b.sense=360*k; b.speed=84*k; }
  if(st==='flee'){ b.speed=124*k; }
  return b;
}

function buildBeach(g){
  g.W=1700; g.H=940;
  g.P.x=150; g.P.y=800; g.P.a=-0.5;
  g.sky='beach'; g.floor=TEX.sand; g.floorRepeat=64;
  g.fogColor=0x6d3f2e; g.fogDensity=.019; g.ambient=.34; g.torch=.5;
  g.sunset=true;
  // your ship, on the reef where it died — the reason for everything that follows
  g.wrecks=[
    {x: 880,y:-430,len:1040,beam:320,rot: 0.16,tilt: 0.40,mast:true},
    {x:1560,y:-620,len: 430,beam:250,rot:-0.55,tilt:-0.30,mast:false}
  ];
  // debris washes ashore in a line pointing back at the wreck
  const DEB=[[300,300,58],[420,250,40],[560,330,52],[240,430,44],[700,240,62],
             [880,300,48],[1020,250,54],[1180,340,42],[1320,270,58],[620,470,38],
             [980,430,46],[1420,520,50],[380,610,42],[760,650,54]];
  for(const d of DEB) box(g,d[0],d[1],d[2],d[2]*0.7,26+((d[0]*7)%22),TEX.plank,.8);
  boat(g, 470,560,270,98,-0.10);
  boat(g, 820,330,250,90, 0.14);
  boat(g,1180,690,265,95,-0.06);
  boat(g,1420,380,240,88, 0.20);
  boat(g, 700,880,230,84,-0.16);
  // a rock spine closes the far end of the beach; one gap in it is the way inland,
  // and nothing marks it — you have to walk the wall to find the break
  for(let y=0;y<940;y+=70){
    if(y>=610 && y<760) continue;                       // the gap
    const jag=(y*37%53)-26;
    box(g,1520+jag*0.5,y,70+ (y*13%40),70,88+((y*29)%46),TEX.concrete,.72);
  }
  g.items.push({x:420,y:760,kind:'knife',taken:false});
  g.items.push({x:980,y:520,kind:'oar',taken:false});
  g.survivors.push(mkSurvivor(1480,170,'نورة'));
  g.infected.push(mkInfected( 760,240,null,.72));
  g.infected.push(mkInfected(1150,470,null,.80));
  g.infected.push(mkInfected(1340,830,null,.72));
  g.exit={x:1600,y:615,w:100,h:140,locked:true};
  // the villagers marked the path inland: two posts and a storm lantern still burning
  g.gate={x:1600,y:686};
}
function buildMarket(g){
  g.W=1800; g.H=1020;
  g.P.x=90; g.P.y=510; g.P.a=0;
  g.sky='market'; g.floor=TEX.dirt; g.floorRepeat=64;
  g.fogColor=0x120e0a; g.fogDensity=.062; g.ambient=.085; g.torch=1.5;
  for(let r=0;r<5;r++){
    const y=140+r*180;
    for(let c=0;c<6;c++){
      const x=250+c*250;
      if((r+c)%4===3) continue;
      box(g,x,y,78,78,64,TEX.plank);
      box(g,x,y+86,78,62,58,TEX.plank,.9);
    }
  }
  box(g,0,0,g.W,14,170,TEX.plaster);
  box(g,0,g.H-14,g.W,14,170,TEX.plaster);
  box(g,0,0,14,g.H,170,TEX.plaster);
  box(g,g.W-14,0,14,g.H,170,TEX.plaster);
  g.covers.push({x:560,y:640,w:150,h:110});
  g.covers.push({x:1120,y:250,w:160,h:110});
  g.covers.push({x:1500,y:700,w:150,h:110});
  g.covers.push({x:380,y:250,w:150,h:104});
  g.items.push({x:180,y:220,kind:'oar',taken:false});
  g.items.push({x:700,y:900,kind:'knife',taken:false});
  g.items.push({x:1180,y:520,kind:'spear',taken:false});
  g.survivors.push(mkSurvivor(1660,170,'فهد'));
  g.survivors.push(mkSurvivor(220,930,'ماجد'));
  g.infected.push(mkInfected( 620,300,null));
  g.infected.push(mkInfected(1030,760,null));
  g.infected.push(mkInfected(1420,380,null,.88));
  g.infected.push(mkInfected( 860,560,null,.88));
  g.infected.push(mkInfected(1600,880,null));
  g.infected.push(mkInfected( 380,700,null,.8));
  g.exit={x:1680,y:880,w:110,h:130,locked:false};
}
function buildCorniche(g){
  g.W=1800; g.H=1000;
  g.sky='night'; g.floor=TEX.tile; g.floorRepeat=34;
  g.fogColor=0x030508; g.fogDensity=.078; g.ambient=.028; g.torch=1.7;
  box(g,0,60,g.W,16,52,TEX.concrete);
  for(let i=0;i<7;i++) box(g,180+i*230,150,26,26,150,TEX.concrete,.8);
  for(let i=0;i<5;i++) box(g,300+i*300,430,140,34,44,TEX.concrete,.85);
  for(let i=0;i<4;i++) box(g,420+i*340,760,140,34,44,TEX.concrete,.85);
  box(g,900,250,40,40,190,TEX.concrete,.8);
  g.covers.push({x:240,y:300,w:130,h:96});
  g.covers.push({x:780,y:600,w:140,h:100});
  g.covers.push({x:1320,y:280,w:140,h:100});
  g.covers.push({x:1080,y:860,w:140,h:96});
  g.sign={x:1560,y:200};
  g.items.push({x:340,y:640,kind:'spear',taken:false});
  g.items.push({x:1120,y:420,kind:'knife',taken:false});
  g.items.push({x:1480,y:820,kind:'spear',taken:false});
  g.survivors.push(mkSurvivor(1520,270,'سارة'));
  g.infected.push(mkInfected(1380,340,strain));
  g.infected.push(mkInfected( 900,620,strain));
  g.infected.push(mkInfected(1650,700,strain));
  g.infected.push(mkInfected( 560,300,strain,.9));
  g.infected.push(mkInfected(1150,880,strain,.9));
  g.infected.push(mkInfected( 700,880,strain,.85));
  g.infected.push(mkInfected(1700,420,strain,.85));
  boat(g,150,220,260,96,0.25);
  g.P.x=1700; g.P.y=900; g.P.a=Math.PI;
  g.exit={x:20,y:120,w:200,h:180,locked:false};
}

/* ---------------- input ---------------- */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k]=true;
  if(k==='escape') closeBook();
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

let moveP=null,lookP=null;
stage.addEventListener('pointerdown',e=>{
  if(!running || e.target.closest('button')) return;
  stage.setPointerCapture(e.pointerId);
  stage.focus({preventScroll:true});
  const r=stage.getBoundingClientRect();
  const lx=e.clientX-r.left, ly=e.clientY-r.top;
  const rec={id:e.pointerId,ox:lx,oy:ly,x:lx,y:ly};
  if(lx<r.width/2) moveP=rec; else lookP=rec;
});
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect();
  const lx=e.clientX-r.left, ly=e.clientY-r.top;
  if(moveP&&moveP.id===e.pointerId){ moveP.x=lx; moveP.y=ly; }
  if(lookP&&lookP.id===e.pointerId){ lookP.x=lx; lookP.y=ly; }
});
function dropP(e){
  if(moveP&&moveP.id===e.pointerId) moveP=null;
  if(lookP&&lookP.id===e.pointerId) lookP=null;
}
stage.addEventListener('pointerup',dropP);
stage.addEventListener('pointercancel',dropP);

/* ---------- on-screen controls ---------- */
let pickWanted=false;
function bindPad(){
  const coarse = matchMedia('(pointer:coarse)').matches || innerWidth<760;
  if(coarse) stage.classList.add('touch');
  const press=(el,on)=>{
    const k=el.dataset.k;
    el.classList.toggle('on',on);
    if(k==='run'){ keys['shift']=on; return; }
    if(k==='jump'){ if(on) keys[' ']=true; else keys[' ']=false; return; }
    if(k==='pick'){ if(on) pickWanted=true; return; }
    keys[k]=on;
  };
  document.querySelectorAll('.pad .k, .acts .k').forEach(el=>{
    // pointer events so a thumb can slide off a button without sticking it down
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); el.setPointerCapture(e.pointerId); press(el,true); stage.focus({preventScroll:true}); });
    el.addEventListener('pointerup',  e=>{ e.preventDefault(); press(el,false); });
    el.addEventListener('pointercancel',()=>press(el,false));
    el.addEventListener('lostpointercapture',()=>press(el,false));
    el.addEventListener('contextmenu',e=>e.preventDefault());
  });
}

function readMove(){
  let f=0,s=0;
  if(keys['w']||keys['arrowup']) f+=1;
  if(keys['s']||keys['arrowdown']) f-=1;
  if(keys['d']) s+=1;
  if(keys['a']) s-=1;
  if(moveP){
    const vx=moveP.x-moveP.ox, vy=moveP.y-moveP.oy, d=Math.hypot(vx,vy);
    if(d>10){ f+=-vy/d; s+=vx/d; }
  }
  const m=Math.hypot(f,s);
  return m>1?{f:f/m,s:s/m}:{f,s};
}
function readTurn(dt){
  let r=0;
  if(keys['arrowleft']) r-=1;
  if(keys['arrowright']) r+=1;
  let turn=r*2.1*dt;
  if(lookP){ turn+=(lookP.x-lookP.ox)*0.0042; lookP.ox=lookP.x; }
  return turn;
}

/* ---------------- collision ---------------- */
function hitsRect(cx,cy,rad,o){
  const nx=Math.max(o.x,Math.min(cx,o.x+o.w));
  const ny=Math.max(o.y,Math.min(cy,o.y+(o.d!==undefined?o.d:o.h)));
  return (cx-nx)**2+(cy-ny)**2 < rad*rad;
}
function inRect(cx,cy,o){ return cx>o.x&&cx<o.x+o.w&&cy>o.y&&cy<o.y+o.h; }
/* anything shorter than your feet is no longer in the way — that is what jumping buys */
function slide(g,e,dx,dy){
  const foot=e.z||0;
  const rs=g.solids.filter(o=>o.h>foot+4);
  const stuck=rs.some(o=>hitsRect(e.x,e.y,e.r,o));
  e.x+=dx;
  if(!stuck) for(const o of rs) if(hitsRect(e.x,e.y,e.r,o)){ e.x-=dx; break; }
  e.y+=dy;
  if(!stuck) for(const o of rs) if(hitsRect(e.x,e.y,e.r,o)){ e.y-=dy; break; }
  e.x=Math.max(e.r,Math.min(g.W-e.r,e.x));
  e.y=Math.max(e.r,Math.min(g.H-e.r,e.y));
}
function toCam(g,wx,wy){
  const dx=wx-g.P.x, dy=wy-g.P.y;
  const ca=Math.cos(g.P.a), sa=Math.sin(g.P.a);
  return {d:dx*ca+dy*sa, s:-dx*sa+dy*ca};
}
function panOf(g,e){ const c=toCam(g,e.x,e.y); return Math.max(-1,Math.min(1,c.s/(Math.abs(c.d)+40))); }
function toast(g,m){ g.toast=m; g.toastT=2.6; }

/* ---------------- update ---------------- */
function update(dt){
  const g=G,P=g.P;
  if(g.over) return;

  P.a+=readTurn(dt);
  const mv=readMove();
  const ca=Math.cos(P.a), sa=Math.sin(P.a);
  // running is fast and loud — it buys distance and costs concealment
  const sprint = !!(keys['shift']) && !P.hidden;
  P.running = sprint && (Math.abs(mv.f)+Math.abs(mv.s))>.05;
  const spd = sprint ? 178 : 108;
  slide(g,P,(ca*mv.f-sa*mv.s)*spd*dt,(sa*mv.f+ca*mv.s)*spd*dt);
  // jump
  if((keys[' ']||keys['spacebar']) && !P.air){ P.vz=205; P.air=true; jumpGrunt(); }
  if(P.air){
    P.vz-=560*dt; P.z+=P.vz*dt;
    if(P.z<=0){ P.z=0; P.vz=0; P.air=false; footstep(g.screen,.05,0); }
  }

  const moving=Math.hypot(mv.f,mv.s)>.05;
  P.bob = (moving && !P.air) ? Math.sin(t*(P.running?16:11))*(P.running?.034:.022) : P.bob*.9;
  P.breath += dt*(1.4+g.dread*2.2);
  P.iframe=Math.max(0,P.iframe-dt);
  P.hidden=g.covers.some(c=>inRect(P.x,P.y,c));

  // the pick button reaches a little further than walking over a thing does
  const reach = pickWanted ? 72 : 34;
  pickWanted=false;
  for(const it of g.items){
    if(it.taken) continue;
    if(Math.hypot(P.x-it.x,P.y-it.y)<reach){
      it.taken=true; P.weapon=WEAPONS[it.kind]||WEAPONS.oar; P.pickup=1.4;
      beep(300,.08,.05);
      if(g.screen===1) g.exit.locked=false;
    }
  }
  P.swing=Math.max(0,P.swing-dt);
  P.atkCd=Math.max(0,P.atkCd-dt);
  P.pickup=Math.max(0,P.pickup-dt);

  let following=0;
  for(const s of g.survivors){
    if(s.state==='down'||s.state==='out'||s.state==='left') continue;
    s.hurtCd=Math.max(0,s.hurtCd-dt); s.voice-=dt; s.wave+=dt*2.4;
    const ds=Math.hypot(P.x-s.x,P.y-s.y), pan=panOf(g,s);
    if(s.state==='trapped'){
      if(s.voice<=0){ s.voice=3.2+Math.random()*3; callOut(ds,pan,true); }
      if(ds<30){ s.state='follow'; s.voice=1.2; toast(g,s.name+' معك الآن'); callOut(ds,pan,false); hush(.012,.5); }
    } else {
      following++;
      if(s.voice<=0){ s.voice=5+Math.random()*5; callOut(ds,pan,false); }
      if(ds>34){
        const a=Math.atan2(P.y-s.y,P.x-s.x);
        slide(g,s,Math.cos(a)*Math.min(104,62+ds*.45)*dt,Math.sin(a)*Math.min(104,62+ds*.45)*dt);
        s.gait+=dt*7;
      } else s.gait+=dt*1.6;
    }
  }
  g.following=following;
  const noise=(1+following*0.24)*(P.running?1.45:1);

  let nearest=1e9, behind=0;
  for(const z of g.infected){
    z.hitCd=Math.max(0,z.hitCd-dt); z.stagger=Math.max(0,z.stagger-dt);
    z.atk=Math.max(0,z.atk-dt); z.ring+=dt; z.moan-=dt;
    const d=Math.hypot(P.x-z.x,P.y-z.y);
    nearest=Math.min(nearest,d);
    const c=toCam(g,z.x,z.y);
    const inView=c.d>0 && Math.abs(c.s/Math.max(1,c.d))<.62 && d<340;
    z.watched=inView&&!P.hidden;
    if(d<190 && (c.d<=0 || Math.abs(c.s/Math.max(1,c.d))>.78)) behind=Math.max(behind,1-d/190);

    const range=z.sense*noise;
    const canSense = z.strain==='stealth' ? d<range : (d<range && !P.hidden);
    const wasSeen=z.seen;
    if(canSense) z.aggro=3.6; else z.aggro=Math.max(0,z.aggro-dt);
    z.seen=z.aggro>0;
    if(z.seen&&!wasSeen){ zShriek(d,panOf(g,z)); hush(.01,.55); }

    z.lunge=Math.max(0,z.lunge-dt);
    let mul=1;
    if(z.watched) mul = d<170 ? .80 : (z.strain==="flee"?.56:.44);
    else if(z.seen) mul=2.15;
    if(z.seen&&d<175&&z.lunge<=0) z.lunge=1.5;
    if(z.lunge>0.9) mul*=1.7;

    z.gait+=dt*(z.seen&&!z.watched?7.5:2.2);
    if(z.stagger<=0){
      if(z.seen||z.watched){
        const a=Math.atan2(P.y-z.y,P.x-z.x);
        slide(g,z,Math.cos(a)*z.speed*mul*dt,Math.sin(a)*z.speed*mul*dt);
        z.face=a;
      } else {
        z.wander+=(Math.random()-.5)*dt*3;
        const hx=z.home.x-z.x, hy=z.home.y-z.y;
        const pull=Math.hypot(hx,hy)>150?Math.atan2(hy,hx):z.wander;
        slide(g,z,Math.cos(pull)*24*dt,Math.sin(pull)*24*dt);
        z.face=pull;
      }
    }

    const wep=P.weapon;
    const facing=c.d>0&&Math.abs(c.s/Math.max(1,c.d))<.55;
    if(wep.dmg>0&&facing&&d<P.r+z.r+wep.reach&&P.atkCd<=0){
      z.hp-=wep.dmg; P.atkCd=wep.cd; P.swing=wep.cd*.75; z.stagger=.34; z.hitCd=.3;
      const a=Math.atan2(z.y-P.y,z.x-P.x);
      z.x+=Math.cos(a)*18; z.y+=Math.sin(a)*18;
      counters.engage+=1.2; g.shake=.05;
      gruntEffort(); zHurt(panOf(g,z));
      if(z.hp<=0){ z.dead=true; }
    }
    if(d<P.r+z.r+5&&P.iframe<=0&&z.stagger<=0&&z.atk<=0){ z.atk=1.5; damage(); }

    if(z.seen&&!z.dead){
      const away=((P.x-z.x)*ca+(P.y-z.y)*sa)*mv.f;
      if(away>0.2&&moving) counters.flee+=dt*1.25;
    }
    if(!z.dead&&P.hidden&&d<z.sense*1.45) counters.stealth+=dt*1.0;
    if(z.moan<=0&&Math.random()<dt*(z.seen?.9:.35)){ z.moan=2.6; zGrowl(d,panOf(g,z)); }

    for(const s of g.survivors){
      if(s.state!=='follow') continue;
      if(Math.hypot(s.x-z.x,s.y-z.y)<s.r+z.r+5&&s.hurtCd<=0){
        s.hp-=1; s.hurtCd=1.3;
        const pan=panOf(g,s);
        if(s.hp<=0){ s.state='down'; markLost(s.name); scream(pan); hush(.004,1.1); toast(g,'فقدتَ '+s.name); }
        else callOut(0,pan,true);
      }
    }
  }
  g.infected=g.infected.filter(z=>{
    if(z.dead) zDeath(Math.hypot(P.x-z.x,P.y-z.y),panOf(g,z));
    return !z.dead;
  });

  if(moving){ P.step+=dt*(P.running?5.2:3.1); if(P.step>=1){ P.step=0; footstep(g.screen,.035+Math.random()*.02,0); } }
  breathing(dt,moving?1:0,g.dread,P.hp<=1?1:0);

  const target=nearest<1e8?Math.max(0,1-nearest/300):0;
  g.dread+=(target-g.dread)*Math.min(1,dt*2.4);
  heartbeat(dt,g.dread);
  g.behind=behind;

  let hunted=false,eyed=false;
  for(const z of g.infected){ if(z.seen) hunted=true; if(z.watched) eyed=true; }
  let want=0.70;
  if(eyed) want=Math.max(want,0.84);
  if(hunted) want=Math.max(want,1.0);
  want=Math.max(want,0.72+g.dread*0.28);
  musicSet(dt,Math.min(1,want));

  g.lightJitter += ((1-Math.random()*g.dread*.5)-g.lightJitter)*Math.min(1,dt*9);
  if(Math.random()<dt*g.dread*1.4) g.lightJitter=.45;

  if(g.exit&&!g.exit.locked&&inRect(P.x,P.y,g.exit)){
    for(const s of g.survivors) if(s.state==='follow'){ s.state='out'; markSaved(s.name); }
    for(const s of g.survivors) if(s.state==='trapped'){ s.state='left'; markLost(s.name); }
    finishScreen();
  }
  g.toastT=Math.max(0,g.toastT-dt);
  g.shake=Math.max(0,g.shake-dt*.35);
}

function damage(){
  const P=G.P;
  P.hp-=1; P.iframe=1.0; G.shake=.12;
  hurtEl.classList.add('on');
  setTimeout(()=>hurtEl.classList.remove('on'),100);
  gruntPain(); hush(.006,.8);
  if(P.hp<=0) endScreen('fail');
}
function leader(){
  let best='engage',v=-1;
  for(const k of ['engage','stealth','flee']) if(counters[k]>v){ v=counters[k]; best=k; }
  return best;
}
function finishScreen(){
  if(G.screen===1){ go(2); return; }
  if(G.screen===2){ strain=leader(); go(3); return; }
  closeBook(); startOutro();
}
function endScreen(kind){
  G.over=true; running=false;
  if(kind==='fail'){
    showVeil('Screen 0'+G.screen+' · Down','أصابك',
      'سقطت. العدّادات ومن أنقذتهم محفوظون — أعد الشاشة وجرّب أسلوباً آخر.',
      'أعد الشاشة',()=>go(G.screen));
  }
}

/* ============================================================
   WebGL scene — real geometry, real lights, real shadows
   ============================================================ */
let renderer,scene,camera,torch,hemi,ambientL,signLight,gateLight,viewModel;
let dyn={infected:[],survivors:[],items:[]};
let texCache=new Map();

function tex(canvas,repeat){
  const key=canvas.__id||(canvas.__id=Math.random());
  const k=key+'|'+repeat;
  if(texCache.has(k)) return texCache.get(k);
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(repeat,repeat);
  t.anisotropy=4;
  texCache.set(k,t);
  return t;
}

function initGL(){
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(1.6,window.devicePixelRatio||1));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=0.82;
  camera=new THREE.PerspectiveCamera(60,16/9,0.08,420);
  resizeGL();
  addEventListener('resize',resizeGL);
}
function resizeGL(){
  if(!renderer) return;
  const r=stage.getBoundingClientRect();
  const w=Math.max(320,Math.round(r.width)), h=Math.max(180,Math.round(r.height));
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}

function disposeScene(){
  if(!scene) return;
  scene.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      const m=Array.isArray(o.material)?o.material:[o.material];
      m.forEach(x=>x.dispose());
    }
  });
}

/* a person, built from real solids so it reads from every angle */
/* the infected: nothing about the proportions is right, and that is the point —
   too tall, arms past the knees, head hung wrong, jaw that does not close */
function makeInfected(){
  const grp=new THREE.Group();
  grp.rotation.order='YXZ';
  const flesh=new THREE.MeshStandardMaterial({map:tex(TEX.flesh,1),bumpMap:tex(TEX.flesh,1),
    bumpScale:.012,roughness:.98,color:0x9aa08c});
  const rag=new THREE.MeshStandardMaterial({map:tex(TEX.rag,1),bumpMap:tex(TEX.rag,1),
    bumpScale:.01,roughness:1,color:0x8e8a80});
  const mk=(geo,mat,x,y,z,parent)=>{
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
    (parent||grp).add(m); return m;
  };

  // spine pivots so the whole upper body can hunch as one piece
  const spine=new THREE.Group(); spine.position.set(0,1.02,0); grp.add(spine);

  const torso=mk(new THREE.CylinderGeometry(.155,.195,.60,9),rag,0,.10,0,spine);
  torso.scale.set(1,1,.72);                        // flattened, starved
  const shoulders=mk(new THREE.SphereGeometry(.185,12,8),rag,0,.38,0,spine);
  shoulders.scale.set(1.25,.52,.75);

  const neck=new THREE.Group(); neck.position.set(0,.46,.03); spine.add(neck);
  const head=mk(new THREE.SphereGeometry(.115,14,12),flesh,0,.06,0,neck);
  head.scale.set(.86,1.22,.95);                    // long, narrow skull
  const jaw=mk(new THREE.BoxGeometry(.10,.075,.085),flesh,0,-.045,.055,neck);
  const mouth=mk(new THREE.BoxGeometry(.085,.055,.02),
    new THREE.MeshBasicMaterial({color:0x0a0605}),0,-.015,.098,neck);

  const eyeMat=new THREE.MeshBasicMaterial({color:0xff2a1e});
  const eg=new THREE.SphereGeometry(.0165,8,6);
  const eL=mk(eg,eyeMat,-.040,.055,.094,neck);
  const eR=mk(eg,eyeMat, .040,.055,.094,neck);
  eL.castShadow=eR.castShadow=false;
  // a faint bloom so the eyes carry through fog and darkness
  const glowMat=new THREE.SpriteMaterial({map:tex(TEX.glow,1),color:0xff2a1e,opacity:.55,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const glow=new THREE.Sprite(glowMat);
  glow.scale.set(.30,.16,1); glow.position.set(0,.055,.10); neck.add(glow);

  // arms hang past the knees
  const armL=new THREE.Group(); armL.position.set(-.215,.36,0); spine.add(armL);
  const armR=new THREE.Group(); armR.position.set( .215,.36,0); spine.add(armR);
  mk(new THREE.CylinderGeometry(.042,.030,.80,7),flesh,0,-.40,0,armL);
  mk(new THREE.CylinderGeometry(.042,.030,.80,7),flesh,0,-.40,0,armR);
  mk(new THREE.SphereGeometry(.050,8,6),flesh,0,-.82,0,armL).scale.set(1,1.5,.6);
  mk(new THREE.SphereGeometry(.050,8,6),flesh,0,-.82,0,armR).scale.set(1,1.5,.6);

  const legL=new THREE.Group(); legL.position.set(-.095,1.00,0); grp.add(legL);
  const legR=new THREE.Group(); legR.position.set( .095,1.00,0); grp.add(legR);
  mk(new THREE.CylinderGeometry(.062,.040,1.00,7),rag,0,-.50,0,legL);
  mk(new THREE.CylinderGeometry(.062,.040,1.00,7),rag,0,-.50,0,legR);

  return {grp,spine,neck,head,jaw,mouth,armL,armR,legL,legR,eyeMat,glowMat,
          twitch:0,nextTwitch:Math.random()*2,jawOpen:0,mats:[flesh,rag]};
}

function makeHuman(p){
  const grp=new THREE.Group();
  const skin=new THREE.MeshStandardMaterial({color:p.skin,roughness:.86});
  const cloth=new THREE.MeshStandardMaterial({color:p.cloth,roughness:.94});
  const mk=(geo,mat,x,y,z)=>{
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
    grp.add(m); return m;
  };
  // test the constructor, never call it to test it
  const torsoGeo = typeof THREE.CapsuleGeometry === 'function'
    ? new THREE.CapsuleGeometry(.17,.42,4,10)
    : new THREE.CylinderGeometry(.17,.19,.62,10);
  const torso=mk(torsoGeo, cloth, 0,1.12,0);
  const head=mk(new THREE.SphereGeometry(.115,16,12),skin,0,1.52,0);
  const armL=mk(new THREE.CylinderGeometry(.052,.045,.62,8),skin,-.235,1.14,0);
  const armR=mk(new THREE.CylinderGeometry(.052,.045,.62,8),skin, .235,1.14,0);
  const legL=mk(new THREE.CylinderGeometry(.072,.058,.84,8),cloth,-.10,.42,0);
  const legR=mk(new THREE.CylinderGeometry(.072,.058,.84,8),cloth, .10,.42,0);
  const parts={grp,torso,head,armL,armR,legL,legR,mats:[skin,cloth]};

  if(p.eyes){
    const em=new THREE.MeshBasicMaterial({color:0xff3b30});
    const g=new THREE.SphereGeometry(.018,8,6);
    const eL=new THREE.Mesh(g,em), eR=new THREE.Mesh(g,em);
    eL.position.set(-.042,1.545,.10); eR.position.set(.042,1.545,.10);
    grp.add(eL); grp.add(eR);
    parts.eyes=[eL,eR]; parts.eyeMat=em;
  }
  if(p.vis){   // survivors wear something that catches the torch
    const vm=new THREE.MeshStandardMaterial({color:0xe6d58a,emissive:0x2a2408,roughness:.7});
    const band=new THREE.Mesh(new THREE.CylinderGeometry(.185,.185,.10,12),vm);
    band.position.set(0,1.30,0); band.castShadow=true;
    grp.add(band); parts.mats.push(vm);
  }
  return parts;
}

function makeWeaponMesh(kind){
  const g=new THREE.Group();
  const wood=new THREE.MeshStandardMaterial({color:0x8a7150,roughness:.9});
  const steel=new THREE.MeshStandardMaterial({color:0xc8d2d6,roughness:.28,metalness:.85});
  if(kind==='knife'){
    const h=new THREE.Mesh(new THREE.CylinderGeometry(.018,.02,.11,8),wood); h.position.y=.05; g.add(h);
    const b=new THREE.Mesh(new THREE.ConeGeometry(.026,.20,4),steel); b.position.y=.20; g.add(b);
  } else if(kind==='spear'){
    const s=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,1.35,8),wood); s.position.y=.62; g.add(s);
    const b=new THREE.Mesh(new THREE.ConeGeometry(.035,.26,6),steel); b.position.y=1.42; g.add(b);
  } else {
    const s=new THREE.Mesh(new THREE.CylinderGeometry(.020,.022,1.05,8),wood); s.position.y=.5; g.add(s);
    const bl=new THREE.Mesh(new THREE.BoxGeometry(.13,.34,.022),wood); bl.position.y=1.12; g.add(bl);
  }
  g.traverse(o=>{ if(o.isMesh) o.castShadow=false; });
  return g;
}

/* a real hull outline, shared by the beached boats and by the wrecks */
const HULL=[                       // normalised half-outline, bow first
  [ .50,.000],[ .47,.075],[ .40,.165],[ .28,.245],[ .12,.290],
  [-.06,.300],[-.24,.292],[-.38,.268],[-.47,.238],[-.50,.215]
];
function hullPath(sx,sy,inset){
  const p=new THREE.Shape();
  const pts=[];
  for(const q of HULL) pts.push([q[0]*sx*(1-inset*.10), q[1]*sy*(1-inset)]);
  for(let i=HULL.length-1;i>=0;i--){
    const q=HULL[i];
    pts.push([q[0]*sx*(1-inset*.10), -q[1]*sy*(1-inset)]);
  }
  pts.forEach((q,i)=> i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));
  p.closePath();
  return p;
}

function safeBuild(g){
  try{ buildScene(g); }
  catch(err){ console.error("scene build failed:",err); }
}
function buildScene(g){
  disposeScene();
  dyn={infected:[],survivors:[],items:[]};
  scene=new THREE.Scene();
  scene.background=new THREE.Color(g.fogColor);
  scene.fog=new THREE.FogExp2(g.fogColor,g.fogDensity);

  // ground
  const floorTex=tex(g.floor,g.floorRepeat);
  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(WX(g.W),WZ(g.H)),
    new THREE.MeshStandardMaterial({map:floorTex,bumpMap:floorTex,bumpScale:.035,roughness:.98,metalness:0})
  );
  floor.rotation.x=-Math.PI/2;
  floor.position.set(WX(g.W)/2,0,WZ(g.H)/2);
  floor.receiveShadow=true;
  scene.add(floor);

  // sunset dome: painted once, wrapped around the world, lit by nothing
  if(g.sunset){
    const sky=makeTex(64,512,(x,w,h)=>{
      const grd=x.createLinearGradient(0,0,0,h);
      grd.addColorStop(0.00,'#131a33');
      grd.addColorStop(0.34,'#3d3557');
      grd.addColorStop(0.55,'#8a4f55');
      grd.addColorStop(0.72,'#d9743d');
      grd.addColorStop(0.86,'#f2a24a');
      grd.addColorStop(1.00,'#ffd089');
      x.fillStyle=grd; x.fillRect(0,0,w,h);
      for(let i=0;i<40;i++){                       // haze banding near the water
        const y=h*(0.62+Math.random()*0.36);
        x.fillStyle=`rgba(${200+Math.random()*55|0},${120+Math.random()*70|0},90,${0.03+Math.random()*0.06})`;
        x.fillRect(0,y,w,1+Math.random()*4);
      }
    });
    const st=new THREE.CanvasTexture(sky);
    st.wrapS=THREE.RepeatWrapping; st.repeat.set(1,1);
    const dome=new THREE.Mesh(
      new THREE.SphereGeometry(200,32,20),
      new THREE.MeshBasicMaterial({map:st,side:THREE.BackSide,fog:false,depthWrite:false})
    );
    dome.position.set(WX(g.W)/2,0,WZ(g.H)/2);
    scene.add(dome);
    scene.background=null;
  }

  // the sea, on the far side of the beach
  if(g.sky==='beach'||g.sky==='night'){
    const seaMat = g.sunset
      ? new THREE.MeshStandardMaterial({color:0x7a4436,roughness:.18,metalness:.55,
          emissive:0x2a1208,emissiveIntensity:.5})
      : new THREE.MeshStandardMaterial({color:g.sky==='night'?0x0a1418:0x46585f,roughness:.35,metalness:.2});
    const sea=new THREE.Mesh(new THREE.PlaneGeometry(WX(g.W)*4,200),seaMat);
    sea.rotation.x=-Math.PI/2;
    sea.position.set(WX(g.W)/2,-0.12,-100+WZ(0));
    scene.add(sea);
  }

  // the wrecks: a broken hull heeled over on the reef, with a snapped mast
  for(const w of (g.wrecks||[])){
    const sx=WX(w.len), sy=WX(w.beam);
    const hs=hullPath(sx,sy,0);
    hs.holes.push(hullPath(sx,sy,0.18));
    const geo=new THREE.ExtrudeGeometry(hs,{depth:WX(150),bevelEnabled:true,
      bevelThickness:.08,bevelSize:.07,bevelSegments:2});
    const mat=new THREE.MeshStandardMaterial({map:tex(TEX.hull,5),bumpMap:tex(TEX.hull,5),
      bumpScale:.05,roughness:.78,color:0x6d6156});
    const m=new THREE.Mesh(geo,mat);
    m.rotation.x=-Math.PI/2; m.rotation.z=-w.rot;
    m.rotation.y=w.tilt;                       // heeled over, not upright
    m.position.set(WX(w.x),WX(6),WZ(w.y));
    m.castShadow=true; m.receiveShadow=true;
    scene.add(m);
    if(w.mast){
      const mast=new THREE.Mesh(new THREE.CylinderGeometry(WX(14),WX(20),WX(620),8),
        new THREE.MeshStandardMaterial({color:0x4a4038,roughness:.9}));
      mast.position.set(WX(w.x)+2.0,WX(210),WZ(w.y)+1.2);
      mast.rotation.z=w.tilt+0.62;
      mast.castShadow=true; scene.add(mast);
      const spar=new THREE.Mesh(new THREE.CylinderGeometry(WX(9),WX(9),WX(330),6),
        new THREE.MeshStandardMaterial({color:0x4a4038,roughness:.9}));
      spar.position.set(WX(w.x)+3.4,WX(330),WZ(w.y)+2.1);
      spar.rotation.z=Math.PI/2.3; spar.rotation.y=.4;
      spar.castShadow=true; scene.add(spar);
    }
  }

  // solids
  for(const o of g.solids){
    if(o.ghost) continue;
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(WX(o.w),WX(o.h),WZ(o.d)),
      new THREE.MeshStandardMaterial({
        map:tex(o.tex,Math.max(1,Math.round(o.w/60))),
        bumpMap:tex(o.tex,Math.max(1,Math.round(o.w/60))),
        bumpScale:.03,
        color:new THREE.Color(o.tint,o.tint,o.tint),
        roughness:.95
      })
    );
    m.position.set(WX(o.x+o.w/2),WX(o.h)/2,WZ(o.y+o.d/2));
    m.castShadow=true; m.receiveShadow=true;
    scene.add(m);
  }

  for(const b of g.boats){
    const sx=WX(b.len), sy=WX(b.beam);
    const shape=hullPath(sx,sy,0);
    const hole=hullPath(sx,sy,0.22);
    shape.holes.push(hole);
    const geo=new THREE.ExtrudeGeometry(shape,{depth:WX(50),bevelEnabled:true,
      bevelThickness:.035,bevelSize:.03,bevelSegments:2});
    const mat=new THREE.MeshStandardMaterial({map:tex(TEX.hull,3),bumpMap:tex(TEX.hull,3),
      bumpScale:.02,roughness:.55,color:0xbcc4c4});
    const m=new THREE.Mesh(geo,mat);
    m.rotation.x=-Math.PI/2; m.rotation.z=-b.rot;
    m.position.set(WX(b.cx),0,WZ(b.cy));
    m.castShadow=true; m.receiveShadow=true;
    scene.add(m);
    // the sole inside, plus two thwarts
    const sole=new THREE.Mesh(new THREE.PlaneGeometry(sx*.82,sy*.52),
      new THREE.MeshStandardMaterial({color:0x7d8e92,roughness:.9}));
    sole.rotation.x=-Math.PI/2; sole.rotation.z=-b.rot;
    sole.position.set(WX(b.cx),WX(12),WZ(b.cy));
    sole.receiveShadow=true; scene.add(sole);
    for(const o of [-0.16,0.16]){
      const th=new THREE.Mesh(new THREE.BoxGeometry(sx*.09,WX(7),sy*.62),
        new THREE.MeshStandardMaterial({color:0x8e8371,roughness:.95}));
      th.position.set(WX(b.cx)+Math.cos(-b.rot)*sx*o, WX(44), WZ(b.cy)+Math.sin(-b.rot)*sx*o);
      th.rotation.y=-b.rot;
      th.castShadow=true; scene.add(th);
    }
  }

  // shelter sheets over the cover zones
  for(const c of g.covers){
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(WX(c.w),.04,WZ(c.h)),
      new THREE.MeshStandardMaterial({color:0x3a2c20,roughness:.95})
    );
    m.position.set(WX(c.x+c.w/2),WX(104),WZ(c.y+c.h/2));
    m.castShadow=true;
    scene.add(m);
    for(const p of [[c.x,c.y],[c.x+c.w,c.y],[c.x,c.y+c.h],[c.x+c.w,c.y+c.h]]){
      const post=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,WX(104),6),
        new THREE.MeshStandardMaterial({color:0x4a3a28,roughness:.95}));
      post.position.set(WX(p[0]),WX(104)/2,WZ(p[1]));
      post.castShadow=true; scene.add(post);
    }
  }

  // the way inland — a lit marker you can steer by from the far end of the beach
  if(g.gate){
    const post=new THREE.CylinderGeometry(WX(10),WX(13),WX(230),8);
    const postMat=new THREE.MeshStandardMaterial({color:0x5b4c3a,roughness:.95});
    for(const off of [-WX(78),WX(78)]){
      const p=new THREE.Mesh(post,postMat);
      p.position.set(WX(g.gate.x)+off,WX(115),WZ(g.gate.y));
      p.castShadow=true; scene.add(p);
    }
    const beam=new THREE.Mesh(new THREE.BoxGeometry(WX(180),WX(16),WX(16)),postMat);
    beam.position.set(WX(g.gate.x),WX(222),WZ(g.gate.y));
    beam.castShadow=true; scene.add(beam);
    // cloth strips knotted to the beam, so it reads even unlit
    for(let i=0;i<5;i++){
      const s=new THREE.Mesh(new THREE.BoxGeometry(WX(11),WX(46+i*9),WX(3)),
        new THREE.MeshStandardMaterial({color:i%2?0xb8443a:0xd8cdb6,roughness:1}));
      s.position.set(WX(g.gate.x)-WX(64)+WX(32)*i,WX(196-i*4),WZ(g.gate.y)+.03);
      scene.add(s);
    }
    const lampMat=new THREE.MeshBasicMaterial({color:0xffc871});
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(WX(16),10,8),lampMat);
    lamp.position.set(WX(g.gate.x),WX(206),WZ(g.gate.y));
    scene.add(lamp);
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(TEX.glow,1),color:0xffb254,opacity:.7,
      transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,opacity:.95}));
    halo.scale.set(5.2,5.2,1);
    halo.position.copy(lamp.position);
    scene.add(halo);
    gateLight=new THREE.PointLight(0xffb254,4.2,30,2);
    gateLight.position.set(WX(g.gate.x),WX(206),WZ(g.gate.y));
    scene.add(gateLight);
  } else gateLight=null;

  // the sign — the only saturated thing in the game
  if(g.sign){
    const grp=new THREE.Group();
    const plate=new THREE.Mesh(new THREE.BoxGeometry(WX(90),WX(64),.03),
      new THREE.MeshStandardMaterial({color:0xe8e4da,roughness:.6,emissive:0x140404}));
    plate.position.y=WX(120); plate.castShadow=true;
    const frame=new THREE.Mesh(new THREE.BoxGeometry(WX(96),WX(70),.02),
      new THREE.MeshStandardMaterial({color:0xc9302c,emissive:0x5a0f0d,roughness:.7}));
    frame.position.set(0,WX(120),-.02);
    for(const px of [-WX(34),WX(34)]){
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,WX(120),6),
        new THREE.MeshStandardMaterial({color:0x6e6a63,roughness:.9}));
      leg.position.set(px,WX(60),0); leg.castShadow=true; grp.add(leg);
    }
    for(let i=0;i<3;i++){
      const bar=new THREE.Mesh(new THREE.BoxGeometry(WX(60-i*10),WX(7),.01),
        new THREE.MeshBasicMaterial({color:0xc9302c}));
      bar.position.set(0,WX(136-i*16),.02); grp.add(bar);
    }
    grp.add(plate); grp.add(frame);
    grp.position.set(WX(g.sign.x),0,WZ(g.sign.y));
    scene.add(grp);
    signLight=new THREE.PointLight(0xc9302c,2.2,9,2);
    signLight.position.set(WX(g.sign.x),WX(130),WZ(g.sign.y)+.3);
    scene.add(signLight);
  } else signLight=null;

  // lights
  if(g.sunset){
    hemi=new THREE.HemisphereLight(0xffb072,0x2e1f20,g.ambient);
    scene.add(hemi);
    ambientL=new THREE.AmbientLight(0x5a3a4e,g.ambient*.30);
    scene.add(ambientL);
    // the sun sits on the water behind the wreck, so everything throws a long shadow inland
    const sun=new THREE.DirectionalLight(0xff8a3d,2.1);
    sun.position.set(WX(g.W)*.55, 9, -52);
    sun.target.position.set(WX(g.W)*.5, 0, WZ(g.H)*.7);
    sun.castShadow=true;
    sun.shadow.mapSize.width=1024; sun.shadow.mapSize.height=1024;
    const sc=sun.shadow.camera;
    sc.left=-34; sc.right=34; sc.top=34; sc.bottom=-34; sc.near=1; sc.far=140;
    sun.shadow.bias=-0.0012;
    scene.add(sun); scene.add(sun.target);
    // a cool fill from the sky opposite, so shadows read blue against the amber
    const fill=new THREE.DirectionalLight(0x5f7fb0,.30);
    fill.position.set(-WX(g.W)*.2, 22, WZ(g.H)*1.2);
    scene.add(fill);
  } else {
    hemi=new THREE.HemisphereLight(0x9fb4bd,0x3a3229,g.ambient);
    scene.add(hemi);
    ambientL=new THREE.AmbientLight(0x5a6a72,g.ambient*.22);
    scene.add(ambientL);
  }

  torch=new THREE.SpotLight(0xfff0d6,g.torch*3.1,34,0.52,0.55,1.4);
  torch.castShadow=true;
  torch.shadow.mapSize.width=1024;
  torch.shadow.mapSize.height=1024;
  torch.shadow.camera.near=.4;
  torch.shadow.camera.far=30;
  torch.shadow.bias=-0.0012;
  torch.position.set(.16,-.12,0);
  camera.add(torch);
  camera.add(torch.target);
  torch.target.position.set(0,-.05,-1);
  scene.add(camera);

  // dynamic bodies
  for(const z of g.infected){
    const h=makeInfected();
    scene.add(h.grp); dyn.infected.push({z,h});
  }
  for(const s of g.survivors){
    const h=makeHuman({skin:0xbc9c80,cloth:0xa9a698,vis:true});
    scene.add(h.grp); dyn.survivors.push({s,h});
  }
  for(const it of g.items){
    const m=makeWeaponMesh(it.kind);
    m.position.set(WX(it.x),0,WZ(it.y));
    m.rotation.z=0.42;
    m.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
    scene.add(m); dyn.items.push({it,m});
  }

  // held weapon rides the camera
  if(viewModel){ camera.remove(viewModel); viewModel=null; }
  syncWeapon(g);
}

function syncWeapon(g){
  const k=g.P.weapon.key;
  if(viewModel && viewModel.userData.kind===k) return;
  if(viewModel){ camera.remove(viewModel); viewModel=null; }
  if(k==='none') return;
  const m=makeWeaponMesh(k);
  m.userData.kind=k;
  m.scale.setScalar(.85);
  camera.add(m);
  viewModel=m;
}

const _v=new THREE.Vector3();
function syncScene(g,dt){
  if(!scene) return;
  const P=g.P;
  // camera
  camera.position.set(WX(P.x), (g.camH||EYE)+P.bob+WX(P.z||0), WZ(P.y));
  camera.rotation.order='YXZ';
  camera.rotation.y = -P.a - Math.PI/2;
  camera.rotation.x = Math.sin(P.breath)*0.006;
  camera.rotation.z = (g.roll||0) + (g.shake? (Math.random()-.5)*g.shake : 0);

  if(torch){
    torch.intensity = g.torch*3.1*(g.lightJitter||1);
    torch.position.x = .16 + P.bob*.5;
  }
  if(signLight) signLight.intensity = 2.0+Math.sin(t*2.1)*.25;
  if(gateLight) gateLight.intensity = 4.0+Math.sin(t*6.3)*.55+Math.sin(t*17.1)*.28;

  // infected
  for(const e of dyn.infected){
    const z=e.z,h=e.h;
    if(z.dead||!g.infected.includes(z)){ h.grp.visible=false; continue; }
    h.grp.visible=true;
    h.grp.position.set(WX(z.x),0,WZ(z.y));
    h.grp.rotation.y = -(z.face!==undefined?z.face:0) - Math.PI/2;

    const hunting = z.seen || z.watched;
    const sw=Math.sin(z.gait)*(hunting?.78:.36);
    // the legs swing wide and out of phase with the arms — a broken walk
    h.legL.rotation.x= sw;        h.legR.rotation.x=-sw;
    h.armL.rotation.x=-sw*.42-.18; h.armR.rotation.x= sw*.42-.18;
    h.armL.rotation.z= .10+Math.sin(z.gait*1.7)*.07;
    h.armR.rotation.z=-.10-Math.sin(z.gait*1.7)*.07;
    // it folds further forward the closer it gets to you
    h.spine.rotation.x = 0.30 + (hunting?0.34:0) + Math.sin(z.gait*2)*.03;

    // involuntary spasms: the head snaps, then holds still too long
    h.twitch-=dt;
    if(h.twitch<=0){
      h.twitch = hunting ? .25+Math.random()*.7 : .8+Math.random()*2.4;
      h.jerkY=(Math.random()-.5)*(hunting?1.15:.55);
      h.jerkZ=(Math.random()-.5)*(hunting?.75:.4);
      h.jerkX=(Math.random()-.5)*.4;
    }
    const ease=Math.min(1,dt*12);
    h.neck.rotation.y += ((h.jerkY||0)-h.neck.rotation.y)*ease;
    h.neck.rotation.z += ((z.lean+(h.jerkZ||0))-h.neck.rotation.z)*ease;
    h.neck.rotation.x += (((h.jerkX||0)+ (hunting?-.22:.10))-h.neck.rotation.x)*ease;

    // the jaw hangs open and gapes wider when it has you
    const wantJaw = hunting ? .55+Math.sin(t*9+z.x)*.22 : .18;
    h.jawOpen += (wantJaw-h.jawOpen)*Math.min(1,dt*7);
    h.jaw.rotation.x = h.jawOpen;
    h.jaw.position.y = -.045 - h.jawOpen*.03;
    h.mouth.scale.y = .6 + h.jawOpen*2.4;

    h.grp.position.y = Math.abs(Math.sin(z.gait))*(hunting?.05:.025);

    const hot = hunting;
    h.eyeMat.color.setHex(hot?0xff2a1e:0x611611);
    h.glowMat.opacity = hot ? .48+Math.sin(t*6+z.y)*.16 : .05;
  }
  // survivors
  for(const e of dyn.survivors){
    const s=e.s,h=e.h;
    if(s.state==='out'){ h.grp.visible=false; continue; }
    h.grp.visible=true;
    h.grp.position.set(WX(s.x),0,WZ(s.y));
    if(s.state==='down'){
      h.grp.rotation.x=-Math.PI/2.1; h.grp.position.y=.16;
    } else {
      h.grp.rotation.x=0;
      const a=Math.atan2(P.y-s.y,P.x-s.x);
      h.grp.rotation.y=-a-Math.PI/2;
      const sw=s.state==='follow'?Math.sin(s.gait)*.5:0;
      h.legL.rotation.x=sw; h.legR.rotation.x=-sw;
      if(s.state==='trapped'){
        h.grp.position.y=-.34;                            // pinned low
        h.armL.rotation.z = -1.1+Math.sin(s.wave*2.2)*.5; // waving for you
        h.armR.rotation.z = 0;
      } else {
        h.grp.position.y=Math.abs(Math.sin(s.gait))*.02;
        h.armL.rotation.z=0; h.armL.rotation.x=-sw*.6; h.armR.rotation.x=sw*.6;
      }
    }
  }
  // pickups
  for(const e of dyn.items){
    e.m.visible=!e.it.taken;
    if(e.m.visible) e.m.rotation.y+=dt*.7;
  }
  syncWeapon(g);
  if(viewModel){
    const lunge=Math.sin(Math.min(1,(P.swing/(P.weapon.cd||1))/.75)*Math.PI);
    viewModel.position.set(.30-lunge*.10, -.42+P.bob*.6-lunge*.05, -.52+lunge*.26);
    viewModel.rotation.set(-1.15+lunge*.55, .25, .30);
  }
}

/* ---------------- loop ---------------- */
let frameAvg=16;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now; t+=dt;
  frameAvg+=((dt*1000)-frameAvg)*0.05;
  if(frameAvg>34 && renderer.getPixelRatio()>0.85) renderer.setPixelRatio(Math.max(0.85,renderer.getPixelRatio()-0.12));
  if(intro) updateIntro(dt);
  else if(outro) updateOutro(dt);
  else if(running) update(dt);
  syncScene(G,dt);
  renderer.render(scene,camera);
  updateHUD();
  raf=requestAnimationFrame(loop);
}

const pipsEl=document.getElementById('pips'), countEl=document.getElementById('count');
const hpEl=document.getElementById('hp'), wepEl=document.getElementById('wep');
const hideEl=document.getElementById('hideTag'), toastEl=document.getElementById('toast');
let hudSig='';
function updateHUD(){
  if(!G) return;
  const P=G.P, sec=rescue.saved.length, wi=G.following||0, lost=rescue.lost.length;
  const sig=[sec,wi,lost,P.hp,P.weapon.key,P.hidden,G.toastT>0?G.toast:'',Math.round((G.behind||0)*10)].join('|');
  if(sig!==hudSig){
    hudSig=sig;
    let ph='';
    for(let i=0;i<4;i++){
      const cls = i<sec?'out' : i<sec+wi?'with' : i<4-lost?'' : 'gone';
      ph+=`<span class="pip ${cls}"></span>`;
    }
    pipsEl.innerHTML=ph;
    countEl.textContent=(sec+wi)+' / 4';
    let hh='';
    for(let i=0;i<4;i++) hh+=`<i class="${i<P.hp?'':'off'}"></i>`;
    hpEl.innerHTML=hh;
    wepEl.hidden = P.weapon.key==='none';
    wepEl.textContent = P.weapon.name;
    hideEl.hidden = !P.hidden;
    toastEl.textContent = G.toast||'';
    toastEl.classList.toggle('on', G.toastT>0);
    senseEl.style.opacity = (G.behind||0)*0.55;
    senseEl.style.background = `radial-gradient(ellipse at ${(G.behind||0)>0?'50%':'50%'} 120%, rgba(201,48,44,.5), transparent 60%)`;
  }
}
