/* a real hull outline, shared by the beached boats and by the wrecks */
const HULL=[                       // normalised half-outline, bow first
  [ .50,.000],[ .47,.075],[ .40,.165],[ .28,.245],[ .12,.290],
  [-.06,.300],[-.24,.292],[-.38,.268],[-.47,.238],[-.50,.215]
];
function hullPath(sx,sy,inset){
  const p=new THREE.Shape();
  const pts=[];
  for(const q of HULL) pts.push([q[0]*sx*(1-inset*.10), q[1]*sy*(1-inset)]);
  for(let i=HULL.length-1;i>=0;i--){
    const q=HULL[i];
    pts.push([q[0]*sx*(1-inset*.10), -q[1]*sy*(1-inset)]);
  }
  pts.forEach((q,i)=> i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));
  p.closePath();
  return p;
}

function safeBuild(g){
  try{ buildScene(g); }
  catch(err){ console.error("scene build failed:",err); }
}
function buildScene(g){
  disposeScene();
  dyn={infected:[],survivors:[],items:[]};
  scene=new THREE.Scene();
  scene.background=new THREE.Color(g.fogColor);
  scene.fog=new THREE.FogExp2(g.fogColor,g.fogDensity);
  buildEnv(g);                     // something for every wet surface to reflect
  builtAt=performance.now(); frameAvg=16;

  // ground
  const floorTex=tex(g.floor,g.floorRepeat);
  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(WX(g.W),WZ(g.H)),
    new THREE.MeshStandardMaterial({map:floorTex,
      normalMap:nrm(g.floor,g.floorRepeat,1.15),
      normalScale:new THREE.Vector2(.85,.85),
      roughness:.94,metalness:.04,envMapIntensity:.22})
  );
  floor.rotation.x=-Math.PI/2;
  floor.position.set(WX(g.W)/2,0,WZ(g.H)/2);
  floor.receiveShadow=true;
  scene.add(floor);

  // sunset dome: painted once, wrapped around the world, lit by nothing
  if(g.sunset){
    const sky=makeTex(64,512,(x,w,h)=>{
      const grd=x.createLinearGradient(0,0,0,h);
      grd.addColorStop(0.00,'#131a33');
      grd.addColorStop(0.34,'#3d3557');
      grd.addColorStop(0.55,'#8a4f55');
      grd.addColorStop(0.72,'#d9743d');
      grd.addColorStop(0.86,'#f2a24a');
      grd.addColorStop(1.00,'#ffd089');
      x.fillStyle=grd; x.fillRect(0,0,w,h);
      for(let i=0;i<40;i++){                       // haze banding near the water
        const y=h*(0.62+Math.random()*0.36);
        x.fillStyle=`rgba(${200+Math.random()*55|0},${120+Math.random()*70|0},90,${0.03+Math.random()*0.06})`;
        x.fillRect(0,y,w,1+Math.random()*4);
      }
    });
    const st=new THREE.CanvasTexture(sky);
    st.wrapS=THREE.RepeatWrapping; st.repeat.set(1,1);
    const dome=new THREE.Mesh(
      new THREE.SphereGeometry(200,32,20),
      new THREE.MeshBasicMaterial({map:st,side:THREE.BackSide,fog:false,depthWrite:false})
    );
    dome.position.set(WX(g.W)/2,0,WZ(g.H)/2);
    scene.add(dome);
    scene.background=null;
  }

  // the sea: Red Sea blue, in three layers — open water, shallows that dissolve
  // into the sand, and the broken line where it lands. the sunset only catches
  // the surface; it does not dye the water
  if(g.sky==='beach'||g.sky==='night'){
    const night=(g.sky==='night');
    const wtex=(canvas,ru,rv,clampV)=>{
      const t=new THREE.CanvasTexture(canvas);
      t.wrapS=THREE.RepeatWrapping;
      t.wrapT=clampV?THREE.ClampToEdgeWrapping:THREE.RepeatWrapping;
      t.repeat.set(ru,rv); t.anisotropy=4;
      return t;
    };
    const W4=WX(g.W)*4;

    // open water
    const deepTex=wtex(TEX.water,W4/6,200/6);
    const seaMat=new THREE.MeshStandardMaterial({
      map:deepTex, bumpMap:deepTex, bumpScale:.05,
      color: night?0x4e7f95 : 0x9ed6ec,
      roughness:.13, metalness:.72,
      emissive: night?0x02121a:0x0a3a52, emissiveIntensity: night?.35:.5});
    const sea=new THREE.Mesh(new THREE.PlaneGeometry(W4,200,1,1),seaMat);
    sea.rotation.x=-Math.PI/2;
    sea.position.set(WX(g.W)/2,-0.12,-100+WZ(0));
    scene.add(sea);

    // the shallows: paler and greener over sand, fading out where it runs dry
    const shTex=wtex(TEX.water,W4/4,WX(150)/4);
    const shallowMat=new THREE.MeshStandardMaterial({
      map:shTex, bumpMap:shTex, bumpScale:.03,
      alphaMap:wtex(TEX.shore,1,1,true), transparent:true, depthWrite:false,
      color: night?0x5c8c96 : 0xcaf0ea,
      roughness:.2, metalness:.5,
      emissive: night?0x05181f:0x156057, emissiveIntensity: night?.3:.44});
    const shallow=new THREE.Mesh(new THREE.PlaneGeometry(W4,WX(150)),shallowMat);
    shallow.rotation.x=-Math.PI/2;
    shallow.position.set(WX(g.W)/2,-0.055,WZ(0)-WX(64));
    scene.add(shallow);

    // foam along the waterline
    const foamTex=wtex(TEX.foam,W4/2.2,1,true);
    const foamMat=new THREE.MeshStandardMaterial({color:0xe6f3f5,roughness:.9,
      map:foamTex, alphaMap:foamTex, transparent:true, depthWrite:false,
      opacity:night?.34:.8});
    const foam=new THREE.Mesh(new THREE.PlaneGeometry(W4,WX(30)),foamMat);
    foam.rotation.x=-Math.PI/2;
    foam.position.set(WX(g.W)/2,-0.03,WZ(0)-WX(4));
    foam.userData.z0=foam.position.z;
    foam.userData.op0=foamMat.opacity;
    scene.add(foam);
    seaFoam=foam;
    seaTex=[deepTex,shTex];
  } else { seaFoam=null; seaTex=null; }

  // the wrecks: a broken hull heeled over on the reef, with a snapped mast
  for(const w of (g.wrecks||[])){
    const sx=WX(w.len), sy=WX(w.beam);
    const hs=hullPath(sx,sy,0);
    hs.holes.push(hullPath(sx,sy,0.18));
    const geo=new THREE.ExtrudeGeometry(hs,{depth:WX(150),bevelEnabled:true,
      bevelThickness:.08,bevelSize:.07,bevelSegments:2});
    const mat=new THREE.MeshStandardMaterial({map:tex(TEX.hull,5),bumpMap:tex(TEX.hull,5),
      bumpScale:.05,roughness:.78,color:0x6d6156});
    const m=new THREE.Mesh(geo,mat);
    m.rotation.x=-Math.PI/2; m.rotation.z=-w.rot;
    m.rotation.y=w.tilt;                       // heeled over, not upright
    m.position.set(WX(w.x),WX(6),WZ(w.y));
    m.castShadow=true; m.receiveShadow=true;
    scene.add(m);
    if(w.mast){
      const mast=new THREE.Mesh(new THREE.CylinderGeometry(WX(14),WX(20),WX(620),8),
        new THREE.MeshStandardMaterial({color:0x4a4038,roughness:.9}));
      mast.position.set(WX(w.x)+2.0,WX(210),WZ(w.y)+1.2);
      mast.rotation.z=w.tilt+0.62;
      mast.castShadow=true; scene.add(mast);
      const spar=new THREE.Mesh(new THREE.CylinderGeometry(WX(9),WX(9),WX(330),6),
        new THREE.MeshStandardMaterial({color:0x4a4038,roughness:.9}));
      spar.position.set(WX(w.x)+3.4,WX(330),WZ(w.y)+2.1);
      spar.rotation.z=Math.PI/2.3; spar.rotation.y=.4;
      spar.castShadow=true; scene.add(spar);
    }
  }

  // solids
  for(const o of g.solids){
    if(o.ghost) continue;
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(WX(o.w),WX(o.h),WZ(o.d)),
      new THREE.MeshStandardMaterial({
        map:tex(o.tex,Math.max(1,Math.round(o.w/60))),
        normalMap:nrm(o.tex,Math.max(1,Math.round(o.w/60)),1.0),
        normalScale:new THREE.Vector2(.8,.8),
        color:new THREE.Color(o.tint,o.tint,o.tint),
        roughness:.92,metalness:.05,envMapIntensity:.20
      })
    );
    m.position.set(WX(o.x+o.w/2),WX(o.h)/2,WZ(o.y+o.d/2));
    m.castShadow=true; m.receiveShadow=true;
    scene.add(m);
  }

  for(const b of g.boats){
    const sx=WX(b.len), sy=WX(b.beam);
    const shape=hullPath(sx,sy,0);
    const hole=hullPath(sx,sy,0.22);
    shape.holes.push(hole);
    const geo=new THREE.ExtrudeGeometry(shape,{depth:WX(50),bevelEnabled:true,
      bevelThickness:.035,bevelSize:.03,bevelSegments:2});
    const mat=new THREE.MeshStandardMaterial({map:tex(TEX.hull,3),bumpMap:tex(TEX.hull,3),
      bumpScale:.02,roughness:.55,color:0xbcc4c4});
    const m=new THREE.Mesh(geo,mat);
    m.rotation.x=-Math.PI/2; m.rotation.z=-b.rot;
    m.position.set(WX(b.cx),0,WZ(b.cy));
    m.castShadow=true; m.receiveShadow=true;
    scene.add(m);
    // the sole inside, plus two thwarts
    const sole=new THREE.Mesh(new THREE.PlaneGeometry(sx*.82,sy*.52),
      new THREE.MeshStandardMaterial({color:0x7d8e92,roughness:.9}));
    sole.rotation.x=-Math.PI/2; sole.rotation.z=-b.rot;
    sole.position.set(WX(b.cx),WX(12),WZ(b.cy));
    sole.receiveShadow=true; scene.add(sole);
    for(const o of [-0.16,0.16]){
      const th=new THREE.Mesh(new THREE.BoxGeometry(sx*.09,WX(7),sy*.62),
        new THREE.MeshStandardMaterial({color:0x8e8371,roughness:.95}));
      th.position.set(WX(b.cx)+Math.cos(-b.rot)*sx*o, WX(44), WZ(b.cy)+Math.sin(-b.rot)*sx*o);
      th.rotation.y=-b.rot;
      th.castShadow=true; scene.add(th);
    }
  }

  // shelter sheets over the cover zones
  for(const c of g.covers){
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(WX(c.w),.04,WZ(c.h)),
      new THREE.MeshStandardMaterial({color:0x3a2c20,roughness:.95})
    );
    m.position.set(WX(c.x+c.w/2),WX(104),WZ(c.y+c.h/2));
    m.castShadow=true;
    scene.add(m);
    for(const p of [[c.x,c.y],[c.x+c.w,c.y],[c.x,c.y+c.h],[c.x+c.w,c.y+c.h]]){
      const post=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,WX(104),6),
        new THREE.MeshStandardMaterial({color:0x4a3a28,roughness:.95}));
      post.position.set(WX(p[0]),WX(104)/2,WZ(p[1]));
      post.castShadow=true; scene.add(post);
    }
  }

  // the way inland — a lit marker you can steer by from the far end of the beach
  if(g.gate){
    const post=new THREE.CylinderGeometry(WX(10),WX(13),WX(230),8);
    const postMat=new THREE.MeshStandardMaterial({color:0x5b4c3a,roughness:.95});
    for(const off of [-WX(78),WX(78)]){
      const p=new THREE.Mesh(post,postMat);
      p.position.set(WX(g.gate.x)+off,WX(115),WZ(g.gate.y));
      p.castShadow=true; scene.add(p);
    }
    const beam=new THREE.Mesh(new THREE.BoxGeometry(WX(180),WX(16),WX(16)),postMat);
    beam.position.set(WX(g.gate.x),WX(222),WZ(g.gate.y));
    beam.castShadow=true; scene.add(beam);
    // cloth strips knotted to the beam, so it reads even unlit
    for(let i=0;i<5;i++){
      const s=new THREE.Mesh(new THREE.BoxGeometry(WX(11),WX(46+i*9),WX(3)),
        new THREE.MeshStandardMaterial({color:i%2?0xb8443a:0xd8cdb6,roughness:1}));
      s.position.set(WX(g.gate.x)-WX(64)+WX(32)*i,WX(196-i*4),WZ(g.gate.y)+.03);
      scene.add(s);
    }
    const lampMat=new THREE.MeshBasicMaterial({color:0xffc871});
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(WX(16),10,8),lampMat);
    lamp.position.set(WX(g.gate.x),WX(206),WZ(g.gate.y));
    scene.add(lamp);
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(TEX.glow,1),color:0xffb254,opacity:.7,
      transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,opacity:.95}));
    halo.scale.set(5.2,5.2,1);
    halo.position.copy(lamp.position);
    scene.add(halo);
    gateLight=new THREE.PointLight(0xffb254,4.2,30,2);
    gateLight.position.set(WX(g.gate.x),WX(206),WZ(g.gate.y));
    scene.add(gateLight);
  } else gateLight=null;

  // the sign — the only saturated thing in the game
  if(g.sign){
    const grp=new THREE.Group();
    const plate=new THREE.Mesh(new THREE.BoxGeometry(WX(90),WX(64),.03),
      new THREE.MeshStandardMaterial({color:0xe8e4da,roughness:.6,emissive:0x140404}));
    plate.position.y=WX(120); plate.castShadow=true;
    const frame=new THREE.Mesh(new THREE.BoxGeometry(WX(96),WX(70),.02),
      new THREE.MeshStandardMaterial({color:0xc9302c,emissive:0x5a0f0d,roughness:.7}));
    frame.position.set(0,WX(120),-.02);
    for(const px of [-WX(34),WX(34)]){
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,WX(120),6),
        new THREE.MeshStandardMaterial({color:0x6e6a63,roughness:.9}));
      leg.position.set(px,WX(60),0); leg.castShadow=true; grp.add(leg);
    }
    for(let i=0;i<3;i++){
      const bar=new THREE.Mesh(new THREE.BoxGeometry(WX(60-i*10),WX(7),.01),
        new THREE.MeshBasicMaterial({color:0xc9302c}));
      bar.position.set(0,WX(136-i*16),.02); grp.add(bar);
    }
    grp.add(plate); grp.add(frame);
    grp.position.set(WX(g.sign.x),0,WZ(g.sign.y));
    scene.add(grp);
    signLight=new THREE.PointLight(0xc9302c,2.2,9,2);
    signLight.position.set(WX(g.sign.x),WX(130),WZ(g.sign.y)+.3);
    scene.add(signLight);
  } else signLight=null;

  // lights
  if(g.sunset){
    hemi=new THREE.HemisphereLight(0xffb072,0x2e1f20,g.ambient*.62);
    scene.add(hemi);
    ambientL=new THREE.AmbientLight(0x5a3a4e,g.ambient*.16);
    scene.add(ambientL);
    // the sun sits on the water behind the wreck, so everything throws a long shadow inland
    const sun=new THREE.DirectionalLight(0xff8a3d,2.1);
    sun.position.set(WX(g.W)*.55, 9, -52);
    sun.target.position.set(WX(g.W)*.5, 0, WZ(g.H)*.7);
    sun.castShadow=true;
    sun.shadow.mapSize.width=1024; sun.shadow.mapSize.height=1024;
    const sc=sun.shadow.camera;
    sc.left=-34; sc.right=34; sc.top=34; sc.bottom=-34; sc.near=1; sc.far=140;
    sun.shadow.bias=-0.0012;
    scene.add(sun); scene.add(sun.target);
    // a cool fill from the sky opposite, so shadows read blue against the amber
    const fill=new THREE.DirectionalLight(0x5f7fb0,.30);
    fill.position.set(-WX(g.W)*.2, 22, WZ(g.H)*1.2);
    scene.add(fill);
  } else {
    hemi=new THREE.HemisphereLight(0x9fb4bd,0x3a3229,g.ambient*.66);
    scene.add(hemi);
    ambientL=new THREE.AmbientLight(0x5a6a72,g.ambient*.12);
    scene.add(ambientL);
  }

  torch=new THREE.SpotLight(0xfff0d6,g.torch*3.1,34,0.52,0.55,1.4);
  torch.castShadow=true;
  torch.shadow.mapSize.width=1024;
  torch.shadow.mapSize.height=1024;
  torch.shadow.camera.near=.4;
  torch.shadow.camera.far=30;
  torch.shadow.bias=-0.0012;
  torch.position.set(.16,-.12,0);
  camera.add(torch);
  camera.add(torch.target);
  torch.target.position.set(0,-.05,-1);

  if(lantern){ camera.remove(lantern); lantern=null; }
  if(lanternMesh){ camera.remove(lanternMesh); lanternMesh=null; }
  // a storm lantern in the off hand: a soft pool around your own feet, so you are
  // never standing in absolute black even when the beam points elsewhere
  lantern=new THREE.PointLight(0xffb866, g.sky==='night'?2.3:1.0, g.sky==='night'?9:5, 2);
  lantern.position.set(-.30,-.34,-.16);
  camera.add(lantern);

  const glass=new THREE.Mesh(new THREE.CylinderGeometry(.052,.058,.12,10),
    new THREE.MeshBasicMaterial({color:0xffd79a}));
  const cage=new THREE.Mesh(new THREE.CylinderGeometry(.062,.068,.17,10,1,true),
    new THREE.MeshStandardMaterial({color:0x4a4038,roughness:.8,metalness:.4,side:THREE.DoubleSide}));
  const bail=new THREE.Mesh(new THREE.TorusGeometry(.05,.006,6,12,Math.PI),
    new THREE.MeshStandardMaterial({color:0x4a4038,roughness:.8,metalness:.5}));
  lanternMesh=new THREE.Group();
  glass.position.y=.0; cage.position.y=.0; bail.position.y=.10; bail.rotation.y=Math.PI/2;
  lanternMesh.add(glass); lanternMesh.add(cage); lanternMesh.add(bail);
  lanternMesh.position.set(-.30,-.34,-.20);
  lanternMesh.scale.setScalar(.9);
  camera.add(lanternMesh);
  lanternGlass=glass;

  scene.add(camera);

  // dynamic bodies
  for(const z of g.infected){
    const h=makeInfected();
    scene.add(h.grp); dyn.infected.push({z,h});
  }
  for(const s of g.survivors){
    const h=makeHuman({skin:0xbc9c80,cloth:0xa9a698,vis:true});
    scene.add(h.grp); dyn.survivors.push({s,h});
  }
  // the catch, left where it fell — about a third of it still moves
  dyn.fish=[];
  for(const f of (g.fish||[])){
    const m=makeFish();
    const y0=f.onStall?WX(36):WX(3);
    m.position.set(WX(f.x), y0, WZ(f.y));
    m.rotation.y=f.r;
    m.rotation.z=(Math.random()-.5)*.5;          // half of them belly-up
    m.scale.setScalar(f.s);
    scene.add(m);
    if(Math.random()<.34){
      dyn.fish.push({m, y0, base:m.rotation.z, yaw:f.r,
                     t:Math.random()*5, next:.4+Math.random()*3.2, fit:0});
    }
  }

  for(const it of g.items){
    const m=makeWeaponMesh(it.kind);
    m.position.set(WX(it.x),0,WZ(it.y));
    m.rotation.z=0.42;
    m.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
    scene.add(m); dyn.items.push({it,m});
  }

  // held weapon rides the camera
  if(viewModel){ camera.remove(viewModel); viewModel=null; }
  syncWeapon(g);
}

function syncWeapon(g){
  const k=g.P.weapon.key;
  if(CONSUMABLE[k]) return;
  if(viewModel && viewModel.userData.kind===k) return;
  if(viewModel){ camera.remove(viewModel); viewModel=null; }
  if(k==='none') return;
  const m=makeWeaponMesh(k);
  m.userData.kind=k;
  m.scale.setScalar(k==="spear"?.46:.60);
  camera.add(m);
  viewModel=m;
}

const _v=new THREE.Vector3();
function syncScene(g,dt){
  if(!scene) return;
  const P=g.P;
  // camera
  camera.position.set(WX(P.x), (g.camH||EYE)+P.bob+WX(P.z||0), WZ(P.y));
  camera.rotation.order='YXZ';
  camera.rotation.y = -P.a - Math.PI/2;
  camera.rotation.x = Math.sin(P.breath)*0.006;
  camera.rotation.z = (g.roll||0) + (g.shake? (Math.random()-.5)*g.shake : 0);

  if(torch){
    torch.intensity = g.torch*3.1*(g.lightJitter||1);
    torch.position.x = .16 + P.bob*.5;
  }
  if(signLight) signLight.intensity = 2.0+Math.sin(t*2.1)*.25;
  if(gateLight) gateLight.intensity = 4.0+Math.sin(t*6.3)*.55+Math.sin(t*17.1)*.28;
  if(lantern){
    const flick = 1 + Math.sin(t*7.4)*.07 + Math.sin(t*19.3)*.04;
    lantern.intensity = (g.sky==="night"?2.3:1.0) * flick * (g.lightJitter||1);
    if(lanternMesh){ lanternMesh.position.y = -.34 + P.bob*.7; lanternMesh.rotation.z = Math.sin(t*2.1)*.06 + P.bob*1.2; }
    if(lanternGlass) lanternGlass.material.color.setHSL(.09,.62,Math.min(.72,.52*flick));
  }

  // infected
  for(const e of dyn.infected){
    const z=e.z,h=e.h;
    if(z.dead||!g.infected.includes(z)){ h.grp.visible=false; continue; }
    h.grp.visible=true;
    h.grp.position.set(WX(z.x),0,WZ(z.y));
    h.grp.rotation.y = -(z.face!==undefined?z.face:0) - Math.PI/2;

    const hunting = z.seen || z.watched;
    const sw=Math.sin(z.gait)*(hunting?.78:.36);
    // the legs swing wide and out of phase with the arms — a broken walk
    h.legL.rotation.x= sw;        h.legR.rotation.x=-sw;
    h.armL.rotation.x=-sw*.42-.18; h.armR.rotation.x= sw*.42-.18;
    h.armL.rotation.z= .10+Math.sin(z.gait*1.7)*.07;
    h.armR.rotation.z=-.10-Math.sin(z.gait*1.7)*.07;
    // it folds further forward the closer it gets to you
    h.spine.rotation.x = 0.30 + (hunting?0.34:0) + Math.sin(z.gait*2)*.03;

    // involuntary spasms: the head snaps, then holds still too long
    h.twitch-=dt;
    if(h.twitch<=0){
      h.twitch = hunting ? .25+Math.random()*.7 : .8+Math.random()*2.4;
      h.jerkY=(Math.random()-.5)*(hunting?1.15:.55);
      h.jerkZ=(Math.random()-.5)*(hunting?.75:.4);
      h.jerkX=(Math.random()-.5)*.4;
    }
    const ease=Math.min(1,dt*12);
    h.neck.rotation.y += ((h.jerkY||0)-h.neck.rotation.y)*ease;
    h.neck.rotation.z += ((z.lean+(h.jerkZ||0))-h.neck.rotation.z)*ease;
    h.neck.rotation.x += (((h.jerkX||0)+ (hunting?-.22:.10))-h.neck.rotation.x)*ease;

    // the jaw hangs open and gapes wider when it has you
    const wantJaw = hunting ? .55+Math.sin(t*9+z.x)*.22 : .18;
    h.jawOpen += (wantJaw-h.jawOpen)*Math.min(1,dt*7);
    h.jaw.rotation.x = h.jawOpen;
    h.jaw.position.y = -.045 - h.jawOpen*.03;
    h.mouth.scale.y = .6 + h.jawOpen*2.4;

    h.grp.position.y = Math.abs(Math.sin(z.gait))*(hunting?.05:.025);

    const hot = hunting;
    h.eyeMat.color.setHex(hot?0xff2a1e:0x611611);
    h.glowMat.opacity = hot ? .48+Math.sin(t*6+z.y)*.16 : .05;
  }
  // survivors
  for(const e of dyn.survivors){
    const s=e.s,h=e.h;
    if(s.state==='out'){ h.grp.visible=false; continue; }
    h.grp.visible=true;
    h.grp.position.set(WX(s.x),0,WZ(s.y));
    if(s.state==='down'){
      h.grp.rotation.x=-Math.PI/2.1; h.grp.position.y=.16;
    } else {
      h.grp.rotation.x=0;
      const a=Math.atan2(P.y-s.y,P.x-s.x);
      h.grp.rotation.y=-a-Math.PI/2;
      const sw=s.state==='follow'?Math.sin(s.gait)*.5:0;
      h.legL.rotation.x=sw; h.legR.rotation.x=-sw;
      if(s.state==='trapped'){
        h.grp.position.y=-.34;                            // pinned low
        h.armL.rotation.z = -1.1+Math.sin(s.wave*2.2)*.5; // waving for you
        h.armR.rotation.z = 0;
      } else {
        h.grp.position.y=Math.abs(Math.sin(s.gait))*.02;
        h.armL.rotation.z=0; h.armL.rotation.x=-sw*.6; h.armR.rotation.x=sw*.6;
      }
    }
  }
  // the waterline creeps up the sand and slides back — two swells at different
  // periods so it never reads as a loop
  if(seaFoam){
    const t=performance.now()*.001;
    if(seaTex){                       // the swell moving across the surface
      seaTex[0].offset.y = t*.019; seaTex[0].offset.x = Math.sin(t*.07)*.03;
      seaTex[1].offset.y = t*.034; seaTex[1].offset.x = Math.sin(t*.11)*.05;
    }
    seaFoam.position.z = seaFoam.userData.z0 +
      (Math.sin(t*.55)*.9 + Math.sin(t*.23+1.7)*.45)*WX(9);
    seaFoam.material.opacity = seaFoam.userData.op0 *
      (.72 + .28*Math.abs(Math.sin(t*.55)));
  }

  // the ones that are not finished dying: a sudden flap, then stillness again

  for(const f of (dyn.fish||[])){
    f.next-=dt;
    if(f.next<=0){ f.next=1.1+Math.random()*4.5; f.fit=.30+Math.random()*.34; }
    if(f.fit>0){
      f.fit=Math.max(0,f.fit-dt*1.7);
      f.t+=dt*34;
      f.m.rotation.z = f.base + Math.sin(f.t)*f.fit*1.5;
      f.m.rotation.y = f.yaw  + Math.sin(f.t*.7)*f.fit*.6;
      f.m.position.y = f.y0   + Math.abs(Math.sin(f.t*.5))*f.fit*.07;
    } else if(f.m.position.y!==f.y0){
      f.m.rotation.z=f.base; f.m.rotation.y=f.yaw; f.m.position.y=f.y0;
    }
  }

  // pickups
  for(const e of dyn.items){
    e.m.visible=!e.it.taken;
    if(e.m.visible) e.m.rotation.y+=dt*.7;
  }
  const sb=document.getElementById("stabBtn");
  if(sb){ sb.hidden = !g.stabReady; sb.textContent = g.stabArmed ? "طعن" : "دفع"; }
  syncWeapon(g);
  if(viewModel){
    const lunge=Math.sin(Math.min(1,(P.swing/(P.weapon.cd||1))/.75)*Math.PI);
    viewModel.position.set(.34-lunge*.09, -.40+P.bob*.6-lunge*.05, -.46+lunge*.22);
    viewModel.rotation.set(-1.28+lunge*.52, .30, .34);
  }
}

/* ---------------- the lens ----------------
   the scene is rendered into a buffer, then photographed: a filmic grade with
   cold shadows and warm light, a little bloom, chromatic aberration that grows
   toward the edges the way a real lens does, a vignette, and grain that thickens
   as the dread rises. this pass is most of the difference between a render and
   a photograph, and it is the first thing dropped if the device cannot keep up */
const POST_VS='varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }';
const POST_FS=[
'precision highp float;',
'varying vec2 vUv;',
'uniform sampler2D tDiffuse;',
'uniform vec2 uTexel;',
'uniform float uTime,uGrain,uVig,uCA,uBloom,uDread;',
'float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
'void main(){',
'  vec2 uv=vUv; vec2 c=uv-0.5; float r=dot(c,c);',
'  float ca=uCA*(0.55+r*2.4);',
'  vec3 col;',
'  col.r=texture2D(tDiffuse,uv+c*ca).r;',
'  col.g=texture2D(tDiffuse,uv).g;',
'  col.b=texture2D(tDiffuse,uv-c*ca).b;',
'  vec3 bl=texture2D(tDiffuse,uv+uTexel*vec2( 3.0, 1.0)).rgb',
'         +texture2D(tDiffuse,uv+uTexel*vec2(-3.0,-1.0)).rgb',
'         +texture2D(tDiffuse,uv+uTexel*vec2( 1.0,-3.0)).rgb',
'         +texture2D(tDiffuse,uv+uTexel*vec2(-1.0, 3.0)).rgb;',
'  bl=max(bl*0.25-0.60,0.0);',
'  col+=bl*uBloom;',
'  float l=dot(col,vec3(0.299,0.587,0.114));',
'  col*=mix(vec3(0.76,0.91,1.08),vec3(1.12,0.98,0.84),smoothstep(0.06,0.74,l));',
'  col=mix(vec3(l),col,0.84);',
'  col=clamp((col-0.5)*1.12+0.5,0.0,1.8);',
'  col*=1.0-uVig*smoothstep(0.16,0.80,r);',
'  float g=hash(uv*1024.0+fract(uTime));',
'  col+=(g-0.5)*uGrain*(1.0+uDread*1.7);',
'  gl_FragColor=vec4(col,1.0);',
'}'].join('\n');

let post=null;
function buildPost(){
  if(post||!renderer) return;
  try{
    const rt=new THREE.WebGLRenderTarget(2,2,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
      format:THREE.RGBAFormat, depthBuffer:true, stencilBuffer:false});
    rt.texture.encoding=THREE.sRGBEncoding;     // the scene pass writes what the canvas would have
    const mat=new THREE.ShaderMaterial({
      uniforms:{tDiffuse:{value:rt.texture}, uTexel:{value:new THREE.Vector2(1/960,1/540)},
                uTime:{value:0}, uGrain:{value:.052}, uVig:{value:.55},
                uCA:{value:.0020}, uBloom:{value:.60}, uDread:{value:0}},
      vertexShader:POST_VS, fragmentShader:POST_FS, depthTest:false, depthWrite:false});
    const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat);
    quad.frustumCulled=false;
    const sc=new THREE.Scene(); sc.add(quad);
    post={rt,mat,scene:sc,cam:new THREE.OrthographicCamera(-1,1,1,-1,0,1),on:true};
    sizePost();
  }catch(e){ post=null; }
}
function sizePost(){
  if(!post||!renderer) return;
  const v=new THREE.Vector2(); renderer.getDrawingBufferSize(v);
  post.rt.setSize(Math.max(2,v.x),Math.max(2,v.y));
  post.mat.uniforms.uTexel.value.set(1/Math.max(2,v.x),1/Math.max(2,v.y));
}
function renderFrame(){
  if(post&&post.on){
    post.mat.uniforms.uTime.value=t;
    post.mat.uniforms.uDread.value=G?(G.dread||0):0;
    renderer.setRenderTarget(post.rt);
    renderer.render(scene,camera);
    renderer.setRenderTarget(null);
    renderer.render(post.scene,post.cam);
  } else {
    renderer.render(scene,camera);
  }
}

/* ---------------- loop ---------------- */

let frameAvg=16;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now; t+=dt;
  frameAvg+=((dt*1000)-frameAvg)*0.05;
  // building a scene costs several slow frames on purpose — the normal maps and
  // the environment are generated there — so the governor stays quiet until the
  // frame time has settled, or it would switch the lens off over a loading spike
  if(now-builtAt > 2500){
    // the lens costs a full-screen pass: on a device that genuinely cannot hold
    // the frame it goes first, before the picture is allowed to get smaller
    if(frameAvg>40 && post && post.on) post.on=false;
    if(frameAvg>34 && renderer.getPixelRatio()>0.85) renderer.setPixelRatio(Math.max(0.85,renderer.getPixelRatio()-0.12));
  }
  if(paused){ /* held */ }
  else if(intro) updateIntro(dt);
  else if(outro) updateOutro(dt);
  else if(running) update(dt);
  syncScene(G,dt);
  renderFrame();
  updateHUD();
  raf=requestAnimationFrame(loop);
}

/* ---------------- HUD ---------------- */
const pipsEl=document.getElementById('pips'), countEl=document.getElementById('count');
const hpEl=document.getElementById('hp'), wepEl=document.getElementById('wep');
const hideEl=document.getElementById('hideTag'), toastEl=document.getElementById('toast');
let hudSig='';
function updateHUD(){
  if(!G) return;
  pauseBtn.hidden = !(running||paused);
  const P=G.P, sec=rescue.saved.length, wi=G.following||0, lost=rescue.lost.length;
  const sig=[sec,wi,lost,P.hp,P.weapon.key,P.hidden,G.toastT>0?G.toast:'',
             Math.round((G.behind||0)*10),carried.medkit,carried.energy,P.boost>0].join('|');
  if(sig!==hudSig){
    hudSig=sig;
    let ph='';
    for(let i=0;i<4;i++){
      const cls = i<sec?'out' : i<sec+wi?'with' : i<4-lost?'' : 'gone';
      ph+=`<span class="pip ${cls}"></span>`;
    }
    pipsEl.innerHTML=ph;
    countEl.textContent=(sec+wi)+' / 4';
    let hh='';
    for(let i=0;i<4;i++) hh+=`<i class="${i<P.hp?'':'off'}"></i>`;
    hpEl.innerHTML=hh;
    wepEl.hidden = P.weapon.key==='none';
    wepEl.textContent = P.weapon.name;

    document.getElementById('invWeapon').textContent = P.weapon.key==='none' ? '—' : P.weapon.name;
    document.getElementById('invMed').textContent = carried.medkit||0;
    document.getElementById('invEnergy').textContent = carried.energy||0;
    document.getElementById('slotMed').disabled = !carried.medkit;
    document.getElementById('slotEnergy').disabled = !carried.energy;
    document.getElementById('shield').classList.toggle('on', P.boost>0);
    hideEl.hidden = !P.hidden;
    toastEl.textContent = G.toast||'';
    toastEl.classList.toggle('on', G.toastT>0);
    senseEl.style.opacity = (G.behind||0)*0.55;
    senseEl.style.background = `radial-gradient(ellipse at ${(G.behind||0)>0?'50%':'50%'} 120%, rgba(201,48,44,.5), transparent 60%)`;
  }
}

/* ============================================================
   audio (unchanged: everything synthesised)
   ============================================================ */
/* sound is on by default; browsers still forbid any audio before the first
   gesture, so it arms itself on whatever the player touches first */
let AC=null,master=null,seaGain=null,on=true,hbPhase=0,NOISE=null,armed=false;
function audio(){
  if(AC) return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  const len=AC.sampleRate*2;
  NOISE=AC.createBuffer(1,len,AC.sampleRate);
  const d=NOISE.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=NOISE; src.loop=true;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
  seaGain=AC.createGain(); seaGain.gain.value=0;
  src.connect(lp).connect(seaGain).connect(master); src.start();
  setInterval(()=>{
    if(!on||!seaGain) return;
    const now=AC.currentTime;
    seaGain.gain.cancelScheduledValues(now);
    seaGain.gain.setTargetAtTime(.04+Math.random()*.04,now,1.7);
  },2600);
  return AC;
}
function out(pan){
  if(!AC) return null;
  if(!pan||!AC.createStereoPanner) return master;
  const p=AC.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,pan)); p.connect(master); return p;
}
function nburst(o){
  if(!on||!AC) return;
  const now=AC.currentTime,dur=o.dur;
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  s.playbackRate.value=.8+Math.random()*.4;
  const f=AC.createBiquadFilter(); f.type=o.type||'bandpass';
  f.frequency.setValueAtTime(o.f0,now);
  f.frequency.exponentialRampToValueAtTime(Math.max(40,o.f1),now+dur);
  f.Q.value=o.q||1;
  const g=AC.createGain(), atk=o.atk||dur*.26;
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,o.vol),now+atk);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  s.connect(f).connect(g).connect(out(o.pan)); s.start(now); s.stop(now+dur+.04);
}
function vtone(o){
  if(!on||!AC) return;
  const now=AC.currentTime,dur=o.dur;
  const osc=AC.createOscillator(); osc.type=o.type||'sawtooth';
  osc.frequency.setValueAtTime(o.f0,now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),now+dur);
  if(o.wobble){
    const w=AC.createOscillator(); w.type='sine'; w.frequency.value=o.wobRate||7.5;
    const wg=AC.createGain(); wg.gain.value=o.wobble;
    w.connect(wg).connect(osc.frequency); w.start(now); w.stop(now+dur+.05);
  }
  const f=AC.createBiquadFilter();
  f.type=o.filterType||'lowpass'; f.frequency.value=o.cut||700; f.Q.value=o.q||1;
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,o.vol),now+(o.atk||dur*.22));
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  osc.connect(f).connect(g).connect(out(o.pan)); osc.start(now); osc.stop(now+dur+.04);
}
let breathPhase=0,breathIn=true;
function breathing(dt,exertion,dread,hurt){
  if(!on||!AC) return;
  const rate=.38+exertion*.30+dread*.72+hurt*.55;
  breathPhase+=dt*rate;
  const lvl=.075+dread*.135+exertion*.060+hurt*.075;
  if(breathIn&&breathPhase>=.46){
    breathIn=false;
    nburst({dur:.40+.16*(1-dread),type:'bandpass',f0:520,f1:220,q:1.0,vol:lvl});
    vtone({type:'sawtooth',f0:126,f1:100,dur:.30,vol:lvl*(.34+dread*.36),cut:400,wobble:5});
  }
  if(breathPhase>=1){
    breathPhase=0; breathIn=true;
    nburst({dur:.30,type:'bandpass',f0:260,f1:800,q:1.4,vol:lvl*1.05});
    if(dread>.45) nburst({dur:.14,type:'highpass',f0:1400,f1:2600,q:.8,vol:lvl*.5});
  }
}
function jumpGrunt(){
  nburst({dur:.16,type:"bandpass",f0:600,f1:280,q:1.1,vol:.05,atk:.01});
  vtone({type:"sawtooth",f0:160,f1:120,dur:.14,vol:.045,cut:600});
}
function gruntEffort(){

}
function gruntPain(){
  vtone({type:'sawtooth',f0:230+Math.random()*40,f1:118,dur:.52,vol:.115,cut:900,q:1.3,wobble:11,wobRate:9});

}
const STEP_SURFACE={
  1:{f0:1500,f1:420,q:.7,dur:.17,thump: 95},            // sand: soft, no edge
  2:{f0:1050,f1:330,q:.8,dur:.14,thump: 78,wet:true},   // market: rot underfoot
  3:{f0:2700,f1:880,q:1.3,dur:.10,thump:130}            // tile: a hard slap
};

function footstep(screen,vol,pan){
  const s=STEP_SURFACE[screen]||STEP_SURFACE[2];
  // the scuff across the surface
  nburst({dur:s.dur,type:'bandpass',f0:s.f0*(.85+Math.random()*.3),f1:s.f1,q:s.q,vol,pan,atk:.008});
  // and the weight landing, which is what makes it a foot instead of a hiss
  vtone({type:'sine',f0:s.thump*(.9+Math.random()*.2),f1:s.thump*.55,dur:.09,
         vol:vol*.95,cut:260,q:.8,atk:.004,pan});
  // the market floor answers back
  if(s.wet) nburst({dur:.09,type:'bandpass',f0:2400+Math.random()*700,f1:820,q:2.2,
                    vol:vol*.45,pan,atk:.004});
}

/* ---- the blow: air, then the hard part, then the body it landed in ---- */
const HIT={
  none :{f0:1500,f1:420,q:1.0,body:150,vol:.15},
  knife:{f0:3300,f1:900,q:2.5,body:210,vol:.20},
  oar  :{f0:1150,f1:250,q:1.0,body: 94,vol:.30},   // wood, and it is heavy
  spear:{f0:2300,f1:520,q:1.9,body:126,vol:.27}    // steel going in
};
function swingSnd(key,pan){
  const k=HIT[key]||HIT.none;
  nburst({dur:.18,type:'bandpass',f0:k.f0*.55,f1:240,q:.75,vol:.085,pan,atk:.06});
}
function impact(key,pan,kill){
  const k=HIT[key]||HIT.none;
  nburst({dur:.085,type:'bandpass',f0:k.f0,f1:k.f1,q:k.q,vol:k.vol,pan,atk:.003});
  vtone({type:'sine',f0:k.body,f1:k.body*.45,dur:.17,vol:k.vol*.95,cut:300,q:1,atk:.004,pan});
  nburst({dur:.23,type:'lowpass',f0:900,f1:180,q:.7,vol:k.vol*.55,pan,atk:.014});
  if(kill){                                        // it goes down heavily
    vtone({type:'sawtooth',f0:72,f1:33,dur:.52,vol:.22,cut:190,q:1.1,atk:.006,pan});
    nburst({dur:.36,type:'lowpass',f0:1400,f1:150,q:.8,vol:.17,pan,atk:.022});
  }
}

function callOut(dist,pan,urgent){

/* ---- a grey coast: surf that breaks, and birds that will not shut up ---- */
function waveCrash(vol){
  if(!on||!AC) return;
  const now=AC.currentTime, dur=1.9+Math.random()*1.1;
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  s.playbackRate.value=.55+Math.random()*.3;
  const f=AC.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(240,now);
  f.frequency.linearRampToValueAtTime(1500,now+.30);   // the break
  f.frequency.exponentialRampToValueAtTime(330,now+dur); // the drag back
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,now);
  g.gain.linearRampToValueAtTime(vol,now+.26);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  s.connect(f).connect(g).connect(out((Math.random()-.5)*1.2));
  s.start(now); s.stop(now+dur+.05);
}
function gull(pan){
  if(!on||!AC) return;
  const now=AC.currentTime;
  const calls=2+((Math.random()*3)|0);
  for(let i=0;i<calls;i++){
    const t0=now+i*(.17+Math.random()*.12);
    const o=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter();
    o.type='sawtooth';
    const base=760+Math.random()*320;
    o.frequency.setValueAtTime(base*.72,t0);
    o.frequency.exponentialRampToValueAtTime(base*1.28,t0+.06);
    o.frequency.exponentialRampToValueAtTime(base*.58,t0+.20);
    const w=AC.createOscillator(); w.type='sine'; w.frequency.value=22+Math.random()*14;
    const wg=AC.createGain(); wg.gain.value=40;
    w.connect(wg).connect(o.frequency); w.start(t0); w.stop(t0+.24);
    f.type='bandpass'; f.frequency.value=base*1.25; f.Q.value=3.4;
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(.055-i*.008,t0+.03);
    g.gain.exponentialRampToValueAtTime(.0001,t0+.22);
    o.connect(f).connect(g).connect(out(pan));
    o.start(t0); o.stop(t0+.25);
  }
}
let ambT=0, gullT=0;
function ambience(dt,screen){
  if(!on||!AC) return;
  ambT-=dt; gullT-=dt;
  if(ambT<=0){
    ambT = screen===1 ? 2.2+Math.random()*2.0 : 4.5+Math.random()*3.5;
    waveCrash(screen===1 ? .085+Math.random()*.05 : .035+Math.random()*.025);
  }
  if(gullT<=0){
    gullT = screen===1 ? 4.5+Math.random()*6 : 16+Math.random()*14;
    if(screen!==3) gull((Math.random()-.5)*1.5);
  }
}

const VO_TRIM={1:[1.25,4.65], 2:[1.25,5.90], 3:[0.30,4.60]};
// and a per-take gain, because take three was recorded louder than the others
const VO_GAIN={1:1.05, 2:1.06, 3:0.78};
const voBuf={};
let voNode=null;

function voStop(){
  if(voNode){ try{ voNode.onended=null; voNode.stop(); }catch(e){} voNode=null; }
  if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} }
}
function voLoad(n){
  if(voBuf[n]) return Promise.resolve(voBuf[n]);
  if(!AC) return Promise.reject(new Error('no context'));
  return fetch(VO_SRC[n])
    .then(r=>r.arrayBuffer())
    .then(b=>new Promise((ok,no)=>{ AC.decodeAudioData(b,ok,no); }))
    .then(buf=>{ voBuf[n]=buf; return buf; });
}
// pull the score and the surf down under the words, then let them back up
function voDuck(v,t){
  if(!on||!AC) return;
  if(mus.gain)  mus.gain.gain.setTargetAtTime(v*.45,AC.currentTime,t);
  if(seaGain)   seaGain.gain.setTargetAtTime(v*.03,AC.currentTime,t);
}
function speakBrief(n){
  voStop();
  if(!on) return;
  if(!AC) audio();
  if(!AC || !VO_SRC[n]) return speakBriefTTS(n);
  voLoad(n).then(buf=>{
    if(!on||!AC) return;
    const t=VO_TRIM[n]||[0,buf.duration];
    const src=AC.createBufferSource(); src.buffer=buf;
    const g=AC.createGain(); g.gain.value=(VO_GAIN[n]||1)*.95;
    src.connect(g).connect(master);
    voNode=src;
    voDuck(.35,.25);
    src.onended=()=>{ if(voNode===src){ voNode=null; voDuck(2.2,.9); } };
    try{ src.start(AC.currentTime, t[0], t[1]); }
    catch(e){ voNode=null; voDuck(2.2,.9); speakBriefTTS(n); }
  }).catch(()=>speakBriefTTS(n));
}

/* ---- the fallback: machine speech, if the recordings cannot be decoded ---- */
const BRIEF={
  1:'احذر من الزومبي، واختر أسلحة نجاتك بعناية.',
  2:'عليك أن تنقذ المصابين من بين الزومبي، ولا تترك أحداً خلفك.',
  3:'سبيل النجاة قريب، ولكن أنقذ الفتاة الصغيرة أولاً.'
};
let briefVoice=null;
// a Saudi voice if the device has one, a Gulf one next, any Arabic last.
// named Saudi voices (Naayf, Hamed, Zariyah, Majed) are scored above a bare
// ar-SA tag, because some devices label a Levantine voice ar-SA
function pickArabicVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^ar/i.test(v.lang));
  if(!vs.length) return null;
  const score=v=>{
    let k=0;
    if(v.localService) k+=3;                 // clearer, and it never waits on a network
    if(/ar[-_]SA/i.test(v.lang)) k+=1;       // a tie-break, nothing more
    return k;
  };
  return vs.slice().sort((a,b)=>score(b)-score(a))[0];
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged=()=>{ briefVoice=pickArabicVoice(); };
}
function speakBriefTTS(n){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const line=BRIEF[n]; if(!line) return;
  if(!briefVoice) briefVoice=pickArabicVoice();
  // one steady utterance. chopping it into gasps and pitching it up made the
  // words unintelligible and the delivery grating — the dread is in the writing
  const u=new SpeechSynthesisUtterance(line.replace(/…/g,'،'));
  if(briefVoice) u.voice=briefVoice;
  u.lang='ar-SA';
  u.rate  = 0.92;    // steady. hesitation is what made it sound frightened
  u.pitch = 0.86;    // lower and level — a voice that has already decided
  u.volume= 1.0;
  // pull the score and the surf down underneath the words, then let them back up
  const duck=(v,t)=>{ if(on&&AC){ if(mus.gain) mus.gain.gain.setTargetAtTime(v*.45,AC.currentTime,t);
                                  if(seaGain) seaGain.gain.setTargetAtTime(v*.03,AC.currentTime,t); } };
  u.onstart=()=>duck(.35,.25);
  u.onend=()=>duck(2.2,.9);
  u.onerror=()=>duck(2.2,.9);
  try{ speechSynthesis.speak(u); }catch(e){}
}

function thump(v){
  if(!on||!AC) return;
  const now=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(64,now);
  o.frequency.exponentialRampToValueAtTime(34,now+.16);
  g.gain.setValueAtTime(v,now);
  g.gain.exponentialRampToValueAtTime(.0001,now+.30);
  o.connect(g).connect(master); o.start(now); o.stop(now+.32);
}
function heartbeat(dt,dread){
  if(dread<.10){ hbPhase=0; return; }
  hbPhase+=dt*(.85+dread*2.1);
  if(hbPhase>=1){ hbPhase=0; thump(.05+dread*.16); setTimeout(()=>thump(.03+dread*.10),150); }
}
function hush(depth,hold){
  if(!on||!AC||!seaGain) return;
  const now=AC.currentTime;
  seaGain.gain.cancelScheduledValues(now);
  seaGain.gain.setTargetAtTime(depth,now,.06);
  seaGain.gain.setTargetAtTime(.055,now+(hold||.7),.9);
}
function beep(f,dur,vol){ if(on&&AC) vtone({type:'square',f0:f,f1:f*.8,dur,vol,cut:2200}); }

/* chase score */
/* ============================================================
   the score: dread first, panic second.
   a detuned tritone drone underneath everything; the beat only arrives
   once something is actually hunting you.
   ============================================================ */
const ROOT=55;                                   // A1
const TRITONE=Math.pow(2,6/12);
// the heart at rest, and the heart that knows. this pulse IS the grid: every
// other element is placed against it, so the whole score accelerates with the
// threat instead of playing a busier pattern at the same tempo
const BPM_CALM=44, BPM_HUNT=112;
// semitone, tritone, minor ninth — the intervals an ear refuses to resolve
const COLD=[0,1,6,13,18];

let mus={playing:false,step:0,next:0,timer:null,gain:null,level:0,
         droneA:null,droneB:null,droneC:null,droneGain:null,droneFilt:null,
         lastBraam:0,lastWhine:0,lastBreath:0,lastRise:0};

// the curve matters: the resting level in play is about .72, so a straight
// mapping would start the heart already racing. this keeps room above it
function bpmNow(){
  const L=Math.min(1,Math.max(0,mus.level));
  return BPM_CALM + (BPM_HUNT-BPM_CALM)*Math.pow(L,1.6);
}
function stepNow(){ return 60/bpmNow()/4; }

function musicInit(){
  if(mus.gain) return;
  mus.gain=AC.createGain(); mus.gain.gain.value=0;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-20; comp.ratio.value=7;
  mus.gain.connect(comp).connect(master);

  mus.droneFilt=AC.createBiquadFilter();
  mus.droneFilt.type='lowpass'; mus.droneFilt.frequency.value=170; mus.droneFilt.Q.value=7;
  mus.droneGain=AC.createGain(); mus.droneGain.gain.value=0;
  mus.droneFilt.connect(mus.droneGain).connect(mus.gain);

  // three saws: a root, a tritone above it, and a minor ninth that beats
  // against both. nothing here is in tune with anything else, deliberately
  const mk=(freq,det)=>{
    const o=AC.createOscillator(); o.type='sawtooth';
    o.frequency.value=freq; o.detune.value=det;
    o.connect(mus.droneFilt); o.start(); return o;
  };
  mus.droneA=mk(ROOT/2,0);
  mus.droneB=mk((ROOT/2)*TRITONE,14);
  mus.droneC=mk((ROOT/2)*Math.pow(2,13/12),-23);
  // and it sags — a drift so slow you never catch it moving, only notice that
  // the ground is no longer level
  const sag=AC.createOscillator(); sag.type='sine'; sag.frequency.value=0.021;
  const sg=AC.createGain(); sg.gain.value=26;
  sag.connect(sg); sg.connect(mus.droneA.detune); sg.connect(mus.droneC.detune); sag.start();
  const lfo=AC.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.047;
  const lg=AC.createGain(); lg.gain.value=90;
  lfo.connect(lg).connect(mus.droneFilt.frequency); lfo.start();
}
function note(s){ return ROOT*Math.pow(2,s/12); }

/* the pulse: lub, then dub — the second softer and a fraction behind.
   the only regular thing in the score, and it is getting faster */
function mHeart(t0,L){
  const beat=(t,amp,f0)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*.42,t+.19);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(amp,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+.34);
    o.connect(g).connect(mus.gain); o.start(t); o.stop(t+.36);
    // the knock inside it, felt more than heard
    const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=155;
    const ng=AC.createGain();
    ng.gain.setValueAtTime(amp*.5,t);
    ng.gain.exponentialRampToValueAtTime(.0001,t+.10);
    s.connect(f).connect(ng).connect(mus.gain); s.start(t); s.stop(t+.12);
  };
  const a=.42+L*.46;
  beat(t0, a, 74+L*22);
  beat(t0+.175-L*.045, a*.52, 62+L*18);
}

/* something struck in another room. never twice at the same pitch, and the
   decay runs long enough to become uncomfortable */
function mBell(t0){
  const semi=COLD[(Math.random()*COLD.length)|0]+24+(Math.random()<.4?12:0);
  const f0=note(semi);
  for(const d of [-9,7]){
    const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
    o.type='triangle'; o.frequency.value=f0; o.detune.value=d;
    fl.type='bandpass'; fl.frequency.value=f0*1.6; fl.Q.value=3.2;
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(.05,t0+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t0+2.6);
    o.connect(fl).connect(g).connect(mus.gain); o.start(t0); o.stop(t0+2.7);
  }
}

/* the band a scream lives in, held thin and wavering just under notice.
   the ear reads it as distress whether the player registers it or not */
function mWhine(t0){
  const base=2100+Math.random()*1500;
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type='sine';
  o.frequency.setValueAtTime(base,t0);
  o.frequency.linearRampToValueAtTime(base*(.92+Math.random()*.2),t0+3.4);
  const w=AC.createOscillator(); w.type='sine'; w.frequency.value=4.5+Math.random()*3;
  const wg=AC.createGain(); wg.gain.value=9+Math.random()*10;
  w.connect(wg).connect(o.frequency); w.start(t0); w.stop(t0+3.6);
  f.type='bandpass'; f.frequency.value=base; f.Q.value=7;
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(.022,t0+1.1);
  g.gain.exponentialRampToValueAtTime(.0001,t0+3.5);
  o.connect(f).connect(g).connect(mus.gain); o.start(t0); o.stop(t0+3.6);
}

/* someone drawing breath close enough to hear, when nothing should be close
   enough to hear. it plays only while the player believes they are safe */
function mBreath(t0){
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  s.playbackRate.value=.5+Math.random()*.3;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.6;
  f.frequency.setValueAtTime(420,t0);
  f.frequency.linearRampToValueAtTime(880,t0+.9);
  f.frequency.linearRampToValueAtTime(330,t0+2.1);
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(.05,t0+.75);
  g.gain.exponentialRampToValueAtTime(.0001,t0+2.2);
  let dest=mus.gain;
  if(AC.createStereoPanner){
    const p=AC.createStereoPanner(); p.pan.value=(Math.random()-.5)*1.4;
    p.connect(mus.gain); dest=p;                 // beside you, never in front
  }
  s.connect(f).connect(g).connect(dest); s.start(t0); s.stop(t0+2.3);
}

/* a rise that never arrives anywhere: it climbs for four seconds and is cut
   off unresolved. only while something is already coming */
function mRise(t0){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type='sawtooth';
  o.frequency.setValueAtTime(70,t0);
  o.frequency.exponentialRampToValueAtTime(900,t0+3.8);
  f.type='bandpass'; f.Q.value=4;
  f.frequency.setValueAtTime(200,t0);
  f.frequency.exponentialRampToValueAtTime(2400,t0+3.8);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(.085,t0+2.6);
  g.gain.exponentialRampToValueAtTime(.0001,t0+4.0);
  o.connect(f).connect(g).connect(mus.gain); o.start(t0); o.stop(t0+4.05);
}

/* a low detuned stab — the sound a big thing makes when it notices you */
function mBraam(t0){
  for(const d of [0,17,-13]){
    const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=ROOT/2; o.detune.value=d;
    f.type='lowpass'; f.frequency.setValueAtTime(900,t0);
    f.frequency.exponentialRampToValueAtTime(140,t0+1.1);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(.19,t0+.05);
    g.gain.exponentialRampToValueAtTime(.0001,t0+1.25);
    o.connect(f).connect(g).connect(mus.gain); o.start(t0); o.stop(t0+1.3);
  }
}
/* metal dragged on metal, high and thin */
function mScrape(t0){
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  s.playbackRate.value=.6+Math.random()*.5;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=18;
  f.frequency.setValueAtTime(2600+Math.random()*1800,t0);
  f.frequency.exponentialRampToValueAtTime(900,t0+.55);
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(.05,t0+.08);
  g.gain.exponentialRampToValueAtTime(.0001,t0+.6);
  s.connect(f).connect(g).connect(mus.gain); s.start(t0); s.stop(t0+.65);
}

function musicTick(){
  if(!on||!AC||!mus.playing) return;
  if(AC.state!=='running'){ try{ AC.resume(); }catch(e){} return; }
  if(mus.next < AC.currentTime - .05) mus.next = AC.currentTime + .05;
  const ahead=AC.currentTime+.25;
  while(mus.next<ahead){
    const t0=mus.next, s=mus.step, L=mus.level;

    // the heart is the entire rhythm section
    if(s%4===0) mHeart(t0,L);

    // everything else sits on a seven against that four, so the two cycles
    // meet only once every twenty-eight steps and nothing ever settles
    if(s%7===3 && Math.random()<(.20+L*.30)) mBell(t0);
    if(s%7===5 && Math.random()<(.09+L*.20)) mScrape(t0);

    // and these keep clocks of their own, so none of them can be anticipated
    if(t0-mus.lastWhine  > 7+Math.random()*11){ mus.lastWhine=t0;  mWhine(t0); }
    if(L<.85 && t0-mus.lastBreath > 9+Math.random()*13){ mus.lastBreath=t0; mBreath(t0); }
    if(L>.5  && t0-mus.lastBraam  > 5.5+Math.random()*7){ mus.lastBraam=t0;  mBraam(t0); }
    if(L>.8  && t0-mus.lastRise   > 9+Math.random()*8){  mus.lastRise=t0;   mRise(t0); }

    mus.next+=stepNow(); mus.step=(s+1)%28;
  }
}
function musicStart(){
  if(!on||!AC) return;
  musicInit();
  if(mus.playing) return;
  mus.playing=true; mus.step=0; mus.next=AC.currentTime+.08;
  mus.timer=setInterval(musicTick,45);
}
function musicStop(){
  mus.playing=false;
  if(mus.timer){ clearInterval(mus.timer); mus.timer=null; }
  if(mus.gain&&AC) mus.gain.gain.setTargetAtTime(0,AC.currentTime,.25);
  if(mus.droneGain&&AC) mus.droneGain.gain.setTargetAtTime(0,AC.currentTime,.3);
}
function musicSet(dt,want){
  if(!on||!AC) return;
  musicTick();                       // the frame loop is the reliable clock here
  mus.level+=(want-mus.level)*Math.min(1,dt*1.6);
  if(mus.level>.06){
    musicStart(); musicInit();
    mus.gain.gain.setTargetAtTime(Math.min(.92,mus.level*.92),AC.currentTime,.18);
    // the drone is loudest while you are merely being stalked, and pulls back a
    // little once the beat takes over — dread and panic should not fight
    const dr = mus.level<.4 ? .38 : .38 - (mus.level-.4)*.10;
    mus.droneGain.gain.setTargetAtTime(Math.max(.10,dr),AC.currentTime,.5);
    mus.droneFilt.Q.value = 6 + mus.level*5;
    mus.droneB.detune.setTargetAtTime(10 + mus.level*26, AC.currentTime, .8);
  } else if(mus.playing) musicStop();
}
const sndBtn=document.getElementById('sndBtn');
sndBtn.setAttribute('aria-pressed','true');

function armAudio(){
  if(armed) return;
  armed=true;
  audio();
  // iOS keeps the context locked until something actually plays inside the
  // gesture, so push one silent sample through first
  try{
    const b=AC.createBuffer(1,1,AC.sampleRate);
    const s=AC.createBufferSource(); s.buffer=b;
    s.connect(AC.destination); s.start(0);
  }catch(e){}
  const go=()=>{
    if(!on) return;
    if(seaGain) seaGain.gain.setTargetAtTime(.055,AC.currentTime,.5);
    // the score starts the moment sound is allowed. waiting for the first level
    // to tick meant the title, the mission card and the notebook were silent —
    // which is indistinguishable, from the player's chair, from broken music
    musicStart(); musicSet(1,.55);
  };

  const p=AC.resume();
  if(p&&p.then) p.then(go,go); else go();
}
// whatever they touch first — the skip button, the start button, a key — starts it
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>
  addEventListener(ev,armAudio,{passive:true}));
// a phone that suspends the context on return must be woken again
addEventListener('visibilitychange',()=>{
  if(!document.hidden && on && AC && AC.state!=='running'){ try{ AC.resume(); }catch(e){} }
});
['pointerdown','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>{
  if(on&&AC&&AC.state!=='running'){ try{ AC.resume(); }catch(e){} }
},{passive:true}));
// last resort: something suspended it while nobody was touching anything
setInterval(()=>{
  if(on&&AC&&AC.state!=='running'&&!document.hidden){ try{ AC.resume(); }catch(e){} }
},1500);

// a way to see, from the console or a phone, whether sound is actually leaving
// the mixer — "is the music broken" is otherwise unanswerable on someone's device
window.__gfx=function(){
  return {lens: !!post, lensOn: !!(post&&post.on),
          frameMs:+frameAvg.toFixed(1), pixelRatio:renderer?+renderer.getPixelRatio().toFixed(2):null,
          environment: !!(scene&&scene.environment), normalMaps:nrmCache.size};
};
window.__audioProbe=function(ms){
  const r={ctx:AC?AC.state:'none',on,armed,playing:!!mus.playing,
           level:+(mus.level||0).toFixed(3),
           musicGain:mus.gain?+mus.gain.gain.value.toFixed(3):null,
           master:master?+master.gain.value.toFixed(3):null};
  if(!AC||!master) return Promise.resolve(r);
  const an=AC.createAnalyser(); an.fftSize=2048;
  master.connect(an);
  const buf=new Float32Array(an.fftSize);
  let peak=0, t0=performance.now();
  return new Promise(res=>{
    const step=()=>{
      an.getFloatTimeDomainData(buf);
      for(let i=0;i<buf.length;i++){ const v=Math.abs(buf[i]); if(v>peak) peak=v; }
      if(performance.now()-t0 < (ms||900)) requestAnimationFrame(step);
      else { try{ master.disconnect(an); }catch(e){} r.peak=+peak.toFixed(4);
             r.audible=peak>0.003; res(r); }
    };
    step();
  });
};

sndBtn.addEventListener('click',e=>{
  on=!on;
  e.currentTarget.setAttribute('aria-pressed',String(on));
  if(on){ armAudio(); if(AC){ AC.resume(); seaGain.gain.setTargetAtTime(.055,AC.currentTime,.5); } }
  else { if(seaGain) seaGain.gain.setTargetAtTime(0,AC.currentTime,.2); musicStop(); }
});

    let cls='',st='—';
    if(rescue.saved.includes(c.name)){ cls='out'; st='في القارب'; }
    else if(rescue.lost.includes(c.name)){ cls='gone'; st='فُقد'; }
    else if(live&&live.state==='follow'){ cls='with'; st='معك'; }
    else if(live){ st='قريب'; }
    return `<div class="crewline ${cls}"><span class="n">${c.name} · ${c.role}</span><span class="s">${st}</span></div>`;
  }).join('');
  return `<hr><div class="said">Crew</div>${rows}`;
}
function jumpBlock(){
  const n=G?G.screen:1;
  return `<div class="jump">`+[1,2,3].map(i=>`<button data-jump="${i}" aria-current="${i===n}">0${i}</button>`).join('')+`</div>`;
}
function bookHTML(kind,s){
  const log=LOGS[G&&G.screen?G.screen:1];
  const plate = s ? `<hr><div class="said">Adaptive Strain</div>
      <div class="plate"><div class="cap">${s.said}</div>
      <p style="margin:0"><strong>${s.name}</strong></p>
      <p style="margin:5px 0 0">${s.note}</p></div>
      <span class="scrawl">ما نجح البارحة هو بالضبط ما سيقتلني الليلة.</span>` : '';
  return `<div class="said">${log.cap}</div><h2>${log.title}</h2>${log.body}${plate}${crewBlock()}
          <hr><div class="said">Jump to screen</div>${jumpBlock()}`;
}
let bookState={kind:'log',s:null};
function openBookFor(kind,s){ bookState={kind,s}; bookBody.innerHTML=bookHTML(kind,s); openBook(); }
function refreshBook(){ bookBody.innerHTML=bookHTML(bookState.kind,bookState.s); }
function openBook(){ book.classList.add('open'); bookBtn.setAttribute('aria-pressed','true'); }
function closeBook(){ book.classList.remove('open'); bookBtn.setAttribute('aria-pressed','false'); }
bookBtn.addEventListener('click',()=>{
  if(book.classList.contains('open')) return closeBook();
  openBookFor('log',strain?STRAINS[strain]:null);
});
document.getElementById('bookClose').addEventListener('click',()=>{ closeBook(); stage.focus({preventScroll:true}); });
bookBody.addEventListener('click',e=>{
  const b=e.target.closest('[data-jump]'); if(!b) return;
  if(intro) endIntro();
  if(outro) endOutro(false);
  const n=+b.dataset.jump;
  if(n===3&&!strain) strain=leader();
  if(n===1) strain=null;
  closeBook(); go(n);
});

/* ---------------- pause ---------------- */
const pauseBtn=document.getElementById('pauseBtn');
const pausedPanel=document.getElementById('pausedPanel');
let paused=false;
function setPause(p){
  if(p===paused) return;
  if(p && !running) return;                     // nothing to pause during a cutscene
  paused=p;
  pausedPanel.hidden=!p;
  pauseBtn.textContent = p ? '▶' : '❚❚';
  if(p){
    running=false;
    if(on&&AC){ musicStop(); if(seaGain) seaGain.gain.setTargetAtTime(0,AC.currentTime,.15); }
    voStop();
  } else {
    running=true; last=performance.now();
    if(on&&AC&&seaGain) seaGain.gain.setTargetAtTime(.055,AC.currentTime,.4);
    if('speechSynthesis' in window){ try{ speechSynthesis.resume(); }catch(e){} }
    stage.focus({preventScroll:true});
  }
}
document.querySelectorAll('.inv [data-use]').forEach(b=>{
  b.addEventListener('click',e=>{ e.preventDefault(); useItem(b.dataset.use); stage.focus({preventScroll:true}); });
});
addEventListener('keydown',e=>{ if(e.key==='1') useItem('medkit'); if(e.key==='2') useItem('energy'); });
pauseBtn.addEventListener('click',()=>setPause(!paused));
document.getElementById('resumeBtn').addEventListener('click',()=>setPause(false));
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='p'){ setPause(!paused); }
  else if(k==='escape' && !book.classList.contains('open') && running!==undefined){ setPause(!paused); }
});
// a phone that loses focus should not keep playing in the dark
addEventListener('visibilitychange',()=>{ if(document.hidden) setPause(true); });
// pinch and double-tap zoom have no place in a fixed play frame
['gesturestart','gesturechange','gestureend'].forEach(ev=>
  addEventListener(ev,e=>e.preventDefault(),{passive:false}));
let lastTap=0;
addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTap<320) e.preventDefault();
  lastTap=now;
},{passive:false});

// the pause panel mirrors the controls that the fullscreen layout hides
document.getElementById('sndBtn2').addEventListener('click',()=>{ sndBtn.click(); });
document.getElementById('bookBtn2').addEventListener('click',()=>{ bookBtn.click(); setPause(false); });
document.getElementById('redoBtn2').addEventListener('click',()=>{ setPause(false); restartAll(); });

/* a landscape phone gets the real thing, if the browser allows it */
function goFullscreen(){
  if(!matchMedia('(pointer:coarse)').matches) return;
  const el=document.documentElement;
  const fn=el.requestFullscreen||el.webkitRequestFullscreen;
  if(fn && !document.fullscreenElement){ try{ fn.call(el,{navigationUI:'hide'}); }catch(e){} }
}

function restartAll(){
  if(outro) endOutro(false);
  counters={engage:0,stealth:0,flee:0}; strain=null; rescue={saved:[],lost:[]};
  carried={weapon:'none',medkit:0,energy:0};
  closeBook(); startIntro();
}
document.getElementById('redoBtn').addEventListener('click',restartAll);

/* ---------------- opening ---------------- */
const introEl=document.getElementById('intro');
const lidTop=document.getElementById('lidTop'), lidBot=document.getElementById('lidBot');
const lineEl=document.getElementById('introLine'), introWrap=document.getElementById('introWrap'), titleEl=document.getElementById('titleCard');
let intro=null;
const BEATS=[
  {at:0.4, hold:3.0,text:'ليلة أمس · على بعد ميلين من ساحل ثُوَل'},
  {at:3.8, hold:3.2,text:'انكسرت السفينة على الشعاب قبل أن يصل نداء الاستغاثة'},
  {at:7.4, hold:3.0,text:'ثمانية ركبوا معك. أنت الوحيد الذي وصل واقفاً'},
  {at:10.8,hold:3.0,text:'والباقون ما زالوا على هذا الساحل'}
];
function startIntro(){
  intro={start:performance.now(),t:0,beat:-1,done:false,blink:0,nextBlink:1.2};
  introEl.hidden=false; veil.hidden=true;
  titleEl.classList.remove('show'); introWrap.classList.remove('show'); lineEl.textContent='';
  G=fresh(1); safeBuild(G); running=false;
  if(!raf) raf=requestAnimationFrame(loop);
}
function updateIntro(dt){
  const I=intro,P=G.P;
  I.t=(performance.now()-I.start)/1000;
  for(let i=0;i<BEATS.length;i++){
    const b=BEATS[i];
    if(I.t>=b.at&&I.beat<i){
      I.beat=i; lineEl.textContent=b.text; introWrap.classList.add('show');
      if(i===1) hullGroan(); else if(i===3){ zGrowl(300,.5); hush(.02,1.2); }
    }
    if(I.beat===i&&I.t>=b.at+b.hold) introWrap.classList.remove('show');
  }
  const rise=Math.max(0,Math.min(1,(I.t-11.8)/3.8));
  const e=rise<.5?2*rise*rise:1-Math.pow(-2*rise+2,2)/2;
  G.camH=0.22+e*(EYE-0.22);
  G.roll=(1-e)*0.30;
  P.a=-0.55+e*0.55;
  P.breath+=dt*(2.6-e*1.0);
  let open;
  if(I.t<11.5) open=0;
  else if(I.t<12.7) open=(I.t-11.5)/1.2*0.55;
  else open=Math.min(1,0.55+(I.t-12.7)/1.9*0.45);
  I.blink-=dt;
  if(I.blink<=0&&I.t>11.7&&I.t<16.0){ I.blink=I.nextBlink; I.nextBlink=1.0+Math.random()*1.6; }
  const blinkK=(I.blink>0&&I.blink<0.16)?(1-Math.abs(I.blink-0.08)/0.08):0;
  const shut=Math.max(0,Math.min(1,1-open+blinkK*0.85));
  lidTop.style.transform=`translateY(${-(1-shut)*100}%)`;
  lidBot.style.transform=`translateY(${(1-shut)*100}%)`;
  if(on&&I.t>10.0) breathing(dt,.25,Math.max(0,1.1-(I.t-10.0)*.22),1);
  if(on&&I.t>=12.1&&!I.coughed){ I.coughed=true; cough(); }
  if(I.t>=15.6&&!I.titled){ I.titled=true; titleEl.classList.add('show'); }
  if(I.t>=18.4&&!I.done){ I.done=true; endIntro(); }
}
function endIntro(){
  intro=null; introEl.hidden=true;
  G.camH=EYE; G.roll=0;
  const s=SCREEN_TEXT[1];
  showVeil(s.eyebrow,s.title,s.body,'ابدأ',start);
}
document.getElementById('skipBtn').addEventListener('click',()=>{ if(intro) endIntro(); });
function hullGroan(){
  if(!on||!AC) return;
  vtone({type:'sawtooth',f0:58,f1:31,dur:2.6,vol:.13,cut:280,q:1.4,wobble:4,wobRate:2.2});
  nburst({dur:2.4,type:'bandpass',f0:220,f1:70,q:1.8,vol:.07,atk:.9});
}
function cough(){
  const b=d=>setTimeout(()=>{
    vtone({type:'sawtooth',f0:190,f1:96,dur:.20,vol:.10,cut:900,q:1.3,wobble:12});
    nburst({dur:.22,type:'bandpass',f0:1700,f1:420,q:.8,vol:.085,atk:.006});
  },d);
  b(0); b(260); b(560);
}

/* ---------------- closing ---------------- */
const outroEl=document.getElementById('outro'), outroLine=document.getElementById('outroLine'), outroWrap=document.getElementById('outroWrap');
const strobeEl=document.getElementById('strobe'), whatsNextEl=document.getElementById('whatsNext');
let outro=null;
function outroBeats(){
  const n=rescue.saved.length, names=rescue.saved.slice();
  const who=n===0?'لا أحد':n===1?names[0]:names.slice(0,-1).join(' و')+' و'+names[names.length-1];
  // the first symptom is that nothing is wrong: no shivering, no blinking
  const sick = n===0 ? 'ولا أحد معك لتراقبه.'
             : n===1 ? `وعينا ${names[0]} لم ترمشا منذ أن ركبنا.`
                     : 'ولا أحد منهم يرتجف من البرد. ولا واحد.';
  // and then it is not subtle any more. this is the line the whole game was for
  const turn = n===0 ? 'وأتجنّب النظر إلى انعكاسي في الماء.'
             : n===1 ? `أرى تغيّراً يحدث في عينَي ${names[0]}، وجوعاً يشبه الذي في أعين الوحوش.`
                     : 'أرى تغيّراً يحدث في أعينهم، وجوعاً يشبه الذي في أعين الوحوش.';
  return [
    {at:0.5, hold:3.0,text:`دفعتَ القارب · نجا ${n} من أربعة`},
    {at:3.9, hold:3.2,text:n?`${who} معك على الماء`:'وحدك على الماء'},
    {at:7.4, hold:3.4,text:sick},
    {at:11.0,hold:4.0,text:turn},
    {at:15.2,hold:2.6,text:'الطفيلي مصدره الماء — ونحن أتينا من الماء'},
    {at:18.0,hold:2.4,text:n?'لم أُنقذهم من الشاطئ. أخرجتُهم معي إلى الماء.':'كان القارب هو المكان الآمن'}
  ];
}
function startOutro(){
  outro={start:performance.now(),t:0,beat:-1,beats:outroBeats(),done:false,hit:0};
  outroEl.hidden=false; veil.hidden=true;
  whatsNextEl.classList.remove('show'); outroWrap.classList.remove('show'); outroLine.textContent='';
  running=false;
  if(on){ musicStart(); musicSet(1,.35); }
  if(!raf) raf=requestAnimationFrame(loop);
}
function updateOutro(dt){
  const O=outro;
  O.t=(performance.now()-O.start)/1000;
  for(let i=0;i<O.beats.length;i++){
    const b=O.beats[i];
    if(O.t>=b.at&&O.beat<i){
      O.beat=i; outroLine.textContent=b.text; outroWrap.classList.add('show');
      if(i===2&&on) zGrowl(120,-.4);
      if(i===4&&on) hush(.004,1.4);
    }
    if(O.beat===i&&O.t>=b.at+b.hold) outroWrap.classList.remove('show');
  }
  if(O.t>=19.4){
    const k=Math.min(1,(O.t-19.4)/3.2);
    if(on) musicSet(dt,1);
    const flash=Math.random()<dt*(6+k*16)?.30+Math.random()*.42:0;
    strobeEl.style.opacity = flash ? flash.toFixed(2) : (parseFloat(strobeEl.style.opacity||0)*.72).toFixed(3);
    G.shake=.08+k*.10;
    if(on&&O.t-O.hit>0.34+Math.random()*.5){
      O.hit=O.t;
      Math.random()<.45?scream((Math.random()-.5)*1.6):zShriek(60,(Math.random()-.5)*1.6);
    }
  }
  if(O.t>=23.4&&!O.shown){
    O.shown=true;
    outroWrap.classList.remove('show');
    whatsNextEl.classList.add('show');
    strobeEl.style.opacity=0; G.shake=0;
    if(on) musicSet(1,.55);
  }
}
function endOutro(restart){
  outro=null; outroEl.hidden=true; strobeEl.style.opacity=0;
  if(G) G.shake=0;
  if(restart) restartAll();
}
document.getElementById('outroRedo').addEventListener('click',()=>endOutro(true));

/* ---------------- boot ---------------- */
function boot(saved){
  initGL();
  bindPad();
  bindStick();
  if(saved&&saved.counters) counters=saved.counters;
  if(saved&&saved.strain) strain=saved.strain;
  if(saved&&saved.rescue) rescue=saved.rescue;
  const resuming=saved&&saved.screen&&saved.screen>1;
  if(!resuming&&!(saved&&saved.seenIntro)){ startIntro(); return; }
  G=fresh(saved&&saved.screen?saved.screen:1);
  safeBuild(G);
  const s=SCREEN_TEXT[G.screen];
  showVeil(s.eyebrow,s.title,s.body,G.screen===1?'ابدأ':'ادخل',start);
  raf=requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({screen:G?G.screen:1,counters,strain,rescue,seenIntro:!intro}));
if(window.claude?.hot?.ready) window.claude.hot.ready(boot);
else boot(window.claude?.hot?.data??{});

})();
</script>
