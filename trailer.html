<meta charset="utf-8">
<title>Surviving Thuwaliidae</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Noto+Kufi+Arabic:wght@400;700;900&display=swap">
<style>
:root{
  --ink:#0b0c0e; --line:#2a2e33;
  --news:#e8e2d4; --news-dim:#b6b0a2;
  --red:#c8202a; --red-hi:#e8402c;
  --toxic:#a8e04a; --map:#6dc6a4;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ink); color:var(--news);
  font-family:'Special Elite','Courier New',monospace;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding-block:28px 56px; padding-left:16px; padding-right:16px;}

header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px}
.slate{display:flex; flex-direction:column; gap:4px}
.slate .k{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--news-dim)}
.slate h1{
  font-family:'Anton',Impact,sans-serif; font-weight:400; margin:0;
  font-size:clamp(34px,7vw,64px); letter-spacing:.02em; line-height:.92;
  color:var(--news); text-wrap:balance;
}
.slate h1 em{font-style:normal; color:var(--red-hi)}
.ar{font-family:'Noto Kufi Arabic',sans-serif; direction:rtl}
.slate .sub{font-size:13px; color:var(--news-dim); letter-spacing:.06em}

.hazard{height:9px; margin:16px 0 14px;
  background:repeating-linear-gradient(135deg,var(--red) 0 14px,#0b0c0e 14px 28px);
  opacity:.85}

.stage{position:relative; border:1px solid var(--line); background:#000;
  box-shadow:0 0 0 1px #000, 0 26px 60px -30px #000;}
.stage::after{content:''; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 0 90px rgba(0,0,0,.7)}
canvas{display:block; width:100%; height:auto; aspect-ratio:16/9; max-width:100%; background:#000}

.poster{position:absolute; inset:0; display:grid; place-items:center;
  background:radial-gradient(circle at 50% 45%, rgba(200,32,42,.22), rgba(0,0,0,.86) 70%); cursor:pointer; z-index:2}
.poster button{
  font-family:'Anton',Impact,sans-serif; font-size:clamp(18px,3.4vw,30px); letter-spacing:.06em;
  color:#fff; background:var(--red); border:3px solid #000; padding:14px 34px 12px;
  cursor:pointer; box-shadow:7px 7px 0 #000; transform:rotate(-1.6deg);
  transition:transform .12s ease, box-shadow .12s ease}
.poster button:hover{transform:rotate(-1.6deg) translate(-2px,-2px); box-shadow:10px 10px 0 #000}
.poster button:focus-visible{outline:3px solid var(--toxic); outline-offset:4px}
.poster .note{position:absolute; bottom:16px; font-size:11px; letter-spacing:.18em; color:#cfc7b6; text-transform:uppercase}

.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px}
.bar button{
  font-family:'Special Elite',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--news); background:transparent; border:1px solid var(--line); padding:9px 14px; cursor:pointer}
.bar button:hover{border-color:var(--red); color:#fff}
.bar button:focus-visible{outline:2px solid var(--toxic); outline-offset:2px}
.bar button[aria-pressed="true"]{background:var(--red); border-color:var(--red); color:#fff}
.tc{margin-left:auto; font-size:12px; color:var(--news-dim); font-variant-numeric:tabular-nums; letter-spacing:.1em}
.bar button.primary{background:var(--red); border-color:var(--red); color:#fff}
.bar button.primary:hover{background:var(--red-hi); border-color:var(--red-hi); color:#fff}
.bar button.primary:disabled{background:#3a1416; border-color:#3a1416; color:var(--news-dim); cursor:default}
#recnote{flex-basis:100%; font-size:11px; color:var(--news-dim); letter-spacing:.06em; line-height:1.6}

.track{position:relative; height:4px; background:#1b1e22; margin-top:10px; overflow:hidden}
.track i{position:absolute; inset:0 auto 0 0; width:0; background:var(--red); display:block}

@media (prefers-reduced-motion:reduce){ .poster button{transition:none} }
</style>

<div class="wrap">
  <header>
    <div class="slate">
      <h1>SURVIVING THUWAL<em>II</em>DAE</h1>
      <div class="sub ar">تفشٍّ في ثول — ساحل البحر الأحمر</div>
    </div>
  </header>

  <div class="hazard"></div>

  <div class="stage">
    <canvas id="c" width="1600" height="900" aria-label="Surviving Thuwaliidae 20-second teaser trailer"></canvas>
    <div class="poster" id="poster">
      <button id="play" type="button">&#9654; PLAY TEASER</button>
      <div class="note">20 seconds &middot; sound on</div>
    </div>
  </div>

  <div class="bar">
    <button id="rec" type="button" class="primary">&#8681; Download video</button>
    <button id="replay" type="button">&#8634; Replay</button>
    <button id="mute" type="button" aria-pressed="false">Sound: on</button>
    <span class="tc" id="tc">00:00 / 00:20</span>
    <span id="recnote"></span>
  </div>
  <div class="track" id="track"><i id="fill"></i></div>
</div>

<script>
(function(){
'use strict';
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var W = 1600, H = 900, DUR = 20;

/* ---------- palette ---------- */
var INK='#101214', NEWS='#e9e3d5', NEWS2='#cfc7b4';
var RED='#c8202a', RED_HI='#e8402c', BLOOD='#8e1318';
var SEA='#3c6470', SEA_D='#16282f', SEA_L='#6f98a1', FOAM='#dfe6e4';
var TOX='#a8e04a', TOX_D='#5f8f24', MAP='#6dc6a4', SAND='#b8ae9b';
var BOAT='#a9d8e4', SODIUM='#f0a23c', BONE='#efe9da';

/* ---------- math ---------- */
function hash(n){ var s=Math.sin(n*127.1+31.72)*43758.5453; return s-Math.floor(s); }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function ease(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function outc(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); }
function seg(t,a,b){ return clamp((t-a)/(b-a),0,1); }
var TAU = Math.PI*2;

/* ---------- ink helpers ---------- */
function roughPath(pts, seed, amp){
  ctx.beginPath();
  for(var i=0;i<pts.length;i++){
    var x=pts[i][0]+(hash(seed+i*3.1)-0.5)*amp, y=pts[i][1]+(hash(seed+i*5.7+9)-0.5)*amp;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
}
function inkStroke(w,color){ ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=w; ctx.strokeStyle=color||INK; ctx.stroke(); }

/* Halftone is drawn as a cached repeating tile, not thousands of arcs per
   frame — the swarm and flash-cut beats were spending their whole budget
   on ctx.arc. One fillRect per field instead. */
var tileCache={}, tileKeys=[];
function dotTile(color,sp,r){
  var key=color+'|'+sp+'|'+r;
  var p=tileCache[key];
  if(p) return p;
  var cn=document.createElement('canvas');
  cn.width=sp; cn.height=sp*2;
  var g=cn.getContext('2d');
  g.fillStyle=color;
  function d(cx,cy){ g.beginPath(); g.arc(cx,cy,r,0,TAU); g.fill(); }
  d(sp*0.5,sp*0.5); d(sp*0.5,sp*2.5); d(sp*0.5,-sp*0.5);
  d(0,sp*1.5); d(sp,sp*1.5);
  p=ctx.createPattern(cn,'repeat');
  tileCache[key]=p; tileKeys.push(key);
  if(tileKeys.length>140){ delete tileCache[tileKeys.shift()]; }
  return p;
}
function dots(x,y,w,h,color,sp,r,alpha){
  if(r<=0.12||w<=0||h<=0) return;
  sp=Math.max(3,Math.round(sp));
  r=Math.round(Math.min(r,sp*0.46)*2)/2;
  if(r<=0.12) return;
  ctx.save();
  ctx.globalAlpha=(alpha===undefined?1:alpha);
  ctx.fillStyle=dotTile(color,sp,r);
  ctx.translate(x,y); ctx.fillRect(0,0,w,h);
  ctx.restore();
}
function dotsFade(x,y,w,h,color,sp,r0,r1,alpha){
  var N=9;
  for(var i=0;i<N;i++){
    var hh=h/N;
    dots(x, y+hh*i, w, hh+1, color, sp, lerp(r0,r1,(i+0.5)/N), alpha);
  }
}

function burstPath(cx,cy,r1,r2,n,seed,rot){
  ctx.beginPath();
  for(var i=0;i<n*2;i++){
    var a=(i/(n*2))*TAU+(rot||0);
    var r=(i%2? r1:r2)*(0.78+0.44*hash(seed+i));
    var x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function splatPath(cx,cy,r,seed,spikes){
  ctx.beginPath();
  var n=spikes||18;
  for(var i=0;i<n;i++){
    var a=(i/n)*TAU, k=hash(seed+i*2.3);
    var rr=r*(0.62+0.72*k*k);
    var x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr*0.86;
    if(i===0) ctx.moveTo(x,y);
    else{
      var pa=((i-0.5)/n)*TAU, pr=r*(0.42+0.3*hash(seed+i*7.1));
      ctx.quadraticCurveTo(cx+Math.cos(pa)*pr, cy+Math.sin(pa)*pr*0.86, x,y);
    }
  }
  ctx.closePath();
}
function speedLines(cx,cy,n,rIn,rOut,color,w,seed,alpha){
  ctx.save(); ctx.globalAlpha=(alpha===undefined?1:alpha); ctx.strokeStyle=color; ctx.lineCap='round';
  for(var i=0;i<n;i++){
    var a=(i/n)*TAU + hash(seed+i)*0.12;
    var i0=rIn*(0.7+0.7*hash(seed+i*3.3)), i1=rOut*(0.8+0.5*hash(seed+i*1.7));
    ctx.lineWidth=w*(0.35+1.2*hash(seed+i*9.1));
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*i0, cy+Math.sin(a)*i0);
    ctx.lineTo(cx+Math.cos(a)*i1, cy+Math.sin(a)*i1);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- lettering ---------- */
var FD="Anton, Impact, 'Arial Narrow', sans-serif";
var FT="'Special Elite', 'Courier New', monospace";
var FA="'Noto Kufi Arabic', 'Segoe UI', sans-serif";
function txt(s,x,y,size,o){
  o=o||{};
  ctx.save();
  ctx.translate(x,y);
  if(o.rot) ctx.rotate(o.rot);
  if(o.sx||o.sy) ctx.scale(o.sx||1,o.sy||1);
  if(o.alpha!==undefined) ctx.globalAlpha=o.alpha;
  ctx.font=(o.w?o.w+' ':'')+size+"px "+(o.f||FD);
  ctx.textAlign=o.align||'center'; ctx.textBaseline=o.base||'middle';
  ctx.direction = o.rtl? 'rtl':'ltr';
  ctx.lineJoin='round'; ctx.miterLimit=2;
  if(o.halo){ ctx.lineWidth=size*o.halo; ctx.strokeStyle=o.haloC||'#fff'; ctx.strokeText(s,0,0); }
  if(o.out!==0){ ctx.lineWidth=size*(o.out||0.16); ctx.strokeStyle=o.outC||INK; ctx.strokeText(s,0,0); }
  ctx.fillStyle=o.fill||NEWS; ctx.fillText(s,0,0);
  ctx.restore();
}
/* Centred display line built from coloured runs. Halo and outline are each
   drawn as a full pass across every run before any fill lands, so one run's
   outline never cuts into the letter beside it. */
function txtRuns(runs,x,y,size,o){
  o=o||{};
  ctx.save();
  ctx.translate(x,y);
  if(o.rot) ctx.rotate(o.rot);
  ctx.font=size+"px "+(o.f||FD);
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.direction='ltr';
  ctx.lineJoin='round'; ctx.miterLimit=2;
  var i,px,w=[],total=0;
  for(i=0;i<runs.length;i++){ w[i]=ctx.measureText(runs[i].t).width; total+=w[i]; }
  var x0=-total/2;
  if(o.halo){
    ctx.lineWidth=size*o.halo; ctx.strokeStyle=o.haloC||'#fff';
    px=x0; for(i=0;i<runs.length;i++){ ctx.strokeText(runs[i].t,px,0); px+=w[i]; }
  }
  if(o.out!==0){
    ctx.lineWidth=size*(o.out||0.16); ctx.strokeStyle=o.outC||INK;
    px=x0; for(i=0;i<runs.length;i++){ ctx.strokeText(runs[i].t,px,0); px+=w[i]; }
  }
  px=x0;
  for(i=0;i<runs.length;i++){ ctx.fillStyle=runs[i].c||o.fill||NEWS; ctx.fillText(runs[i].t,px,0); px+=w[i]; }
  ctx.restore();
}
function typeLine(s,x,y,size,color,align,alpha,rtl){
  ctx.save(); ctx.globalAlpha=(alpha===undefined?1:alpha);
  ctx.font=size+"px "+(rtl?FA:FT); ctx.textAlign=align||'left'; ctx.textBaseline='middle';
  ctx.direction=rtl?'rtl':'ltr';
  ctx.fillStyle=color||NEWS; ctx.fillText(s,x,y); ctx.restore();
}
/* Caption box. Pass o.right and x is the box's RIGHT edge — the reel reads
   right-to-left, so captions hang off the right of frame and the red tab
   sits on the right too. */
function caption(lines,x,y,o){
  o=o||{};
  var pad=o.pad||16, size=o.size||22, lh=size*1.5;
  var w=0,i,L,s;
  ctx.save();
  for(i=0;i<lines.length;i++){
    L=lines[i]; s=(L.t!==undefined?L.t:L);
    ctx.font=size+"px "+(L.rtl?FA:FT);
    w=Math.max(w, ctx.measureText(s).width);
  }
  ctx.restore();
  w+=pad*2; var h=lines.length*lh+pad*1.3;
  ctx.save();
  ctx.translate(o.right? x-w : x, y); if(o.rot) ctx.rotate(o.rot);
  ctx.globalAlpha=o.alpha===undefined?1:o.alpha;
  ctx.fillStyle=o.bg||NEWS; ctx.fillRect(0,0,w,h);
  ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.strokeRect(0,0,w,h);
  ctx.fillStyle=RED; ctx.fillRect(o.right? w-7 : 0, 0, 7, h);
  for(var j=0;j<lines.length;j++){
    L=lines[j]; s=(L.t!==undefined?L.t:L);
    var c=(L.c||INK), rtl=!!L.rtl;
    ctx.font=size+"px "+(rtl?FA:FT);
    ctx.textAlign=rtl?'right':'left'; ctx.textBaseline='middle'; ctx.direction=rtl?'rtl':'ltr';
    ctx.fillStyle=c;
    ctx.fillText(s, rtl? w-pad-8 : pad+6, pad*0.65+lh*(j+0.5));
  }
  ctx.restore();
  return {w:w,h:h};
}
function stamp(s,x,y,size,rot,color,alpha,rtl){
  ctx.save(); ctx.globalAlpha=alpha===undefined?0.9:alpha;
  ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.font=size+"px "+(rtl?FA:FD); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.direction=rtl?'rtl':'ltr';
  var w=ctx.measureText(s).width;
  ctx.lineWidth=4; ctx.strokeStyle=color;
  ctx.strokeRect(-w/2-16,-size*0.7,w+32,size*1.4);
  ctx.fillStyle=color; ctx.fillText(s,0,0);
  ctx.restore();
}
function hazardBar(x,y,w,h,phase,alpha){
  ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.fillStyle=NEWS; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=RED;
  var s=h*1.4, off=((phase||0)%(s*2));
  for(var xx=x-s*3+off; xx<x+w+s*3; xx+=s*2){
    ctx.beginPath(); ctx.moveTo(xx,y+h); ctx.lineTo(xx+s,y+h); ctx.lineTo(xx+s+h,y); ctx.lineTo(xx+h,y); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function panel(x,y,w,h,rot,fn,bw){
  ctx.save();
  ctx.translate(x+w/2,y+h/2); ctx.rotate(rot||0); ctx.translate(-w/2,-h/2);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,w,h); ctx.clip();
  fn(w,h);
  ctx.restore();
  ctx.lineWidth=bw||10; ctx.strokeStyle=INK; ctx.lineJoin='miter';
  ctx.strokeRect(0,0,w,h);
  ctx.restore();
}
/* ---------- color mixing ---------- */
function hx(c){ return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)]; }
function mix(a,b,t){ var A=hx(a),B=hx(b);
  return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')'; }
function rgba(c,a){ var A=hx(c); return 'rgba('+A[0]+','+A[1]+','+A[2]+','+a+')'; }

/* ---------- world assets ---------- */
function nightSky(y0,y1,glowX,glowK){
  var g=ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'#070d11'); g.addColorStop(0.55,'#12242c'); g.addColorStop(1,'#26454c');
  ctx.fillStyle=g; ctx.fillRect(0,y0,W,y1-y0);
  for(var i=0;i<70;i++){
    var x=hash(i*1.7)*W, y=y0+hash(i*3.1)*(y1-y0)*0.7, r=0.8+hash(i*5.5)*1.5;
    ctx.globalAlpha=0.25+hash(i*7.7)*0.5; ctx.fillStyle=NEWS;
    ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  if(glowK>0){
    var rg=ctx.createRadialGradient(glowX,y1,10,glowX,y1,460);
    rg.addColorStop(0,rgba(SODIUM,0.55*glowK)); rg.addColorStop(1,rgba(SODIUM,0));
    ctx.fillStyle=rg; ctx.fillRect(0,y0,W,y1-y0);
  }
  dotsFade(0,y0,W,(y1-y0),'#0a1418',13,2.6,0.2,0.5);
}
function waveLine(y,amp,freq,phase,color,lw,alpha){
  ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.beginPath();
  for(var x=-20;x<=W+20;x+=14){
    var yy=y+Math.sin(x*freq+phase)*amp+Math.sin(x*freq*2.7+phase*1.6)*amp*0.35;
    if(x<0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
  }
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();
  ctx.restore();
}
function seaBody(y0,h,t,tint){
  var g=ctx.createLinearGradient(0,y0,0,y0+h);
  g.addColorStop(0,mix(SEA,tint||SEA,0.25)); g.addColorStop(1,SEA_D);
  ctx.fillStyle=g; ctx.fillRect(0,y0,W,h);
  for(var i=0;i<9;i++){
    var k=i/9, y=y0+h*k*k*1.0+6;
    waveLine(y, 3+k*9, 0.011+k*0.004, t*(0.7+k*1.4)+i, rgba(FOAM,0.5), 1.6+k*2.6, 0.30+k*0.32);
  }
  dotsFade(0,y0,W,h,'#08161b',15,0.5,3.4,0.55);
}
function surfCrash(x,y,s,k,seed){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle=FOAM;
  for(var i=0;i<26;i++){
    var a=-Math.PI*0.9+hash(seed+i)*Math.PI*0.8;
    var d=(30+hash(seed+i*3)*150)*k;
    var bx=Math.cos(a)*d, by=Math.sin(a)*d*0.75;
    ctx.globalAlpha=0.5+0.45*hash(seed+i*7);
    ctx.beginPath(); ctx.arc(bx,by,(9+hash(seed+i*5)*26)*(0.5+k*0.7),0,TAU); ctx.fill();
  }
  ctx.globalAlpha=0.85;
  for(var j=0;j<40;j++){
    var aa=-Math.PI*0.95+hash(seed+j*2.3)*Math.PI*0.9, dd=(60+hash(seed+j*4.1)*220)*k;
    ctx.fillRect(Math.cos(aa)*dd, Math.sin(aa)*dd*0.8, 3, 3);
  }
  ctx.restore();
}
function warningSign(x,y,s,rot,alpha){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.scale(s,s);
  ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.fillStyle='#8c8f8f'; ctx.fillRect(-46,0,11,150); ctx.fillRect(35,0,11,150);
  ctx.fillStyle=NEWS; ctx.fillRect(-92,-118,184,120);
  ctx.lineWidth=7; ctx.strokeStyle=RED; ctx.strokeRect(-92,-118,184,120);
  ctx.fillStyle=RED; ctx.fillRect(-85,-111,170,4);
  ctx.font='27px '+FA; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.direction='rtl';
  ctx.fillStyle=RED; ctx.fillText('منطقة خطرة',0,-84);
  ctx.font='15px '+FA; ctx.fillStyle=INK; ctx.fillText('ممنوع السباحة',0,-58);
  ctx.direction='ltr'; ctx.font='14px '+FT; ctx.fillStyle=RED;
  ctx.fillText('DANGEROUS AREA',0,-36);
  ctx.fillStyle=INK; ctx.font='12px '+FT; ctx.fillText('NO SWIMMING',0,-19);
  ctx.beginPath(); ctx.arc(-66,-30,17,0,TAU); ctx.lineWidth=5; ctx.strokeStyle=RED; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-78,-42); ctx.lineTo(-54,-18); ctx.stroke();
  ctx.restore();
}
function plant(cx,baseY,s,dmg,t,seed){
  ctx.save(); ctx.translate(cx,baseY); ctx.scale(s,s);
  var lit=1-dmg;
  function box(x,y,w,h,c){ ctx.fillStyle=c||INK; ctx.fillRect(x,y,w,h); }
  /* pier */
  box(-420,0,840,26,'#0d1416');
  for(var p=-400;p<410;p+=62){ box(p,26,13,60,'#0d1416'); }
  /* tanks */
  for(var i=0;i<3;i++){
    var tx=-330+i*128, tr=52-i*4;
    ctx.fillStyle='#131b1e';
    ctx.beginPath(); ctx.moveTo(tx-tr,0); ctx.lineTo(tx-tr,-96); ctx.lineTo(tx+tr,-96); ctx.lineTo(tx+tr,0); ctx.closePath(); ctx.fill();

/* ---------- the fish ---------- */
function goby(x,y,s,rot,z,ph,seed,opt){
  opt=opt||{};
  z=clamp(z,0,1);
  var open=opt.open===undefined?0:clamp(opt.open,0,1);
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot||0); ctx.scale(s*(opt.flip?-1:1),s);

  var wag=Math.sin(ph)*0.30;
  var bodyTop = mix('#e8672e','#8ba364',z), bodyBot = mix('#c2291b','#3f5a33',z);
  var belly  = mix('#f2cfa6','#c9cf9e',z);
  var finC   = mix('#d8452a','#6f8a4a',z);

  /* --- tail --- */
  ctx.save(); ctx.translate(40,0); ctx.rotate(wag);
  ctx.beginPath(); ctx.moveTo(0,-9);
  ctx.quadraticCurveTo(20,-30,30,-27); ctx.quadraticCurveTo(22,0,30,27);
  ctx.quadraticCurveTo(20,30,0,9); ctx.closePath();
  ctx.fillStyle=finC; ctx.globalAlpha=0.94; ctx.fill(); ctx.globalAlpha=1; inkStroke(4);
  ctx.strokeStyle=INK; ctx.lineWidth=2;
  for(var tf=-3;tf<=3;tf++){ ctx.beginPath(); ctx.moveTo(2,tf*2.6); ctx.lineTo(27,tf*8.4); ctx.stroke(); }
  ctx.restore();

  /* --- fins --- */
  function spikeFin(x0,y0,x1,y1,hgt,n,tear){
    ctx.beginPath(); ctx.moveTo(x0,y0);
    for(var i=0;i<=n;i++){
      var k=i/n, bx=lerp(x0,x1,k), by=lerp(y0,y1,k);
      var hh=hgt*(0.55+0.45*Math.sin(k*Math.PI))*(tear&&hash(seed+i*13)<0.35?0.35:1);
      ctx.lineTo(bx-3,by+hh); ctx.lineTo(bx+4,by);
    }
    ctx.lineTo(x1,y1); ctx.closePath();
    ctx.fillStyle=finC; ctx.fill(); inkStroke(3.5);
  }
  spikeFin(-16,-22,6,-19,-22,5,z>0.4);
  spikeFin(12,-18,38,-10,-16,5,z>0.4);
  spikeFin(12,18,38,10,15,4,z>0.4);

  /* --- body --- */
  ctx.beginPath();
  ctx.moveTo(-58,-2);
  ctx.bezierCurveTo(-54,-22,-34,-28,-8,-23);
  ctx.bezierCurveTo(14,-20,32,-15,41,-9);
  ctx.lineTo(41,9);
  ctx.bezierCurveTo(32,15,14,21,-8,23);
  ctx.bezierCurveTo(-36,26,-54,18,-59,9);
  ctx.closePath();
  var bg=ctx.createLinearGradient(0,-26,0,26);
  bg.addColorStop(0,bodyTop); bg.addColorStop(0.62,bodyBot); bg.addColorStop(1,belly);
  ctx.fillStyle=bg; ctx.fill();
  /* interior detail only when the fish is big enough on screen to read it */
  if(s>0.7){
    ctx.save(); ctx.clip();
    dots(-62,-28,110,58, z>0.4? 'rgba(20,40,14,0.5)':'rgba(120,20,10,0.42)', 7, 1.7, 1);
    if(z>0.35){
      ctx.strokeStyle='rgba(28,52,20,0.8)'; ctx.lineWidth=2.4;
      for(var v=0;v<5;v++){
        var vy=-16+v*9;
        ctx.beginPath(); ctx.moveTo(-30,vy);
        ctx.bezierCurveTo(-8,vy-7,12,vy+8,38,vy-3); ctx.stroke();
      }
      ctx.strokeStyle=rgba(BONE,0.85); ctx.lineWidth=3.4;
      for(var rb=0;rb<3;rb++){ ctx.beginPath(); ctx.arc(-4+rb*13,20,12,Math.PI*1.12,Math.PI*1.88); ctx.stroke(); }
    }
    ctx.restore();
  }
  inkStroke(5);

  /* pectoral fan */
  ctx.save(); ctx.translate(-26,7); ctx.rotate(Math.sin(ph*1.7)*0.18);
  ctx.strokeStyle=INK; ctx.lineWidth=2.6;
  for(var f=0;f<6;f++){ var fa=0.25+f*0.22; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(fa)*22,Math.sin(fa)*22); ctx.stroke(); }
  ctx.restore();

  /* --- jaw --- */
  var ja=open*0.62;
  function jp(px,py){ var c=Math.cos(ja),si=Math.sin(ja); var dx=px+30, dy=py-8;
    return [ -30+dx*c-dy*si, 8+dx*si+dy*c ]; }
  var j1=jp(-30,8), j2=jp(-64,11), j3=jp(-62,21), j4=jp(-28,18);
  if(open>0.02){
    ctx.beginPath(); ctx.moveTo(-58,1); ctx.lineTo(-30,7); ctx.lineTo(j4[0],j4[1]); ctx.lineTo(j2[0],j2[1]); ctx.closePath();
    ctx.fillStyle=mix('#5a1016','#2c1a10',z); ctx.fill();
  }
  ctx.beginPath(); ctx.moveTo(j1[0],j1[1]); ctx.lineTo(j2[0],j2[1]); ctx.lineTo(j3[0],j3[1]); ctx.lineTo(j4[0],j4[1]); ctx.closePath();
  ctx.fillStyle=belly; ctx.fill(); inkStroke(4);
  /* teeth */
  if(z>0.25||open>0.02){
    ctx.fillStyle=BONE;
    var nt=z>0.4?6:4;
    for(var i2=0;i2<nt;i2++){
      var k2=i2/(nt-1);
      var ux=lerp(-56,-33,k2), uy=lerp(2,7,k2), th=(3+z*7)*(0.6+0.7*hash(seed+i2));
      ctx.beginPath(); ctx.moveTo(ux-3.2,uy); ctx.lineTo(ux+3.2,uy); ctx.lineTo(ux,uy+th); ctx.closePath(); ctx.fill(); inkStroke(1.6);
      var lp=jp(lerp(-60,-33,k2), 11);
      ctx.beginPath(); ctx.moveTo(lp[0]-3.2,lp[1]); ctx.lineTo(lp[0]+3.2,lp[1]); ctx.lineTo(lp[0],lp[1]-th); ctx.closePath(); ctx.fill(); inkStroke(1.6);
    }
  } else {
    ctx.strokeStyle=INK; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(-57,3); ctx.quadraticCurveTo(-46,11,-32,7); ctx.stroke();
  }

  /* --- eye --- */
  var ex=-40, ey=-9;
  if(z>0.3){
    if(s>0.7){
      var gg=ctx.createRadialGradient(ex,ey,2,ex,ey,30);
      gg.addColorStop(0,rgba(RED_HI,0.85*z)); gg.addColorStop(1,rgba(RED_HI,0));
      ctx.fillStyle=gg;
    } else { ctx.fillStyle=rgba(RED_HI,0.30*z); }
    ctx.beginPath(); ctx.arc(ex,ey,30,0,TAU); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(ex,ey,11.5,0,TAU); ctx.fillStyle=mix('#f4ead3','#d8d2b4',z); ctx.fill(); inkStroke(4);
  ctx.beginPath(); ctx.arc(ex,ey,7.6,0,TAU); ctx.fillStyle=mix('#2fa36a',RED_HI,z); ctx.fill();
  ctx.beginPath(); ctx.arc(ex,ey,z>0.5?2.2:3.9,0,TAU); ctx.fillStyle=INK; ctx.fill();
  ctx.beginPath(); ctx.arc(ex-3.4,ey-3.8,2.4,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
  /* brow — the grump */
  ctx.strokeStyle=INK; ctx.lineWidth=4.2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(ex-13,ey-13); ctx.lineTo(ex+11,ey-6); ctx.stroke();

  /* drool */
  if(z>0.6&&open>0.3){
    ctx.fillStyle=rgba(TOX,0.8);
    for(var d2=0;d2<3;d2++){
      var dx2=-52+d2*11, dl=8+hash(seed+d2*4+ph)*16;
      ctx.beginPath(); ctx.ellipse(dx2,22+dl*0.5,2.6,dl*0.5,0,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
}

/* 11 — PANIC */

  var P=[
    function(w,h){ /* bitten arm */
      ctx.fillStyle='#d9a479'; ctx.fillRect(0,0,w,h);
      dots(0,0,w,h,'rgba(150,70,40,0.3)',9,1.5,1);
      ctx.strokeStyle='#30401f'; ctx.lineCap='round';
      for(var v=0;v<11;v++){

        ctx.stroke();

      splatPath(w*0.42,h*0.5,64,7,15); ctx.fillStyle=BLOOD; ctx.fill();
      ctx.fillStyle=INK;
      for(var b=0;b<7;b++){ var ba=b/7*TAU; ctx.beginPath(); ctx.arc(w*0.42+Math.cos(ba)*54,h*0.5+Math.sin(ba)*48,6,0,TAU); ctx.fill(); }
    },

/* ---------- camera + composite ---------- */
function shakeAmt(b,p){
  switch(b.n){
    case 'boom':   return 34*Math.pow(1-p,2.4);
    case 'title':  return 30*Math.pow(1-clamp(p/0.22,0,1),2);
    case 'rise':   return p>0.66? 22*Math.pow(1-(p-0.66)/0.34,2) : 3;
    case 'gauge':  return 3+9*p;
    case 'mutate': return 5;
    case 'swarm':  return 6;
    case 'manual': return 9;
    case 'panic':  return 4;
    case 'leak':   return 3;
    default:       return 1.3;
  }
}
function draw(t){
  t=clamp(t,0,DUR-0.0001);
  var bi=beatAt(t), b=BEATS[bi], p=clamp((t-b.t)/b.d,0,1);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);

  var sh=shakeAmt(b,p);
  var slam=(b.n==='coast')?0:clamp(1-p/0.07,0,1);
  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.rotate(Math.sin(t*37.1)*sh*0.0006);
  var z=1+0.10*slam;
  ctx.scale(z,z);
  ctx.translate(-W/2+Math.sin(t*61.7)*sh, -H/2+Math.cos(t*53.3)*sh);
  (SC[b.n]||SC.coast)(p,t);
  ctx.restore();

  /* cut flash */
  if(b.n!=='coast' && b.n!=='boom' && p*b.d<0.07){
    ctx.globalAlpha=(1-(p*b.d)/0.07)*0.6; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  /* vignette */
  var vg=ctx.createRadialGradient(W/2,H/2,H*0.32,W/2,H/2,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.52)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  /* newsprint grain */
  if(!grainPat) grainPat=ctx.createPattern(grainCv,'repeat');
  ctx.save();
  ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.20;
  ctx.translate(-(t*97%240),-(t*61%240));
  ctx.fillStyle=grainPat; ctx.fillRect(0,0,W+240,H+240);
  ctx.restore();
  /* page border */
  ctx.globalCompositeOperation='source-over';
  ctx.lineWidth=18; ctx.strokeStyle=INK; ctx.strokeRect(9,9,W-18,H-18);
}

/* ---------- procedural sound ---------- */
var AC=null, master=null, mdest=null, noiseBuf=null, muted=false;
function initAudio(){
  if(AC) return;
  var AA=window.AudioContext||window.webkitAudioContext; if(!AA) return;
  AC=new AA();
  master=AC.createGain(); master.gain.value=0.85;
  master.connect(AC.destination);
  try{ mdest=AC.createMediaStreamDestination(); master.connect(mdest); }catch(e){ mdest=null; }
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  var d=noiseBuf.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function nz(){ var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }
function nHit(at,dur,f0,f1,q,gain,type){
  if(!AC||at<AC.currentTime-0.05) return;
  var s=nz(), f=AC.createBiquadFilter();
  f.type=type||'bandpass'; f.Q.value=q||1;
  f.frequency.setValueAtTime(f0,at);
  f.frequency.exponentialRampToValueAtTime(Math.max(45,f1),at+dur);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,at);
  g.gain.linearRampToValueAtTime(gain,at+Math.min(0.02,dur*0.2));
  g.gain.exponentialRampToValueAtTime(0.0008,at+dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(at); s.stop(at+dur+0.05);
}
function tone(at,dur,f0,f1,gain,type){
  if(!AC||at<AC.currentTime-0.05) return;
  var o=AC.createOscillator(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0,at);
  o.frequency.exponentialRampToValueAtTime(Math.max(18,f1),at+dur);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,at);
  g.gain.linearRampToValueAtTime(gain,at+Math.min(0.03,dur*0.25));
  g.gain.exponentialRampToValueAtTime(0.0008,at+dur);
  o.connect(g); g.connect(master);
  o.start(at); o.stop(at+dur+0.05);
}
function whoosh(at,gain){ nHit(at,0.32,4200,260,0.7,gain||0.22,'bandpass'); }
function kick(at,gain){ tone(at,0.13,150,42,gain||0.22); nHit(at,0.05,2600,900,1,0.07); }
function scheduleAll(t0){
  if(!AC) return;
  var A=function(x){ return t0+x; };
  tone(A(0.0),4.8,52,44,0.075,'sine');
  nHit(A(0.05),2.2,700,220,0.6,0.11,'lowpass');
  nHit(A(0.70),0.9,1800,400,0.8,0.13);
  nHit(A(1.45),0.8,1500,360,0.8,0.11);
  whoosh(A(2.0),0.24); tone(A(2.05),1.15,118,112,0.05,'triangle');
  whoosh(A(3.3),0.26);
  for(var i=0;i<6;i++) tone(A(3.36+i*0.15),0.07,940,900,0.10,'square');
  /* detonation */
  tone(A(4.3),1.9,95,26,0.55,'sine');
  tone(A(4.3),1.5,58,20,0.45,'triangle');
  nHit(A(4.3),1.7,2200,60,0.5,0.6,'lowpass');
  nHit(A(4.32),0.5,7000,2000,0.6,0.3,'highpass');
  whoosh(A(5.9),0.2);
  for(var b2=0;b2<12;b2++) nHit(A(5.95+b2*0.1),0.13,300+Math.random()*900,180,6,0.09);
  /* pulse bed */
  for(var k2=0;k2<28;k2++){ var kt=6.0+k2*0.42; if(kt>18.4) break; kick(A(kt), kt>11.7?0.30:0.2); }
  whoosh(A(7.3),0.22); tone(A(7.32),0.14,680,660,0.11,'square');
  tone(A(8.56),0.55,240,58,0.3,'sawtooth'); nHit(A(8.56),0.4,900,140,2,0.2);
  tone(A(9.0),1.4,72,60,0.16,'sawtooth'); nHit(A(9.0),1.25,420,120,3,0.14);
  nHit(A(10.5),0.35,500,70,0.8,0.42,'lowpass');
  nHit(A(11.7),1.25,180,3200,0.7,0.24); tone(A(11.7),1.25,110,420,0.10,'sawtooth');
  whoosh(A(13.0),0.24);
  nHit(A(13.57),0.55,2600,600,0.5,0.34,'bandpass');
  nHit(A(14.33),0.22,1400,180,1.2,0.4,'lowpass'); tone(A(14.33),0.3,190,50,0.3);
  nHit(A(14.9),0.5,1000,700,9,0.2); tone(A(14.92),0.45,520,300,0.14,'sawtooth');
  /* emergency broadcast two-tone */
  nHit(A(16.2),0.3,900,120,0.7,0.34,'lowpass');
  tone(A(16.28),0.26,853,853,0.16,'square'); tone(A(16.28),0.26,960,960,0.16,'square');
  tone(A(16.62),0.26,853,853,0.16,'square'); tone(A(16.62),0.26,960,960,0.16,'square');
  tone(A(16.2),1.3,66,62,0.10,'sawtooth');
  for(var s3=0;s3<6;s3++) nHit(A(17.5+s3*0.16),0.1,2400,500,1.4,0.24);
  /* title */
  nHit(A(18.0),0.6,200,2600,0.8,0.2);
  tone(A(18.5),1.7,80,22,0.55,'sine');
  nHit(A(18.5),1.4,2600,55,0.6,0.5,'lowpass');
  nHit(A(19.5),0.22,3200,800,1,0.26,'highpass');
}

/* ---------- player ---------- */
var playing=false, startWall=0, curT=0, raf=0;
var poster=document.getElementById('poster');
var elTC=document.getElementById('tc'), elFill=document.getElementById('fill');
function sync(t){
  var mm=Math.floor(t/60), ss=Math.floor(t%60);
  elTC.textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss+' / 00:20';
  elFill.style.width=(t/DUR*100)+'%';
}
var lastDraw=0;
function loop(){
  if(!playing) return;
  var now=performance.now(), t=(now-startWall)/1000;
  if(t>=DUR){ curT=DUR-0.001; draw(curT); playing=false; sync(DUR); return; }
  /* cap at 60fps — on a 120Hz panel the extra ticks only cost frame budget */
  if(now-lastDraw>=15.5){
    lastDraw=now; curT=t; draw(t); sync(t);
  }
  raf=requestAnimationFrame(loop);
}
function start(){
  initAudio();
  if(AC && AC.state==='suspended') AC.resume();
  cancelAnimationFrame(raf);
  poster.style.display='none';
  playing=true; startWall=performance.now();
  if(AC && !muted) scheduleAll(AC.currentTime+0.06);
  raf=requestAnimationFrame(loop);
}
document.getElementById('play').addEventListener('click',start);
poster.addEventListener('click',start);
document.getElementById('replay').addEventListener('click',start);
document.addEventListener('keydown',function(e){
  if(e.code==='Space'){ e.preventDefault(); start(); }
});
var mb=document.getElementById('mute');
mb.addEventListener('click',function(){
  muted=!muted;
  mb.setAttribute('aria-pressed',muted?'true':'false');
  mb.textContent='Sound: '+(muted?'off':'on');
  if(master) master.gain.value=muted?0:0.85;
});

/* ---------- export ----------
   Frames are pushed on a fixed 30fps grid via requestFrame() instead of
   letting the recorder sample whatever the rAF loop happened to paint.
   Each frame is drawn for its exact timecode and emitted at its exact due
   wall-clock time, so the file is evenly spaced even if one frame renders
   long — and if the machine does fall behind, the missed index is skipped
   rather than smeared, which keeps picture and audio locked. */
var exporting=false, FPS=30;
var embedded=(function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
var note=document.getElementById('recnote'), saver=null;
function restNote(){
  note.textContent = (!embedded||saver)
    ? 'Renders the full 20 seconds to a 30fps .webm file (about 20 seconds to build) and saves it to your device.'
    : 'Renders the full 20 seconds to a 30fps .webm. If this preview blocks the save, open trailer.html directly in a browser.';
}
restNote();
if(window.claude && typeof window.claude.use==='function'){
  try{ window.claude.use('downloads').then(function(d){ saver=d; restNote(); },function(){}); }catch(e){}
}
function deliver(blob,btn){
  var mb=(blob.size/1048576).toFixed(1);
  function done(msg){ btn.disabled=false; btn.textContent='⇩ Download video'; note.textContent=msg; }
  if(saver){
    saver.save({filename:'surviving-thuwaliidae-teaser.webm',data:blob}).then(function(){
      done('Saved surviving-thuwaliidae-teaser.webm ('+mb+' MB).');
    },function(err){
      var c=err&&err.code;
      done(c==='declined' ? 'Save cancelled. Press Export again to re-render.'
        : 'Could not save here'+(c?' ('+c+')':'')+'. Open trailer.html directly in a browser.');
    });
    return;
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='surviving-thuwaliidae-teaser.webm';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },4000);
  done('Saved surviving-thuwaliidae-teaser.webm ('+mb+' MB).');
}
document.getElementById('rec').addEventListener('click',function(){
  var btn=this;
  if(exporting) return;
  if(!cv.captureStream||!window.MediaRecorder){ note.textContent='This browser cannot capture the canvas. Use a screen recorder instead.'; return; }
  var types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  var mime=''; for(var i=0;i<types.length;i++){ if(MediaRecorder.isTypeSupported(types[i])){ mime=types[i]; break; } }
  if(!mime){ note.textContent='MediaRecorder is unavailable here. Use a screen recorder instead.'; return; }

  initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  cancelAnimationFrame(raf); playing=false;
  poster.style.display='none';

  var stream, track=null;
  try{ stream=cv.captureStream(0); track=stream.getVideoTracks()[0]; }catch(e){ stream=null; }
  if(!stream||!track||typeof track.requestFrame!=='function'){
    stream=cv.captureStream(FPS); track=null;   /* older browsers: timed capture */
  }
  if(mdest&&!muted) mdest.stream.getAudioTracks().forEach(function(tr){ stream.addTrack(tr); });

  var mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000}), chunks=[];
  mr.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=function(){
    exporting=false; sync(DUR);
    deliver(new Blob(chunks,{type:'video/webm'}),btn);
  };

  btn.disabled=true; btn.textContent='Rendering 0%';
  note.textContent='Rendering 20 seconds at 30fps — keep this tab in front.';
  exporting=true;

  var total=Math.round(DUR*FPS), idx=0, t0;
  function finish(){ draw(DUR-0.001); if(track) track.requestFrame(); setTimeout(function(){ if(mr.state!=='inactive') mr.stop(); },200); }
  function step(){
    var now=performance.now(), due=Math.floor((now-t0)/1000*FPS);
    if(due<idx){ setTimeout(step, Math.max(0, t0+idx*1000/FPS-now)); return; }
    if(due>idx) idx=due;                    /* skip, never smear */
    if(idx>=total){ finish(); return; }
    var ft=idx/FPS;
    draw(ft);
    if(track) track.requestFrame();
    if(idx%15===0){ sync(ft); btn.textContent='Rendering '+Math.round(idx/total*100)+'%'; }
    idx++;
    setTimeout(step, Math.max(0, t0+idx*1000/FPS-performance.now()));
  }
  mr.start();
  t0=performance.now();
  if(AC&&!muted) scheduleAll(AC.currentTime+0.05);
  step();
});

/* ---------- boot ---------- */
function boot(){ draw(0.95); sync(0); }
if(document.fonts && document.fonts.load){
  Promise.all([
    document.fonts.load('80px Anton'),
    document.fonts.load('20px "Special Elite"'),
    document.fonts.load('700 40px "Noto Kufi Arabic"')
  ]).then(boot,boot);
} else boot();
/*__APPEND__*/
})();
</script>
