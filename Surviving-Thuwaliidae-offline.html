<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="لعبة نجاة ورعب بمنظور أول على ساحل البحر الأحمر.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{margin:0;background:#000;color:#c6d0d3;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Surviving Thuwaliidae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Surviving Thuwaliidae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Blaka+Ink&family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --void:#000000; --deep:#070707; --panel:#0c0c0d;
  --hull:#9fc6d1; --hull-dim:#41606b;
  --paper:#d9d0bc; --ink:#191410;
  --warn:#c9302c; --text:#c6d0d3; --dim:#75858a; --faint:#465358; --line:#151617; --frame:#000000;
  --ok:#7fb08a;
  --ui:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --hand:"Aref Ruqaa","Amiri",Georgia,serif;
  --smear:"Blaka Ink","Aref Ruqaa",system-ui,serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --pulp:#cfc4ac;
  --blood:#8e1f18;
}

/* ============================================================
   paper and ink: every narrative surface is a wet page, and the
   ink on it was written by a shaking hand
   ============================================================ */
.paper{
  position:relative;
  background:var(--pulp);
  background-image:
    radial-gradient(circle at 16% 20%, rgba(120,96,60,.18), transparent 44%),
    radial-gradient(circle at 80% 74%, rgba(88,68,42,.16), transparent 48%),
    repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(20,17,13,.05) 24px,rgba(20,17,13,.05) 25px);
  border:1px solid #9c8f76;
  box-shadow:0 14px 34px rgba(0,0,0,.66);
  padding:26px 30px 28px;
  max-width:min(640px,88%);
  transform:rotate(-.5deg);
}
/* the sheet has been torn out, not cut */
.paper.torn{
  clip-path:polygon(0 1.2%,3% 0,12% 1%,26% .2%,41% 1.4%,57% .3%,73% 1.2%,88% .2%,97% 1.1%,100% 2.4%,
                    99.2% 18%,100% 37%,99% 56%,100% 74%,99.3% 92%,100% 98.6%,
                    95% 100%,79% 98.9%,63% 100%,47% 98.8%,31% 99.8%,16% 98.7%,4% 99.9%,0 98%,
                    .8% 78%,0 61%,.9% 42%,0 24%,.7% 9%);
}
/* blood soaks the page: a thumbprint at the edge, a spatter, a few flecks */
.paper::after{
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  background:
    radial-gradient(ellipse 86px 40px at 9% 92%,  rgba(126,22,17,.58), transparent 68%),
    radial-gradient(ellipse 44px 66px at 94% 13%, rgba(126,22,17,.48), transparent 70%),
    radial-gradient(ellipse 30px 22px at 68% 97%, rgba(140,28,21,.52), transparent 72%),
    radial-gradient(circle 9px  at 24% 18%, rgba(126,22,17,.66), transparent 78%),
    radial-gradient(circle 5px  at 31% 24%, rgba(126,22,17,.58), transparent 80%),
    radial-gradient(circle 3px  at 19% 27%, rgba(126,22,17,.52), transparent 80%),
    radial-gradient(circle 6px  at 80% 62%, rgba(126,22,17,.50), transparent 78%),
    radial-gradient(circle 3.5px at 74% 70%, rgba(126,22,17,.46), transparent 80%),
    radial-gradient(ellipse 14px 5px at 52% 6%, rgba(126,22,17,.40), transparent 76%);
}
/* a smear dragged by a thumb along the lower edge */
.paper::before{
  content:"";position:absolute;left:6%;right:38%;bottom:3%;height:16px;pointer-events:none;
  mix-blend-mode:multiply;border-radius:60% 40% 55% 45%/70% 60% 40% 30%;
  background:linear-gradient(95deg, rgba(126,22,17,.44), rgba(126,22,17,.16) 55%, transparent);
  filter:blur(1.2px);
}
.ink{ font-family:var(--hand); color:#14110d; }
.shaky{ filter:url(#smudge); }
.bleed{
  text-shadow:
    1px 1px 0 rgba(142,31,24,.55),
   -1px 0   0 rgba(142,31,24,.30),
    0   2px 3px rgba(142,31,24,.26);
}
.drip::before{
  content:"";position:absolute;inset-inline-end:14%;top:88%;
  width:3px;height:22px;border-radius:0 0 3px 3px;
  background:linear-gradient(to bottom,var(--blood),rgba(142,31,24,0));
  opacity:.7;
}
*{box-sizing:border-box}
body{background:var(--void);color:var(--text);font-family:var(--ui);font-weight:300;margin:0;line-height:1.6}

.shell{direction:rtl;max-width:1060px;margin:0 auto;padding-inline:20px;padding-block:24px 48px}
.masthead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px;max-width:760px;margin-inline:auto}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.4vw,34px);
   letter-spacing:.055em;line-height:1.05;margin:0;color:#ffffff;direction:ltr}
h1 .r{color:var(--warn)}
.byline{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);direction:ltr;text-transform:uppercase}
svg.defs{position:absolute;width:0;height:0;overflow:hidden}

/* the frame is bounded by the window's height as well as its width, so the whole
   thing — title, screen, buttons — always fits without scrolling */
.stage{position:relative;
  width:min(760px, 100%, calc((100vh - 200px) * 16 / 9));
  width:min(760px, 100%, calc((100dvh - 200px) * 16 / 9));
  margin:0 auto;aspect-ratio:16/9;background:#000;
       border:1px solid var(--frame);overflow:hidden;touch-action:none;cursor:crosshair}
.stage:focus-visible{outline:2px solid var(--hull);outline-offset:2px}
canvas#cv{display:block;width:100%;height:100%}

/* ---------- screen-space grade: vignette, grain, damage, proximity ---------- */
.fx{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 38%, rgba(3,2,2,.62) 100%)}
#grain{opacity:.16;mix-blend-mode:overlay;background-repeat:repeat;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.5'/></svg>");
  animation:grainShift .28s steps(3) infinite}
@keyframes grainShift{0%{background-position:0 0}33%{background-position:-30px 14px}66%{background-position:22px -26px}100%{background-position:0 0}}
#sense{opacity:0;transition:opacity .25s ease}
#hurt{box-shadow:inset 0 0 120px 30px var(--warn);opacity:0;transition:opacity .5s ease}
#hurt.on{opacity:.55;transition:opacity .04s ease}

/* ---------- in-frame HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--ui)}
.hud .pips{position:absolute;top:12px;left:14px;display:flex;gap:5px}
.pip{width:11px;height:11px;border:1px solid rgba(160,176,180,.45)}
.pip.out{background:var(--ok);border-color:var(--ok)}
.pip.with{background:#e0ce8c;border-color:#e0ce8c}
.pip.gone{border-color:rgba(201,48,44,.75);position:relative;background:
  linear-gradient(45deg,transparent 43%,var(--warn) 43%,var(--warn) 57%,transparent 57%),
  linear-gradient(-45deg,transparent 43%,var(--warn) 43%,var(--warn) 57%,transparent 57%)}
.hud .count{position:absolute;top:29px;left:14px;
  font-family:var(--mono);font-size:11px;color:rgba(190,200,203,.6);direction:ltr}
/* what you are carrying, across the top of the frame */
.inv{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;pointer-events:auto;direction:ltr;
}
.inv .slot{
  display:flex;align-items:center;gap:6px;
  background:rgba(10,12,14,.60);border:1px solid rgba(180,196,200,.28);
  border-radius:4px;padding:6px 10px;min-height:32px;
  font-family:var(--ui);font-size:12px;color:#dde5e7;
  backdrop-filter:blur(2px);-webkit-tap-highlight-color:transparent;
}
.inv .slot.wpn{border-color:rgba(200,190,164,.34)}
.inv .lbl{font-size:11.5px;color:rgba(214,204,178,.9);min-width:34px;text-align:center}
.inv .ico{font-size:14px;line-height:1}
.inv .ico.med{color:#8fbf9a}
.inv .ico.nrg{color:#e0ce8c}
.inv .n{font-family:var(--mono);font-size:11.5px;min-width:10px;text-align:center}
.inv button.slot{cursor:pointer;transition:background .14s ease,border-color .14s ease}
.inv button.slot:disabled{opacity:.34;cursor:default}
.inv button.slot:not(:disabled):hover{background:rgba(159,198,209,.26)}
.inv button.slot:not(:disabled):active{background:rgba(159,198,209,.62);color:#05080a}
.inv button.slot:focus-visible{outline:2px solid #fff;outline-offset:2px}
.inv .slot.flash{animation:invFlash .5s ease}
@keyframes invFlash{0%{background:rgba(159,198,209,.85)}100%{background:rgba(10,12,14,.60)}}

/* a swallowed energy drink shows at the edge of sight */
#shield{box-shadow:inset 0 0 70px 14px rgba(224,206,140,.45);opacity:0;transition:opacity .4s ease}
#shield.on{opacity:.6}

.hud .pausebtn{
  position:absolute;top:10px;right:12px;pointer-events:auto;
  width:38px;height:32px;display:grid;place-items:center;
  background:rgba(12,14,16,.55);border:1px solid rgba(180,196,200,.30);
  color:#dde5e7;border-radius:4px;cursor:pointer;font-size:11px;letter-spacing:1px;
  -webkit-tap-highlight-color:transparent;backdrop-filter:blur(2px);
}
.hud .pausebtn:hover{background:rgba(159,198,209,.75);color:#05080a}
.hud .pausebtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hud .hp{position:absolute;top:50px;right:12px;display:flex;gap:5px;flex-direction:row-reverse}
.hp i{width:9px;height:9px;background:var(--warn);display:block}
.hp i.off{background:rgba(201,48,44,.18)}
.hud .wep{position:absolute;top:66px;right:12px;font-size:11.5px;color:rgba(200,190,164,.75)}

.paused{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:18px;background:rgba(3,5,7,.86)}
.paused[hidden]{display:none!important}
.paused .paper{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:min(420px,92%)}
.paused h2{font-family:var(--hand);font-weight:700;font-size:clamp(20px,4vw,28px);margin:0;color:#14110d}
.paused .prow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.paused .tog{color:#4a4033;border-color:rgba(20,17,13,.35);background:rgba(20,17,13,.06)}
.paused .tog:hover{color:#14110d;border-color:rgba(20,17,13,.6)}
.paused .tog[aria-pressed="true"]{color:#2f5c6b;border-color:#2f5c6b}


.hud .hide{position:absolute;top:50px;left:14px;font-size:11.5px;color:rgba(159,198,209,.85)}
.hud .toast{position:absolute;bottom:34px;left:0;right:0;text-align:center;
  font-size:13px;color:rgba(228,218,190,.95);opacity:0;transition:opacity .3s ease;
  text-shadow:0 2px 12px rgba(0,0,0,.9)}
.hud .toast.on{opacity:1}
.hud [hidden]{display:none!important}

/* ---------- overlays ---------- */
/* ---------- thumb controls, only where there are thumbs ---------- */
.stick,.acts{position:absolute;bottom:12px;display:none;z-index:6;user-select:none;-webkit-user-select:none}
.stick{left:12px;width:112px;height:112px;touch-action:none}
.acts{right:12px;flex-direction:column;align-items:flex-end;gap:7px}
.stage.touch .stick{display:block}
.stage.touch .acts{display:flex}
.stick .ring{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(12,16,18,.34), rgba(12,16,18,.56));
  border:1px solid rgba(180,196,200,.26);
  backdrop-filter:blur(2px);
}
.stick .knob{
  position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
  border-radius:50%;background:rgba(190,212,218,.70);border:1px solid rgba(232,242,244,.5);
  box-shadow:0 2px 10px rgba(0,0,0,.5);
  transition:background .12s ease;
  will-change:transform;
}
.stick.live .knob{background:rgba(159,198,209,.95)}
.grid2{display:grid;grid-template-columns:repeat(2,74px);gap:6px}
.k{
  background:rgba(12,14,16,.52);border:1px solid rgba(180,196,200,.30);
  color:#dde5e7;border-radius:4px;line-height:1;height:38px;
  font-family:var(--ui);font-size:12.5px;font-weight:500;
  display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:none;
  backdrop-filter:blur(2px);
}
.k:active,.k.on{background:rgba(159,198,209,.80);color:#05080a;border-color:#9fc6d1}
.k:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* the stab only exists while something is close enough to stab */
.k.stab{
  width:154px;height:44px;font-size:14px;font-weight:600;
  background:rgba(142,26,20,.80);border-color:#e0574c;color:#fff;
  box-shadow:0 0 18px rgba(201,48,44,.45);
  animation:stabPulse 1.1s ease-in-out infinite;
}
.k.stab:active{background:#e0574c;color:#14110d}
.k.stab[hidden]{display:none!important}
@keyframes stabPulse{0%,100%{box-shadow:0 0 14px rgba(201,48,44,.35)}50%{box-shadow:0 0 26px rgba(201,48,44,.7)}}
@media (prefers-reduced-motion:reduce){ .k.stab{animation:none} }

/* ---------- turn the phone ---------- */
.tilt{
  position:absolute;inset:0;z-index:30;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(3,5,7,.94);text-align:center;padding:24px;
}
.tilt p{margin:0;font-family:var(--display);font-size:19px;color:#dde5e7}
.tilt span{font-size:12.5px;color:var(--dim);max-width:30ch}
@media (orientation:portrait) and (pointer:coarse){ .tilt{display:flex} }

.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px;cursor:default;
  background:radial-gradient(ellipse at 50% 60%, rgba(5,8,10,.74), rgba(5,8,10,.95) 70%)}
.veil[hidden]{display:none!important}
.veil .paper{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.veil h2{font-family:var(--hand);font-weight:700;font-size:clamp(21px,3.8vw,31px);margin:0;color:#14110d;text-wrap:balance;line-height:1.4}
.veil p{margin:0;max-width:44ch;font-family:var(--hand);font-size:clamp(14px,2.1vw,17px);line-height:1.85;color:#241d16;text-wrap:pretty}
.veil .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:#7a6d58;text-transform:uppercase;direction:ltr}

button{font-family:inherit}
/* the start controls sit on paper, so they read as pressed ink, not a cyan chip */
.btn{font-family:var(--ui);font-weight:500;font-size:14px;color:#241d16;
  background:transparent;border:1px solid rgba(20,17,13,.55);
  padding:11px 28px;border-radius:2px;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,transform .15s ease;
  -webkit-tap-highlight-color:transparent}
.btn:hover{background:rgba(20,17,13,.10);border-color:rgba(20,17,13,.8)}
.btn:active{transform:translateY(1px);background:rgba(20,17,13,.16)}
.btn:focus-visible{outline:2px solid var(--warn);outline-offset:3px}

.intro{position:absolute;inset:0;overflow:hidden}
.intro[hidden]{display:none!important}
.intro .lid{position:absolute;left:0;right:0;background:#03060a;height:52%}
.intro .lid.top{top:0}
.intro .lid.bot{bottom:0}
/* narration arrives as a torn page held up in the dark */
.intro .lineWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:22px;opacity:0;pointer-events:none}
.intro .lineWrap.show{opacity:1;transition:opacity .9s ease}
.intro .line{margin:0;text-align:center;font-family:var(--hand);font-weight:700;
  font-size:clamp(16px,3vw,26px);line-height:1.6;color:#14110d;text-wrap:balance}
.intro .titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;opacity:0;pointer-events:none}
.intro .titlecard.show{opacity:1;transition:opacity 1.1s ease}
.intro .tk{font-family:var(--display);font-weight:400;letter-spacing:.30em;font-size:clamp(11px,2vw,15px);
  color:#7d9aa3;direction:ltr;text-transform:uppercase}
/* the title keeps the original geometric kufic — it is the one thing that stays steady */
.intro .tk.big{font-family:var(--display);font-weight:700;letter-spacing:.055em;text-transform:none;
  font-size:clamp(26px,6.4vw,50px);color:#ffffff;
  text-shadow:0 0 38px rgba(255,255,255,.18)}
.intro .tk.big .r{color:var(--warn)}
.intro .skip{position:absolute;bottom:12px;inset-inline-end:14px;background:rgba(8,12,15,.6);color:var(--dim);
  border:1px solid var(--line);border-radius:2px;padding:6px 13px;font-size:11.5px;cursor:pointer}
.intro .skip:hover{color:var(--text);border-color:var(--faint)}
.intro .sndhint{position:absolute;bottom:15px;inset-inline-start:14px;margin:0;font-size:11px;color:var(--faint)}

.outro{background:#03060a}
.outro .strobe{position:absolute;inset:0;background:var(--warn);opacity:0;mix-blend-mode:screen}
.whatsnext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;opacity:0;pointer-events:none}
.whatsnext.show{opacity:1;pointer-events:auto;transition:opacity .9s ease}
.whatsnext .paper{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;transform:rotate(.6deg)}
.whatsnext svg{filter:drop-shadow(0 2px 6px rgba(142,31,24,.4))}
.wn-tbc{font-family:var(--smear);font-weight:400;font-size:clamp(30px,7.6vw,56px);color:#8e1f18;
        line-height:1.15;letter-spacing:.01em;direction:ltr;
        text-shadow:1px 1px 0 rgba(20,17,13,.38),-1px 0 0 rgba(20,17,13,.2)}
.wn-k{font-family:var(--smear);font-weight:400;font-size:clamp(21px,4.6vw,34px);color:#14110d;line-height:1.35;
  text-shadow:2px 2px 0 rgba(142,31,24,.6), -2px 1px 0 rgba(142,31,24,.34)}
.wn-s{font-family:var(--hand);font-size:clamp(13px,2.2vw,16px);color:#3a2f24;letter-spacing:.02em}
.whatsnext .btn{margin-top:12px}

.bar{display:flex;gap:9px;justify-content:flex-end;padding-top:12px;flex-wrap:wrap;max-width:760px;margin:0 auto}
.tog{font-size:12px;color:var(--dim);background:transparent;border:1px solid var(--line);
  padding:6px 14px;border-radius:2px;cursor:pointer;transition:color .15s ease,border-color .15s ease}
.tog:hover{color:var(--text);border-color:var(--faint)}
.tog[aria-pressed="true"]{color:var(--hull);border-color:var(--hull-dim)}
.tog:focus-visible{outline:2px solid var(--hull);outline-offset:2px}

.jump{display:flex;gap:6px;margin:10px 0 2px}
.jump button{flex:1;font-family:var(--mono);font-size:10px;background:rgba(25,20,16,.08);color:#5d5348;
  border:1px solid rgba(25,20,16,.3);border-radius:2px;padding:5px 0;cursor:pointer}
.jump button:hover{background:rgba(25,20,16,.16);color:var(--ink)}
.jump button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.crewline{display:flex;justify-content:space-between;gap:8px;font-family:var(--hand);font-size:13.5px;color:#2a231c;padding:1px 0}
.crewline .s{font-family:var(--mono);font-size:9px;letter-spacing:.06em;align-self:center}
.crewline.out .s{color:#3f6b48}
.crewline.with .s{color:#2f5c6b}
.crewline.gone{opacity:.55}
.crewline.gone .n{text-decoration:line-through}
.crewline.gone .s{color:#8f2f2a}

.book{position:fixed;left:18px;bottom:18px;width:min(292px,calc(100vw - 36px));max-height:min(330px,52vh);
  display:flex;flex-direction:column;background:var(--paper);color:var(--ink);
  transform:translateY(calc(100% + 24px)) rotate(-.7deg);opacity:0;pointer-events:none;
  transition:transform .34s cubic-bezier(.22,.61,.36,1),opacity .24s ease;z-index:40;direction:rtl;
  box-shadow:0 16px 40px rgba(0,0,0,.66);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 21px,rgba(25,20,16,.07) 21px,rgba(25,20,16,.07) 22px)}
.book.open{transform:translateY(0) rotate(-.7deg);opacity:1;pointer-events:auto}
/* the notebook has been handled with wet hands */
.book::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;mix-blend-mode:multiply;
  background:
    radial-gradient(ellipse 60px 34px at 92% 8%,  rgba(126,22,17,.50), transparent 70%),
    radial-gradient(ellipse 40px 26px at 6% 88%,  rgba(126,22,17,.42), transparent 72%),
    radial-gradient(circle 8px at 22% 34%, rgba(126,22,17,.52), transparent 78%),
    radial-gradient(circle 4px at 28% 40%, rgba(126,22,17,.44), transparent 80%),
    radial-gradient(circle 5px at 71% 58%, rgba(126,22,17,.46), transparent 78%),
    radial-gradient(circle 3px at 64% 64%, rgba(126,22,17,.38), transparent 80%);
}
.book-bar,.book-scroll{position:relative;z-index:2}
.book-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 8px 7px 11px;border-bottom:1px solid rgba(25,20,16,.24);background:rgba(25,20,16,.06)}
.book-bar .tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:#6b5f52;direction:ltr}
.book-scroll{overflow-y:auto;padding:12px 14px 16px}
.book h2{font-family:var(--hand);font-size:19px;font-weight:700;margin:0 0 6px;color:var(--ink);line-height:1.25}
.book .said{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b5f52;direction:ltr;text-align:right}
.book hr{border:none;border-top:1px solid rgba(25,20,16,.22);margin:10px 0}
.book p,.book li{font-family:var(--hand);font-size:13.5px;line-height:1.62;color:#2a231c}
.book p{margin:0 0 8px}
.book .plate{border:1px solid rgba(25,20,16,.3);padding:9px 10px;margin:10px 0;background:rgba(25,20,16,.05)}
.book .plate .cap{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:#6b5f52;margin-bottom:4px;direction:ltr;text-align:right}
.book .strike{text-decoration:line-through;opacity:.55}
.book .scrawl{font-family:var(--hand);font-style:italic;color:#8f2f2a;font-size:13.5px;line-height:1.5;transform:rotate(-.5deg);display:block;margin:9px 0 4px}
.book-close{flex:none;background:var(--ink);color:var(--paper);border:none;width:30px;height:30px;
  border-radius:2px;cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;
  -webkit-tap-highlight-color:transparent}
.book-close:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

/* short screens: trim the chrome so the frame keeps its full width */
@media (max-height:560px){
  .shell{padding-block:10px 14px}
  .masthead{margin-bottom:8px}
  h1{font-size:clamp(17px,3.4vw,24px)}
  .byline{display:none}
  .stage{width:min(760px, 100%, calc((100dvh - 120px) * 16 / 9))}
  .stick{width:96px;height:96px;bottom:9px;left:9px}
  .stick .knob{width:40px;height:40px;margin:-20px 0 0 -20px}
  .grid2{grid-template-columns:repeat(2,66px);gap:5px}
  .k{height:33px;font-size:11.5px}
  .k.stab{width:137px;height:38px;font-size:13px}
}

@media (max-width:720px){
  .shell{padding-block:18px 36px}
  /* a slip, not a curtain: it must never swallow the screen or bury its own ✕ */
  .book{left:10px;bottom:10px;width:min(270px,74vw);max-height:38vh}
  .book-scroll{padding:10px 12px 12px}
  .book h2{font-size:17px}
  .book p,.book li,.book .scrawl{font-size:12.5px;line-height:1.55}
  .book-bar{padding:6px 6px 6px 10px}
  .book-close{width:38px;height:38px;font-size:16px}   /* a real thumb target */
  .jump button{padding:9px 0;font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  #grain{animation:none}
}

/* ============================================================
   PHONES AND TABLETS: the game takes the whole screen.
   Declared last on purpose — nothing after it may shrink the frame again.
   Every control is inset by the safe area, so the notch, the rounded
   corners and the home indicator never sit on top of anything.
   ============================================================ */
@media (pointer:coarse){
  html,body{overflow:hidden;height:100%;touch-action:none;-ms-touch-action:none}
  .shell{max-width:none;padding:0;margin:0}
  .masthead,.bar{display:none}
  .stage{
    position:fixed;inset:0;margin:0;border:0;z-index:50;
    max-width:none;width:100vw;height:100vh;aspect-ratio:auto;
  }
  @supports (height:100dvh){ .stage{width:100dvw;height:100dvh} }
  .book{z-index:60}

  /* thumbs */
  .stick{left:calc(14px + env(safe-area-inset-left,0px));
         bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .acts{right:calc(14px + env(safe-area-inset-right,0px));
        bottom:calc(14px + env(safe-area-inset-bottom,0px))}

  /* readouts */
  .hud .pausebtn{right:calc(12px + env(safe-area-inset-right,0px));
                 top:calc(12px + env(safe-area-inset-top,0px))}
  .hud .hp{right:calc(12px + env(safe-area-inset-right,0px));
           top:calc(52px + env(safe-area-inset-top,0px))}
  .hud .wep{right:calc(12px + env(safe-area-inset-right,0px));
            top:calc(68px + env(safe-area-inset-top,0px))}
  .hud .pips{left:calc(14px + env(safe-area-inset-left,0px));
             top:calc(12px + env(safe-area-inset-top,0px))}
  .hud .count{left:calc(14px + env(safe-area-inset-left,0px));
              top:calc(31px + env(safe-area-inset-top,0px))}
  .hud .hide{left:calc(14px + env(safe-area-inset-left,0px));
             top:calc(52px + env(safe-area-inset-top,0px))}
  .hud .toast{bottom:calc(36px + env(safe-area-inset-bottom,0px))}

  /* anything with words in it keeps clear of the edges too */
  .veil,.paused,.tilt,.intro .lineWrap{
    padding-left:calc(18px + env(safe-area-inset-left,0px));
    padding-right:calc(18px + env(safe-area-inset-right,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  }
  .intro .skip{bottom:calc(12px + env(safe-area-inset-bottom,0px));
               inset-inline-end:calc(14px + env(safe-area-inset-right,0px))}
  .intro .sndhint{bottom:calc(15px + env(safe-area-inset-bottom,0px));
                  inset-inline-start:calc(14px + env(safe-area-inset-left,0px))}
}

<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <filter id="smudge" x="-12%" y="-14%" width="124%" height="128%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028 0.06" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="shell">
  <header class="masthead">
    <h1>SURV<span class="r">I</span>V<span class="r">I</span>NG THUWAL<span class="r">II</span>DAE</h1>
    <span class="byline">samahkjj-cloud</span>
  </header>

  <div class="stage" id="stage" tabindex="0" role="application"
       aria-label="نموذج اللعبة بمنظور أول — تقدّم بـ W، التفت بالأسهم، اقفز بالمسافة، أو اسحب بإصبعك">
    <canvas id="cv"></canvas>

    <div class="fx" id="sense"></div>
    <div class="fx" id="vig"></div>
    <div class="fx" id="grain"></div>
    <div class="fx" id="shield"></div>
    <div class="fx" id="hurt"></div>

    <div class="hud" id="hud">
      <div class="pips" id="pips"></div>
      <div class="count" id="count">0 / 4</div>
      <div class="inv" id="inv">
        <div class="slot wpn" id="slotWeapon"><span class="ico">⚔</span><span class="lbl" id="invWeapon">—</span></div>
        <button class="slot use" id="slotMed" data-use="medkit" disabled>
          <span class="ico med">✚</span><span class="n" id="invMed">0</span>
        </button>
        <button class="slot use" id="slotEnergy" data-use="energy" disabled>
          <span class="ico nrg">⚡</span><span class="n" id="invEnergy">0</span>
        </button>
      </div>
      <button class="pausebtn" id="pauseBtn" hidden aria-label="إيقاف مؤقت">❚❚</button>
      <div class="hp" id="hp"></div>
      <div class="wep" id="wep" hidden></div>
      <div class="hide" id="hideTag" hidden>مختبئ</div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="paused" id="pausedPanel" hidden>
      <div class="paper torn">
        <h2 class="ink shaky bleed">وقفة</h2>
        <button class="btn" id="resumeBtn">استئناف</button>
        <div class="prow">
          <button class="tog" id="sndBtn2" aria-pressed="true">الصوت</button>
          <button class="tog" id="bookBtn2">دفتر الميدان</button>
          <button class="tog" id="redoBtn2">إعادة</button>
        </div>
      </div>
    </div>

    <div class="stick" id="stick" aria-label="عصا الحركة">
      <div class="ring"></div>
      <div class="knob" id="knob"></div>
    </div>
    <div class="acts" id="padActs" aria-hidden="true">
      <button class="k stab" data-k="stab" id="stabBtn" hidden aria-label="طعن">طعن</button>
      <div class="grid2">
        <button class="k" data-k="run"  aria-label="ركض">ركض</button>
        <button class="k" data-k="jump" aria-label="قفز">قفز</button>
        <button class="k" data-k="pick" aria-label="التقاط">التقاط</button>
        <button class="k" data-k="drop" aria-label="إنزال">إنزال</button>
      </div>
    </div>

    <div class="tilt" id="tilt">
      <svg viewBox="0 0 64 64" width="58" height="58" aria-hidden="true">
        <rect x="23" y="6" width="18" height="34" rx="3" fill="none" stroke="#9fc6d1" stroke-width="2.4"/>
        <path d="M14 46 a20 20 0 0 0 36 0" fill="none" stroke="#c9302c" stroke-width="2.4"
              stroke-linecap="round" stroke-dasharray="3 4"/>
        <path d="M46 40 l5 7 l-8 1 z" fill="#c9302c"/>
      </svg>
      <p>أدِر جوالك أفقياً</p>
      <span>الشاشة العريضة تُظهر ما يقترب من الجانب</span>
    </div>

    <div class="intro" id="intro">
      <div class="lid top" id="lidTop"></div>
      <div class="lid bot" id="lidBot"></div>
      <div class="lineWrap" id="introWrap">
        <div class="paper torn"><p class="line ink shaky bleed" id="introLine"></p></div>
      </div>
      <div class="titlecard" id="titleCard">
        <span class="tk">Surviving</span>
        <span class="tk big">THUWAL<span class="r">II</span>DAE</span>
      </div>
      <button class="skip" id="skipBtn">تخطّي</button>
      <p class="sndhint">الصوت يعمل — نصف الرعب في السمع</p>
    </div>

    <div class="intro outro" id="outro" hidden>
      <div class="strobe" id="strobe"></div>
      <div class="lineWrap" id="outroWrap">
        <div class="paper torn"><p class="line ink shaky bleed" id="outroLine"></p></div>
      </div>
      <div class="whatsnext" id="whatsNext">
        <div class="paper torn">
          <svg viewBox="0 0 48 48" width="42" height="42" aria-hidden="true">
            <circle cx="24" cy="24" r="21" fill="none" stroke="#8e1f18" stroke-width="2"/>
            <path d="M19 15 L30 24 L19 33" fill="none" stroke="#8e1f18" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="wn-tbc shaky">to be continued&hellip;</span>
          <span class="wn-k shaky">ما التالي؟</span>
          <span class="wn-s">الفصل الأول من اللعبة الكاملة</span>
          <button class="btn" id="outroRedo">من البداية</button>
        </div>
      </div>
    </div>

    <div class="veil" id="veil" hidden>
      <div class="paper torn">
        <div class="eyebrow" id="veilEyebrow"></div>
        <h2 class="ink shaky bleed drip" id="veilTitle"></h2>
        <p class="ink shaky" id="veilBody"></p>
        <button class="btn" id="veilBtn">ابدأ</button>
      </div>
    </div>
  </div>

  <div class="bar">
    <button class="tog" id="redoBtn">إعادة</button>
    <button class="tog" id="sndBtn" aria-pressed="false">الصوت</button>
    <button class="tog" id="bookBtn" aria-pressed="false">دفتر الميدان</button>
  </div>
</div>

<aside class="book" id="book" aria-label="دفتر الميدان">
  <div class="book-bar">
    <span class="tag">Field Notebook</span>
    <button class="book-close" id="bookClose" aria-label="إغلاق الدفتر">✕</button>
  </div>
  <div class="book-scroll" id="bookBody"></div>
</aside>

<script>
(function(){
"use strict";

const stage=document.getElementById('stage');
const cv=document.getElementById('cv');
const veil=document.getElementById('veil');
const hurtEl=document.getElementById('hurt');
const senseEl=document.getElementById('sense');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* world units are ~3cm; S converts them to metres for the 3D scene */
const S=0.03, EYE=1.66;
const WX=x=>x*S, WZ=y=>y*S;

/* ============================================================
   procedural materials
   ============================================================ */
function rng(seed){ let s=seed>>>0; return ()=> (s=(s*1664525+1013904223)>>>0)/4294967296; }
function makeTex(w,h,paint){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  paint(c.getContext('2d'),w,h);
  return c;
}
function grit(x,w,h,seed,n,lo,hi,dark){
  const r=rng(seed);
  for(let i=0;i<n;i++){
    const a=lo+r()*(hi-lo);
    x.fillStyle=dark?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`;
    x.fillRect((r()*w)|0,(r()*h)|0,1+((r()*2)|0),1);
  }
}
const TEX={};
function buildTextures(){
  TEX.plank=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#8a7050'; x.fillRect(0,0,w,h);
    const r=rng(11);
    for(let i=0;i<8;i++){
      const y=i*32;
      x.fillStyle=`rgb(${118+r()*46|0},${92+r()*38|0},${62+r()*30|0})`;
      x.fillRect(0,y,w,29);
      x.fillStyle='rgba(30,20,12,.6)'; x.fillRect(0,y+29,w,3);
      for(let k=0;k<50;k++){
        x.fillStyle=`rgba(46,32,20,${.05+r()*.15})`;
        x.fillRect(r()*w,y+r()*29,10+r()*60,1+r()*2);
      }
    }
    grit(x,w,h,7,900,.02,.11,true);
  });
  TEX.concrete=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#8d9598'; x.fillRect(0,0,w,h);
    const r=rng(23);
    for(let i=0;i<340;i++){
      x.fillStyle=`rgba(${90+r()*62|0},${98+r()*58|0},${100+r()*56|0},${.22+r()*.36})`;
      const s=6+r()*34; x.fillRect(r()*w,r()*h,s,s*(.4+r()*.8));
    }
    for(let i=0;i<7;i++){ x.fillStyle=`rgba(46,58,62,${.10+r()*.14})`; x.fillRect(r()*w,0,3+r()*10,h); }
    grit(x,w,h,29,1400,.02,.12,true);
    grit(x,w,h,31,600,.02,.09,false);
  });
  TEX.hull=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#d5dcdc'; x.fillRect(0,0,w,h);
    x.fillStyle='#9fc6d1'; x.fillRect(0,h*.54,w,h*.28);
    x.fillStyle='#2f3d40'; x.fillRect(0,h*.49,w,7);
    const r=rng(41);
    for(let i=0;i<260;i++){
      x.fillStyle=`rgba(${60+r()*70|0},${70+r()*60|0},${70+r()*60|0},${.04+r()*.18})`;
      x.fillRect(r()*w,h*.5+r()*h*.5,6+r()*40,2+r()*5);
    }
    grit(x,w,h,43,700,.02,.08,true);
  });
  TEX.plaster=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#a3937b'; x.fillRect(0,0,w,h);
    const r=rng(59);
    for(let i=0;i<460;i++){
      x.fillStyle=`rgba(${120+r()*70|0},${104+r()*60|0},${82+r()*54|0},${.16+r()*.3})`;
      x.fillRect(r()*w,r()*h,10+r()*48,6+r()*30);
    }
    grit(x,w,h,61,1100,.02,.1,true);
  });
  // a soft falloff disc — without a map a sprite draws as a hard white square
  TEX.glow=makeTex(128,128,(x,w,h)=>{
    const g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(.28,'rgba(255,255,255,.55)');
    g.addColorStop(.62,'rgba(255,255,255,.14)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g; x.fillRect(0,0,w,h);
  });

  // drowned flesh: grey-green, blotched, with veins showing through
  TEX.flesh=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#7e8574'; x.fillRect(0,0,w,h);
    const r=rng(131);
    for(let i=0;i<300;i++){
      const g=r();
      x.fillStyle = g>.72 ? `rgba(${(96+r()*30)|0},${(104+r()*26)|0},${(84+r()*22)|0},${.25+r()*.4})`
                          : `rgba(${(58+r()*28)|0},${(64+r()*26)|0},${(52+r()*22)|0},${.2+r()*.4})`;
      const s=8+r()*46;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*(.4+r()*.7),r()*3,0,6.28); x.fill();
    }
    for(let i=0;i<46;i++){                       // veins
      x.strokeStyle=`rgba(${(52+r()*26)|0},${(40+r()*24)|0},${(58+r()*30)|0},${.16+r()*.26})`;
      x.lineWidth=.8+r()*1.6;
      x.beginPath();
      let px=r()*w, py=r()*h;
      x.moveTo(px,py);
      for(let k=0;k<5;k++){ px+=(r()-.5)*50; py+=(r()-.5)*50; x.lineTo(px,py); }
      x.stroke();
    }
    for(let i=0;i<24;i++){                       // wounds
      x.fillStyle=`rgba(${(72+r()*44)|0},${(14+r()*14)|0},${(12+r()*12)|0},${.3+r()*.45})`;
      const s=3+r()*13;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*(.35+r()*.5),r()*3,0,6.28); x.fill();
    }
    grit(x,w,h,137,600,.02,.12,true);
  });
  // what is left of their clothes
  TEX.rag=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#3a352c'; x.fillRect(0,0,w,h);
    const r=rng(149);
    for(let i=0;i<220;i++){
      x.fillStyle=`rgba(${(30+r()*40)|0},${(28+r()*34)|0},${(24+r()*28)|0},${.3+r()*.5})`;
      x.fillRect(r()*w,r()*h,8+r()*44,4+r()*26);
    }
    for(let i=0;i<30;i++){                       // dried blood down the front
      x.fillStyle=`rgba(${(60+r()*40)|0},${(12+r()*12)|0},${(10+r()*10)|0},${.22+r()*.4})`;
      x.fillRect(r()*w,r()*h,3+r()*10,14+r()*54);
    }
    grit(x,w,h,151,700,.02,.14,true);
  });

  // ---- water ----------------------------------------------------------
  // ripple bands, drawn three times side by side so the tile has no seam.
  // this canvas is both the colour and the bump map: without it the sea is a
  // flat painted plane, and a flat plane never looks like water
  TEX.water=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#2f6f88'; x.fillRect(0,0,w,h);
    const r=rng(41);
    for(let i=0;i<220;i++){
      const y=r()*h, len=16+r()*95, a=.04+r()*.15, x0=r()*w;
      const up=r()<.5;
      x.strokeStyle=up?`rgba(196,231,240,${a})`:`rgba(6,38,56,${a})`;
      x.lineWidth=.5+r()*2.1;
      const d1=-3+r()*6, d2=-3+r()*6;
      for(const off of [-w,0,w]){
        x.beginPath(); x.moveTo(x0+off,y);
        x.bezierCurveTo(x0+off+len*.33,y+d1,x0+off+len*.66,y+d2,x0+off+len,y);
        x.stroke();
      }
    }
    grit(x,w,h,7,1100,.02,.06,false);
    grit(x,w,h,8,900,.02,.06,true);
  });
  // how far the shallows reach up the sand before they stop being water.
  // read as a greyscale alpha ramp, so the water dissolves into the beach
  // instead of ending on a drawn line
  TEX.shore=makeTex(8,256,(x,w,h)=>{
    const g=x.createLinearGradient(0,0,0,h);
    g.addColorStop(0.00,'#000000');
    g.addColorStop(0.16,'#8c8c8c');
    g.addColorStop(0.38,'#f2f2f2');
    g.addColorStop(0.62,'#ffffff');
    g.addColorStop(0.84,'#6e6e6e');
    g.addColorStop(0.95,'#1c1c1c');
    g.addColorStop(1.00,'#000000');
    x.fillStyle=g; x.fillRect(0,0,w,h);
  });
  // the line of broken water, as blobs rather than a band
  TEX.foam=makeTex(256,64,(x,w,h)=>{
    x.fillStyle='#000'; x.fillRect(0,0,w,h);
    const r=rng(19);
    for(let i=0;i<300;i++){
      const cx=r()*w, cy=h*(.24+r()*.54), rad=2+r()*14, a=.22+r()*.62;
      const g=x.createRadialGradient(cx,cy,0,cx,cy,rad);
      g.addColorStop(0,`rgba(255,255,255,${a})`);
      g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g; x.beginPath(); x.arc(cx,cy,rad,0,6.29); x.fill();
    }
  });
  // ---- what people here were wearing when it happened ----------------
  // the red-and-white ghutra: a crosshatch, then sun, then everything that
  // has happened to it since
  TEX.shemagh=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#e9e4d8'; x.fillRect(0,0,w,h);
    const r=rng(23), step=32;
    x.strokeStyle='#b23b30';
    for(let i=0;i<=w;i+=step){
      x.lineWidth=(i%(step*2)===0)?7:2.5;
      x.beginPath(); x.moveTo(i,0); x.lineTo(i,h); x.stroke();
      x.beginPath(); x.moveTo(0,i); x.lineTo(w,i); x.stroke();
    }
    x.globalAlpha=.30;                       // the knots where the weave crosses
    for(let i=step/2;i<w;i+=step) for(let j=step/2;j<h;j+=step){
      x.fillStyle='#b23b30'; x.fillRect(i-2,j-2,4,4);
    }
    x.globalAlpha=1;
    for(let i=0;i<220;i++){                  // dust, sweat, and worse
      const a=.05+r()*.22;
      x.fillStyle=r()<.72?`rgba(120,104,78,${a})`:`rgba(96,20,14,${a})`;
      const s=6+r()*40;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*(.4+r()*.7),r()*3,0,6.28); x.fill();
    }
    grit(x,w,h,31,2200,.03,.12,true);
  });
  // the plain white one, and the thobe: the same cloth at different wear
  TEX.thobe=makeTex(256,256,(x,w,h)=>{
    x.fillStyle='#ddd8ca'; x.fillRect(0,0,w,h);
    const r=rng(47);
    for(let i=0;i<w;i+=3){                   // a woven grain, very fine
      x.fillStyle=`rgba(0,0,0,${.02+r()*.03})`;
      x.fillRect(i,0,1,h);
    }
    for(let i=0;i<180;i++){
      const a=.06+r()*.30;
      x.fillStyle=r()<.62?`rgba(122,106,80,${a})`:`rgba(88,17,12,${a})`;
      const s=8+r()*54;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*(.35+r()*.8),r()*3,0,6.28); x.fill();
    }
    // the hem drags: the bottom of a thobe is always the filthiest part
    const g2=x.createLinearGradient(0,h*.55,0,h);
    g2.addColorStop(0,'rgba(60,48,34,0)'); g2.addColorStop(1,'rgba(48,38,26,.55)');
    x.fillStyle=g2; x.fillRect(0,h*.55,w,h*.45);
    grit(x,w,h,53,1800,.02,.09,true);
  });
  // palm bark: stacked frond scars, the way a trunk actually grows
  TEX.bark=makeTex(128,256,(x,w,h)=>{
    x.fillStyle='#6b5a44'; x.fillRect(0,0,w,h);
    const r=rng(67);
    for(let y=0;y<h;y+=13){
      const off=(y/13)%2?6:0;
      for(let i=-1;i<w/22+1;i++){
        x.fillStyle=`rgba(${58+r()*40|0},${46+r()*32|0},${32+r()*22|0},1)`;
        x.fillRect(i*22+off,y,19,10);
        x.fillStyle='rgba(0,0,0,.28)';
        x.fillRect(i*22+off,y+9,19,3);
      }
    }
    grit(x,w,h,71,2400,.03,.14,true);
    grit(x,w,h,72,900,.02,.07,false);
  });

  TEX.sand=makeTex(512,512,(x,w,h)=>{

    x.fillStyle='#6d6154'; x.fillRect(0,0,w,h);
    const r=rng(71);
    for(let i=0;i<9000;i++){
      const g=r();
      x.fillStyle = g>.88 ? `rgba(206,214,216,${.2+r()*.5})`
                 : g>.56 ? `rgba(52,42,34,${.25+r()*.45})`
                         : `rgba(94,82,68,${.18+r()*.4})`;
      const s=1.5+r()*5;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*.72,r()*3,0,6.28); x.fill();
    }
  });
  TEX.dirt=makeTex(512,512,(x,w,h)=>{
    x.fillStyle='#6a5943'; x.fillRect(0,0,w,h);
    const r=rng(83);
    for(let i=0;i<6200;i++){
      x.fillStyle=`rgba(${(58+r()*72)|0},${(46+r()*60)|0},${(32+r()*46)|0},${.22+r()*.42})`;
      const s=1.5+r()*6;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*.7,0,0,6.28); x.fill();
    }
    for(let i=0;i<220;i++){ x.fillStyle=`rgba(198,206,204,${.08+r()*.2})`; x.fillRect(r()*w,r()*h,2,2); }
  });
  // market floor: wet earth gone sour — brine stains, scales, slick patches
  TEX.rot=makeTex(512,512,(x,w,h)=>{
    x.fillStyle='#5c5236'; x.fillRect(0,0,w,h);
    const r=rng(173);
    for(let i=0;i<5200;i++){
      x.fillStyle=`rgba(${(52+r()*60)|0},${(48+r()*52)|0},${(30+r()*40)|0},${.22+r()*.42})`;
      const s=1.5+r()*6;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*.7,0,0,6.28); x.fill();
    }
    for(let i=0;i<70;i++){                       // slicks of brine and oil
      x.fillStyle=`rgba(${(58+r()*40)|0},${(70+r()*46)|0},${(52+r()*36)|0},${.16+r()*.26})`;
      const s=16+r()*70;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*(.4+r()*.5),r()*3,0,6.28); x.fill();
    }
    for(let i=0;i<40;i++){                       // the green of something turning
      x.fillStyle=`rgba(${(72+r()*34)|0},${(86+r()*40)|0},${(48+r()*30)|0},${.18+r()*.3})`;
      const s=10+r()*38;
      x.beginPath(); x.ellipse(r()*w,r()*h,s,s*.6,r()*3,0,6.28); x.fill();
    }
    for(let i=0;i<420;i++){                      // scales trodden into the ground
      x.fillStyle=`rgba(${(186+r()*60)|0},${(196+r()*54)|0},${(190+r()*54)|0},${.12+r()*.3})`;
      x.fillRect(r()*w,r()*h,2,1.5);
    }
    grit(x,w,h,179,900,.02,.1,true);
  });

  TEX.tile=makeTex(512,512,(x,w,h)=>{
    x.fillStyle='#79838a'; x.fillRect(0,0,w,h);
    const r=rng(97);
    for(let gy=0;gy<4;gy++) for(let gx=0;gx<4;gx++){
      const px=gx*128, py=gy*128;
      x.fillStyle=`rgb(${(106+r()*26)|0},${(114+r()*24)|0},${(118+r()*24)|0})`;
      x.fillRect(px+5,py+5,118,118);
      for(let i=0;i<160;i++){
        x.fillStyle=`rgba(${(70+r()*60)|0},${(78+r()*58)|0},${(82+r()*56)|0},${.14+r()*.26})`;
        x.fillRect(px+6+r()*112,py+6+r()*112,2+r()*8,2+r()*5);
      }
    }
    x.fillStyle='rgba(28,34,38,.8)';
    for(let i=0;i<=4;i++){ x.fillRect(0,i*128-2,w,5); x.fillRect(i*128-2,0,5,h); }
    grit(x,w,h,101,900,.02,.09,true);
  });
}

  g.infected.push(mkInfected(1700,420,strain,.85));
  boat(g,150,220,260,96,0.25);
  g.P.x=1700; g.P.y=900; g.P.a=Math.PI;
  if(g.P.weapon.key==='none') g.P.weapon=WEAPONS.spear;   // nobody walks into the dark unarmed
  g.exit={x:20,y:120,w:200,h:180,locked:false};
}

/* ---------------- input ---------------- */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k]=true;
  if(k==='escape') closeBook();
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

let moveP=null,lookP=null;
stage.addEventListener('pointerdown',e=>{
  if(!running || e.target.closest('button')) return;
  stage.setPointerCapture(e.pointerId);
  stage.focus({preventScroll:true});
  const r=stage.getBoundingClientRect();
  const lx=e.clientX-r.left, ly=e.clientY-r.top;
  const rec={id:e.pointerId,ox:lx,oy:ly,x:lx,y:ly};
  if(lx<r.width/2) moveP=rec; else lookP=rec;
});
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect();
  const lx=e.clientX-r.left, ly=e.clientY-r.top;
  if(moveP&&moveP.id===e.pointerId){ moveP.x=lx; moveP.y=ly; }
  if(lookP&&lookP.id===e.pointerId){ lookP.x=lx; lookP.y=ly; }
});
function dropP(e){
  if(moveP&&moveP.id===e.pointerId) moveP=null;
  if(lookP&&lookP.id===e.pointerId) lookP=null;
}
stage.addEventListener('pointerup',dropP);
stage.addEventListener('pointercancel',dropP);

/* ---------- on-screen controls ---------- */
let pickWanted=false, dropWanted=false, stabWanted=false;
let stickVec={f:0,s:0};

function bindStick(){
  const el=document.getElementById('stick'), knob=document.getElementById('knob');
  let id=null;
  const R=44;
  const set=(dx,dy)=>{
    const d=Math.hypot(dx,dy);
    const k=d>R? R/d : 1;
    const x=dx*k, y=dy*k;
    knob.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    // a dead zone keeps a resting thumb from creeping forward
    const mag=Math.min(1,d/R), live=mag>0.16;
    stickVec = live ? {f:-y/R, s:x/R} : {f:0,s:0};
  };
  const start=e=>{
    if(id!==null) return;
    id=e.pointerId;
    el.classList.add('live');
    const r=el.getBoundingClientRect();
    set(e.clientX-(r.left+r.width/2), e.clientY-(r.top+r.height/2));
    // capture is a convenience, not a requirement — never let it abort the grab
    try{ el.setPointerCapture(id); }catch(err){}
    stage.focus({preventScroll:true});
    e.preventDefault();
  };
  const move=e=>{
    if(e.pointerId!==id) return;
    const r=el.getBoundingClientRect();
    set(e.clientX-(r.left+r.width/2), e.clientY-(r.top+r.height/2));
    e.preventDefault();
  };
  const end=e=>{
    if(e.pointerId!==id) return;
    id=null; el.classList.remove('live');
    knob.style.transform='translate(0,0)';
    stickVec={f:0,s:0};
  };
  el.addEventListener('pointerdown',start);
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('lostpointercapture',end);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ---------- phone tilt adds a little head movement ---------- */
let tilt={on:false, base:null, pitch:0, roll:0};
function bindTilt(){
  if(!window.DeviceOrientationEvent) return;
  addEventListener('deviceorientation',e=>{
    if(e.beta===null && e.gamma===null) return;
    if(tilt.base===null) tilt.base={b:e.beta||0, g:e.gamma||0};   // wherever they are holding it now is level
    const db=(e.beta||0)-tilt.base.b, dg=(e.gamma||0)-tilt.base.g;
    // a nudge, never a takeover: dragging to look must stay in charge
    tilt.pitch = Math.max(-.22,Math.min(.22, db*0.0055));
    tilt.roll  = Math.max(-.10,Math.min(.10, dg*0.0022));
    tilt.on=true;
  });
}
function askTilt(){
  const D=window.DeviceOrientationEvent;
  if(D && typeof D.requestPermission==='function'){
    D.requestPermission().then(s=>{ if(s==='granted') bindTilt(); }).catch(()=>{});
  } else bindTilt();
}

function padWanted(){
  // a landscape phone is ~812 wide, so width alone is not the test — but it is a
  // useful fallback where pointer detection lies
  return matchMedia('(pointer:coarse)').matches || innerWidth < 900;
}
function bindPad(){
  const apply=()=>stage.classList.toggle('touch',padWanted());
  apply();
  addEventListener('resize',apply);
  addEventListener('orientationchange',apply);
  const press=(el,on)=>{
    const k=el.dataset.k;
    el.classList.toggle('on',on);
    // every button owns its own pointer, so run + jump + stick all hold at once
    if(k==='run'){ keys['shift']=on; return; }
    if(k==='jump'){ keys[' ']=on; return; }
    if(k==='pick'){ if(on) pickWanted=true; return; }
    if(k==='drop'){ if(on) dropWanted=true; return; }
    if(k==='stab'){ if(on) stabWanted=true; return; }
    keys[k]=on;
  };
  document.querySelectorAll('.acts .k').forEach(el=>{
    // pointer events so a thumb can slide off a button without sticking it down
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); press(el,true); try{ el.setPointerCapture(e.pointerId); }catch(err){} stage.focus({preventScroll:true}); });
    el.addEventListener('pointerup',  e=>{ e.preventDefault(); press(el,false); });
    el.addEventListener('pointercancel',()=>press(el,false));
    el.addEventListener('lostpointercapture',()=>press(el,false));
    el.addEventListener('contextmenu',e=>e.preventDefault());
  });
}

function readMove(){
  let f=0,s=0;
  if(keys['w']||keys['arrowup']) f+=1;
  if(keys['s']||keys['arrowdown']) f-=1;
  if(keys['d']) s+=1;
  if(keys['a']) s-=1;
  if(moveP){
    const vx=moveP.x-moveP.ox, vy=moveP.y-moveP.oy, d=Math.hypot(vx,vy);
    if(d>10){ f+=-vy/d; s+=vx/d; }
  }
  f+=stickVec.f; s+=stickVec.s;
  const m=Math.hypot(f,s);
  return m>1?{f:f/m,s:s/m}:{f,s};
}
function readTurn(dt){
  let r=0;
  if(keys['arrowleft']) r-=1;
  if(keys['arrowright']) r+=1;
  let turn=r*2.1*dt;
  if(lookP){ turn+=(lookP.x-lookP.ox)*0.0042; lookP.ox=lookP.x; }
  return turn;
}

/* ---------------- collision ---------------- */
function hitsRect(cx,cy,rad,o){
  const nx=Math.max(o.x,Math.min(cx,o.x+o.w));
  const ny=Math.max(o.y,Math.min(cy,o.y+(o.d!==undefined?o.d:o.h)));
  return (cx-nx)**2+(cy-ny)**2 < rad*rad;
}
function inRect(cx,cy,o){ return cx>o.x&&cx<o.x+o.w&&cy>o.y&&cy<o.y+o.h; }
/* anything shorter than your feet is no longer in the way — that is what jumping buys */
function slide(g,e,dx,dy){
  const foot=e.z||0;
  const rs=g.solids.filter(o=>o.h>foot+4);
  const stuck=rs.some(o=>hitsRect(e.x,e.y,e.r,o));
  e.x+=dx;
  if(!stuck) for(const o of rs) if(hitsRect(e.x,e.y,e.r,o)){ e.x-=dx; break; }
  e.y+=dy;
  if(!stuck) for(const o of rs) if(hitsRect(e.x,e.y,e.r,o)){ e.y-=dy; break; }
  e.x=Math.max(e.r,Math.min(g.W-e.r,e.x));
  e.y=Math.max(e.r,Math.min(g.H-e.r,e.y));
}
function toCam(g,wx,wy){
  const dx=wx-g.P.x, dy=wy-g.P.y;
  const ca=Math.cos(g.P.a), sa=Math.sin(g.P.a);
  return {d:dx*ca+dy*sa, s:-dx*sa+dy*ca};
}
function panOf(g,e){ const c=toCam(g,e.x,e.y); return Math.max(-1,Math.min(1,c.s/(Math.abs(c.d)+40))); }
function toast(g,m){ g.toast=m; g.toastT=2.6; }

/* ---------------- update ---------------- */
function update(dt){
  const g=G,P=g.P;
  if(g.over) return;

  P.a+=readTurn(dt);
  const mv=readMove();
  const ca=Math.cos(P.a), sa=Math.sin(P.a);
  // running is fast and loud — it buys distance and costs concealment
  const sprint = !!(keys['shift']) && !P.hidden;
  P.running = sprint && (Math.abs(mv.f)+Math.abs(mv.s))>.05;
  const spd = sprint ? 178 : 108;
  slide(g,P,(ca*mv.f-sa*mv.s)*spd*dt,(sa*mv.f+ca*mv.s)*spd*dt);
  // jump
  if((keys[' ']||keys['spacebar']) && !P.air){ P.vz=205; P.air=true; jumpGrunt(); }
  if(P.air){
    P.vz-=560*dt; P.z+=P.vz*dt;
    if(P.z<=0){ P.z=0; P.vz=0; P.air=false; footstep(g.screen,.05,0); }
  }

  const moving=Math.hypot(mv.f,mv.s)>.05;
  P.bob = (moving && !P.air) ? Math.sin(t*(P.running?16:11))*(P.running?.034:.022) : P.bob*.9;
  P.breath += dt*(1.4+g.dread*2.2);
  P.iframe=Math.max(0,P.iframe-dt);
  P.hidden=g.covers.some(c=>inRect(P.x,P.y,c));

  // ---- reach out and take hold of whatever is nearest ----
  if(pickWanted){
    let best=null,bd=1e9;
    const consider=(o,kind)=>{ const d=Math.hypot(P.x-o.x,P.y-o.y); if(d<72&&d<bd){bd=d;best={o,kind};} };
    for(const it of g.items) if(!it.taken) consider(it,'item');
    for(const s of g.survivors) if(s.state==='trapped') consider(s,'survivor');
    for(const z of g.infected) consider(z,'infected');
    if(best){
      if(best.kind==='infected'){
        // you grabbed the wrong thing in the dark, and it grabs back
        toast(g,'أمسكتَ واحداً منهم');
        best.o.aggro=3.6; best.o.seen=true; best.o.lunge=1.5;
        zShriek(bd,panOf(g,best.o));
        if(P.iframe<=0) damage();
      } else if(best.kind==='survivor'){
        best.o.state='follow'; best.o.voice=1.2;
        toast(g,best.o.name+' معك الآن');
        callOut(bd,panOf(g,best.o),false); hush(.012,.5);
      } else {
        takeItem(g,best.o);
      }
    }
    pickWanted=false;
  }
  // ---- set it down where you stand ----
  if(dropWanted){
    dropWanted=false;
    if(P.weapon.key!=='none'){
      const k=P.weapon.key;
      g.items.push({x:P.x+Math.cos(P.a)*22,y:P.y+Math.sin(P.a)*22,kind:k,taken:false,fresh:true});
      P.weapon=WEAPONS.none; carried.weapon='none'; P.pickup=0;
      toast(g,'أنزلتَ سلاحك');
      beep(180,.09,.04);
    }
  }

  for(const it of g.items){
    if(it.taken) continue;
    if(it.fresh){ if(Math.hypot(P.x-it.x,P.y-it.y)>44) it.fresh=false; continue; }  // don't re-grab it instantly
    if(Math.hypot(P.x-it.x,P.y-it.y)<34) takeItem(g,it);
  }
  P.swing=Math.max(0,P.swing-dt);
  P.atkCd=Math.max(0,P.atkCd-dt);
  P.pickup=Math.max(0,P.pickup-dt);
  P.boost=Math.max(0,P.boost-dt);

  let following=0;
  for(const s of g.survivors){
    if(s.state==='down'||s.state==='out'||s.state==='left') continue;
    s.hurtCd=Math.max(0,s.hurtCd-dt); s.voice-=dt; s.wave+=dt*2.4;
    const ds=Math.hypot(P.x-s.x,P.y-s.y), pan=panOf(g,s);
    if(s.state==='trapped'){
      if(s.voice<=0){ s.voice=3.2+Math.random()*3; callOut(ds,pan,true); }
      if(ds<30){ s.state='follow'; s.voice=1.2; toast(g,s.name+' معك الآن'); callOut(ds,pan,false); hush(.012,.5); }
    } else {
      following++;
      if(s.voice<=0){ s.voice=5+Math.random()*5; callOut(ds,pan,false); }
      if(ds>34){
        const a=Math.atan2(P.y-s.y,P.x-s.x);
        slide(g,s,Math.cos(a)*Math.min(104,62+ds*.45)*dt,Math.sin(a)*Math.min(104,62+ds*.45)*dt);
        s.gait+=dt*7;
      } else s.gait+=dt*1.6;
    }
  }
  g.following=following;
  const noise=(1+following*0.24)*(P.running?1.45:1);

  // ---- the stab: only offered when one is genuinely within arm's length ----
  let stabTarget=null, stabBest=1e9;
  for(const z of g.infected){
    const c=toCam(g,z.x,z.y);
    const d=Math.hypot(P.x-z.x,P.y-z.y);
    if(d<58 && c.d>0 && Math.abs(c.s/Math.max(1,c.d))<.70 && d<stabBest){ stabBest=d; stabTarget=z; }
  }
  // the button shows whenever one is within arm's length; what it does depends
  // on whether you are holding anything
  g.stabReady = !!stabTarget;
  g.stabArmed = P.weapon.key!=='none';
  if(stabWanted){
    stabWanted=false;
    if(stabTarget && P.atkCd<=0){
      const a=Math.atan2(stabTarget.y-P.y,stabTarget.x-P.x);
      if(g.stabArmed){
        stabTarget.hp -= P.weapon.dmg+2;            // committed, and it hurts
        P.atkCd = P.weapon.cd*1.6; P.swing=P.weapon.cd;
        stabTarget.stagger=.55; stabTarget.hitCd=.4;
        counters.engage += 2.0;
        g.shake=.10; gruntEffort();
        const sp=panOf(g,stabTarget);
        swingSnd(P.weapon.key,sp); impact(P.weapon.key,sp,stabTarget.hp<=0); zHurt(sp);
        if(stabTarget.hp<=0) stabTarget.dead=true;
      } else {
        // bare hands: you cannot hurt it, only buy yourself a second
        P.atkCd=.75; P.swing=.4;
        stabTarget.stagger=.42; stabTarget.atk=1.2;
        stabTarget.x+=Math.cos(a)*30; stabTarget.y+=Math.sin(a)*30;
        counters.engage += .5;
        g.shake=.06; gruntEffort();
        impact('none',panOf(g,stabTarget),false);
        toast(g,'دفعته بيديك');
      }
    }
  }

  let nearest=1e9, behind=0;
  for(const z of g.infected){
    z.hitCd=Math.max(0,z.hitCd-dt); z.stagger=Math.max(0,z.stagger-dt);
    z.atk=Math.max(0,z.atk-dt); z.ring+=dt; z.moan-=dt;
    const d=Math.hypot(P.x-z.x,P.y-z.y);
    nearest=Math.min(nearest,d);
    const c=toCam(g,z.x,z.y);
    const inView=c.d>0 && Math.abs(c.s/Math.max(1,c.d))<.62 && d<340;
    z.watched=inView&&!P.hidden;
    if(d<190 && (c.d<=0 || Math.abs(c.s/Math.max(1,c.d))>.78)) behind=Math.max(behind,1-d/190);

    const range=z.sense*noise;
    const canSense = z.strain==='stealth' ? d<range : (d<range && !P.hidden);
    const wasSeen=z.seen;
    if(canSense) z.aggro=3.6; else z.aggro=Math.max(0,z.aggro-dt);
    z.seen=z.aggro>0;
    if(z.seen&&!wasSeen){ zShriek(d,panOf(g,z)); hush(.01,.55); }

    z.lunge=Math.max(0,z.lunge-dt);
    let mul=1;
    if(z.watched) mul = d<170 ? .80 : (z.strain==="flee"?.56:.44);
    else if(z.seen) mul=2.15;
    if(z.seen&&d<175&&z.lunge<=0) z.lunge=1.5;
    if(z.lunge>0.9) mul*=1.7;

    z.gait+=dt*(z.seen&&!z.watched?7.5:2.2);
    if(z.stagger<=0){
      if(z.seen||z.watched){
        const a=Math.atan2(P.y-z.y,P.x-z.x);
        slide(g,z,Math.cos(a)*z.speed*mul*dt,Math.sin(a)*z.speed*mul*dt);
        z.face=a;
      } else {
        z.wander+=(Math.random()-.5)*dt*3;
        const hx=z.home.x-z.x, hy=z.home.y-z.y;
        const pull=Math.hypot(hx,hy)>150?Math.atan2(hy,hx):z.wander;
        slide(g,z,Math.cos(pull)*24*dt,Math.sin(pull)*24*dt);
        z.face=pull;
      }
    }

    const wep=P.weapon;
    const facing=c.d>0&&Math.abs(c.s/Math.max(1,c.d))<.55;
    if(wep.dmg>0&&facing&&d<P.r+z.r+wep.reach&&P.atkCd<=0){
      z.hp-=wep.dmg; P.atkCd=wep.cd; P.swing=wep.cd*.75; z.stagger=.34; z.hitCd=.3;
      const a=Math.atan2(z.y-P.y,z.x-P.x);
      z.x+=Math.cos(a)*18; z.y+=Math.sin(a)*18;
      counters.engage+=1.2; g.shake=.05;
      const zp=panOf(g,z);
      gruntEffort(); swingSnd(wep.key,zp); impact(wep.key,zp,z.hp<=0); zHurt(zp);
      if(z.hp<=0){ z.dead=true; }
    }
    if(d<P.r+z.r+5&&P.iframe<=0&&z.stagger<=0&&z.atk<=0){ z.atk=1.5; damage(); }

    if(z.seen&&!z.dead){
      const away=((P.x-z.x)*ca+(P.y-z.y)*sa)*mv.f;
      if(away>0.2&&moving) counters.flee+=dt*1.25;
    }
    if(!z.dead&&P.hidden&&d<z.sense*1.45) counters.stealth+=dt*1.0;
    if(z.moan<=0&&Math.random()<dt*(z.seen?.9:.35)){ z.moan=2.6; zGrowl(d,panOf(g,z)); }

    for(const s of g.survivors){
      if(s.state!=='follow') continue;
      if(Math.hypot(s.x-z.x,s.y-z.y)<s.r+z.r+5&&s.hurtCd<=0){
        s.hp-=1; s.hurtCd=1.3;
        const pan=panOf(g,s);
        if(s.hp<=0){ s.state='down'; markLost(s.name); scream(pan); hush(.004,1.1); toast(g,'فقدتَ '+s.name); }
        else callOut(0,pan,true);
      }
    }
  }
  g.infected=g.infected.filter(z=>{
    if(z.dead) zDeath(Math.hypot(P.x-z.x,P.y-z.y),panOf(g,z));
    return !z.dead;
  });

  if(moving){
    P.step+=dt*(P.running?5.2:3.1);
    if(P.step>=1){
      P.step=0; P.footL=!P.footL;
      footstep(g.screen,(P.running?.155:.10)+Math.random()*.03,P.footL?-.22:.22);
    }
  }
  breathing(dt,moving?1:0,g.dread,P.hp<=1?1:0);

  const target=nearest<1e8?Math.max(0,1-nearest/300):0;
  g.dread+=(target-g.dread)*Math.min(1,dt*2.4);
  heartbeat(dt,g.dread);
  ambience(dt,g.screen);
  g.behind=behind;

  let hunted=false,eyed=false;
  for(const z of g.infected){ if(z.seen) hunted=true; if(z.watched) eyed=true; }
  let want=0.70;
  if(eyed) want=Math.max(want,0.84);
  if(hunted) want=Math.max(want,1.0);
  want=Math.max(want,0.72+g.dread*0.28);
  musicSet(dt,Math.min(1,want));

  g.lightJitter += ((1-Math.random()*g.dread*.5)-g.lightJitter)*Math.min(1,dt*9);
  if(Math.random()<dt*g.dread*1.4) g.lightJitter=.45;

  if(g.exit&&!g.exit.locked&&inRect(P.x,P.y,g.exit)){
    for(const s of g.survivors) if(s.state==='follow'){ s.state='out'; markSaved(s.name); }
    for(const s of g.survivors) if(s.state==='trapped'){ s.state='left'; markLost(s.name); }
    finishScreen();
  }

  // clearing the place outright is the other way through: everyone found, nothing
  // left standing. it costs more and it is louder — but no one gets left behind.
  if(!g.cleared && g.survivors.length){
    const nothingLeft = g.infected.length===0;
    const everyoneWithYou = g.survivors.every(s=>s.state==='follow'||s.state==='out');
    if(nothingLeft && everyoneWithYou){
      g.cleared=true; g.clearT=1.9;
      toast(g,'طهّرتَ المكان · لم تترك أحداً');
      hush(.004,1.2);
    }
  }
  if(g.cleared){
    g.clearT-=dt;
    if(g.clearT<=0){
      g.cleared=false;
      for(const s of g.survivors) if(s.state==='follow'){ s.state='out'; markSaved(s.name); }
      finishScreen();
      return;
    }
  }
  g.toastT=Math.max(0,g.toastT-dt);
  g.shake=Math.max(0,g.shake-dt*.35);
}

/* ---------------- carrying and using things ---------------- */
const CONSUMABLE={medkit:true, energy:true};
function takeItem(g,it){
  const P=g.P;
  it.taken=true;
  if(CONSUMABLE[it.kind]){
    carried[it.kind]=Math.min(9,(carried[it.kind]||0)+1);
    toast(g, it.kind==='medkit' ? 'عدّة إسعاف' : 'مشروب طاقة');
    beep(420,.07,.045);
  } else {
    P.weapon=WEAPONS[it.kind]||WEAPONS.oar;
    carried.weapon=P.weapon.key;      // the choice sticks until you make another
    P.pickup=1.4;
    beep(300,.08,.05);
  }
  if(g.screen===1 && g.exit) g.exit.locked=false;
  hudSig='';
}
function useItem(kind){
  if(!G||!running||G.over) return;
  const P=G.P;
  if(!carried[kind]) return;
  if(kind==='medkit'){
    if(P.hp>=4){ toast(G,'لستَ بحاجة إليها الآن'); return; }
    carried.medkit--;
    P.hp=Math.min(4,P.hp+2);

   WebGL scene — real geometry, real lights, real shadows

let renderer,scene,camera,torch,hemi,ambientL,signLight,gateLight,viewModel,lantern,lanternMesh,lanternGlass,seaFoam,seaTex;
let dyn={infected:[],survivors:[],items:[]};
let texCache=new Map();

const nrmCache=new Map();
function nrm(canvas,repeat,strength){
  const key=(canvas.__id||(canvas.__id=Math.random()))+'|n'+repeat+'|'+(strength||1);
  if(nrmCache.has(key)) return nrmCache.get(key);
  const w=canvas.width,h=canvas.height;
  const src=canvas.getContext('2d').getImageData(0,0,w,h).data;
  const lum=new Float32Array(w*h);
  for(let i=0;i<w*h;i++) lum[i]=(src[i*4]*.299+src[i*4+1]*.587+src[i*4+2]*.114)/255;
  const at=(x,y)=>lum[((y%h)+h)%h*w+(((x%w)+w)%w)];
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const ctx=out.getContext('2d'), img=ctx.createImageData(w,h), S=(strength||1)*2.4;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const dx=(at(x-1,y-1)+2*at(x-1,y)+at(x-1,y+1))-(at(x+1,y-1)+2*at(x+1,y)+at(x+1,y+1));
    const dy=(at(x-1,y-1)+2*at(x,y-1)+at(x+1,y-1))-(at(x-1,y+1)+2*at(x,y+1)+at(x+1,y+1));
    const nx=dx*S, ny=dy*S, l=Math.sqrt(nx*nx+ny*ny+1), i=(y*w+x)*4;
    img.data[i]=((nx/l)*.5+.5)*255; img.data[i+1]=((ny/l)*.5+.5)*255;
    img.data[i+2]=((1/l)*.5+.5)*255; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(out);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat,repeat); t.anisotropy=4;
  nrmCache.set(key,t);
  return t;
}
function tex(canvas,repeat){

  const key=canvas.__id||(canvas.__id=Math.random());
  const k=key+'|'+repeat;
  if(texCache.has(k)) return texCache.get(k);
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(repeat,repeat);
  t.anisotropy=4;
  texCache.set(k,t);
  return t;
}

let envRT=null;
const ENV_SKY={
  sunset:[[0,'#131a33'],[.40,'#4a3d5c'],[.52,'#8a4f55'],[.60,'#d9743d'],[.65,'#f2a24a'],[.69,'#3a2a20'],[1,'#15100c']],
  night :[[0,'#04080c'],[.46,'#0a131a'],[.58,'#16242c'],[.64,'#0a0f12'],[1,'#04070a']],
  market:[[0,'#0e0b08'],[.50,'#1a1410'],[.62,'#2a2018'],[.68,'#100c09'],[1,'#080605']],
  beach :[[0,'#25313a'],[.48,'#4a5a63'],[.60,'#65727a'],[.66,'#2c2925'],[1,'#151311']]
};
function buildEnv(g){
  if(!renderer||!THREE.PMREMGenerator) return;
  const key = g.sunset ? 'sunset' : (ENV_SKY[g.sky] ? g.sky : 'beach');
  const c=document.createElement('canvas'); c.width=256; c.height=128;
  const x=c.getContext('2d');
  const grd=x.createLinearGradient(0,0,0,c.height);
  for(const st of ENV_SKY[key]) grd.addColorStop(st[0],st[1]);
  x.fillStyle=grd; x.fillRect(0,0,c.width,c.height);
  x.fillStyle='rgba(0,0,0,0.74)'; x.fillRect(0,0,c.width,c.height);
  try{
    const t=new THREE.CanvasTexture(c);
    t.mapping=THREE.EquirectangularReflectionMapping;
    const pm=new THREE.PMREMGenerator(renderer);
    pm.compileEquirectangularShader();
    const rt=pm.fromEquirectangular(t);
    if(envRT) envRT.dispose();
    envRT=rt; scene.environment=rt.texture;
    pm.dispose(); t.dispose();
  }catch(e){ /* an old driver: the scene simply keeps its direct lighting */ }
}

function disposeScene(){

  if(!scene) return;
  scene.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      const m=Array.isArray(o.material)?o.material:[o.material];
      m.forEach(x=>x.dispose());
    }
  });
}

/* a person, built from real solids so it reads from every angle */
/* the infected: nothing about the proportions is right, and that is the point —
   too tall, arms past the knees, head hung wrong, jaw that does not close */
function makeInfected(){
  const grp=new THREE.Group();
  grp.rotation.order='YXZ';
  // skin that has been in the sun and then in the water: damp in the low
  // places, dry and bleached on the high ones
  const flesh=new THREE.MeshStandardMaterial({map:tex(TEX.flesh,1),
    normalMap:nrm(TEX.flesh,1,1.5), normalScale:new THREE.Vector2(1.1,1.1),
    roughness:.82,metalness:.02,envMapIntensity:.30,color:0x9aa08c});
  const rag=new THREE.MeshStandardMaterial({map:tex(TEX.rag,1),
    normalMap:nrm(TEX.rag,1,1.3), normalScale:new THREE.Vector2(1,1),
    roughness:.97,metalness:0,envMapIntensity:.15,color:0x8e8a80});
  const mk=(geo,mat,x,y,z,parent)=>{
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
    (parent||grp).add(m); return m;
  };

  // spine pivots so the whole upper body can hunch as one piece
  const spine=new THREE.Group(); spine.position.set(0,1.02,0); grp.add(spine);

  const torso=mk(new THREE.CylinderGeometry(.155,.195,.60,9),rag,0,.10,0,spine);
  torso.scale.set(1,1,.72);                        // flattened, starved
  const shoulders=mk(new THREE.SphereGeometry(.185,12,8),rag,0,.38,0,spine);
  shoulders.scale.set(1.25,.52,.75);

  const neck=new THREE.Group(); neck.position.set(0,.46,.03); spine.add(neck);
  const head=mk(new THREE.SphereGeometry(.115,14,12),flesh,0,.06,0,neck);
  head.scale.set(.86,1.22,.95);                    // long, narrow skull
  const jaw=mk(new THREE.BoxGeometry(.10,.075,.085),flesh,0,-.045,.055,neck);
  const mouth=mk(new THREE.BoxGeometry(.085,.055,.02),
    new THREE.MeshBasicMaterial({color:0x0a0605}),0,-.015,.098,neck);

  const eyeMat=new THREE.MeshBasicMaterial({color:0xff2a1e});
  const eg=new THREE.SphereGeometry(.0165,8,6);
  const eL=mk(eg,eyeMat,-.040,.055,.094,neck);
  const eR=mk(eg,eyeMat, .040,.055,.094,neck);
  eL.castShadow=eR.castShadow=false;
  // a faint bloom so the eyes carry through fog and darkness
  const glowMat=new THREE.SpriteMaterial({map:tex(TEX.glow,1),color:0xff2a1e,opacity:.55,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const glow=new THREE.Sprite(glowMat);
  glow.scale.set(.30,.16,1); glow.position.set(0,.055,.10); neck.add(glow);

  // arms hang past the knees
  const armL=new THREE.Group(); armL.position.set(-.215,.36,0); spine.add(armL);
  const armR=new THREE.Group(); armR.position.set( .215,.36,0); spine.add(armR);
  mk(new THREE.CylinderGeometry(.042,.030,.80,7),flesh,0,-.40,0,armL);
  mk(new THREE.CylinderGeometry(.042,.030,.80,7),flesh,0,-.40,0,armR);
  mk(new THREE.SphereGeometry(.050,8,6),flesh,0,-.82,0,armL).scale.set(1,1.5,.6);
  mk(new THREE.SphereGeometry(.050,8,6),flesh,0,-.82,0,armR).scale.set(1,1.5,.6);

  const legL=new THREE.Group(); legL.position.set(-.095,1.00,0); grp.add(legL);
  const legR=new THREE.Group(); legR.position.set( .095,1.00,0); grp.add(legR);
  mk(new THREE.CylinderGeometry(.062,.040,1.00,7),rag,0,-.50,0,legL);
  mk(new THREE.CylinderGeometry(.062,.040,1.00,7),rag,0,-.50,0,legR);

  // ---- and what they were wearing ----------------------------------
  // this is the part that makes them from here and not from anywhere else:
  // a thobe to the ankle, a ghutra held by an agal, an abaya. the cloth is
  // the identity — the anatomy underneath is the same everywhere
  const V=(Math.random()*100)|0;
  const kind = V<42 ? 'thobe' : V<62 ? 'thobe-bare' : V<82 ? 'abaya' : 'stripped';
  const dark = kind==='abaya';
  const cloths=[];
  if(kind!=='stripped'){
    const clothMat=new THREE.MeshStandardMaterial({
      map:tex(TEX.thobe,1), normalMap:nrm(TEX.thobe,1,1.1),
      normalScale:new THREE.Vector2(.9,.9),
      color: dark?0x2a2724:(0xc9c2b0-(Math.random()*0x0a0a0a|0)),
      roughness:.99,metalness:0,envMapIntensity:.12,side:THREE.DoubleSide});
    cloths.push(clothMat);
    // the robe: open at the bottom so it reads as cloth, not a cone of plastic
    const robe=mk(new THREE.CylinderGeometry(.215,.40,1.34,14,1,true),clothMat,0,-.56,0,spine);
    robe.scale.set(1,1,.86);
    // sleeves, wide the way a thobe's are, hanging past the elbow
    for(const arm of [armL,armR]){
      const sl=mk(new THREE.CylinderGeometry(.085,.115,.46,9,1,true),clothMat,0,-.20,0,arm);
      sl.scale.set(1,1,.9);
    }
    // shoulders read as cloth over bone
    const yoke=mk(new THREE.SphereGeometry(.205,12,8),clothMat,0,.36,0,spine);
    yoke.scale.set(1.22,.55,.82);
  }
  if(kind==='thobe'||kind==='abaya'){
    const headMat = dark
      ? new THREE.MeshStandardMaterial({map:tex(TEX.thobe,1),color:0x23201e,
          roughness:.99,envMapIntensity:.1,side:THREE.DoubleSide})
      : new THREE.MeshStandardMaterial({map:tex(Math.random()<.62?TEX.shemagh:TEX.thobe,1),
          normalMap:nrm(TEX.shemagh,1,.9), normalScale:new THREE.Vector2(.7,.7),
          roughness:.97,envMapIntensity:.12,side:THREE.DoubleSide});
    cloths.push(headMat);
    // the cloth over the skull
    const cap=mk(new THREE.SphereGeometry(.132,14,10,0,6.284,0,1.15),headMat,0,.055,0,neck);
    cap.scale.set(1.04,1.12,1.06);
    // and the two panels that fall to the shoulders — the silhouette everyone
    // recognises from across a street
    for(const sx of [-1,1]){
      const p=mk(new THREE.BoxGeometry(.075,.34,.10),headMat,sx*.115,-.10,-.01,neck);
      p.rotation.z=sx*.10; p.rotation.x=-.06;
    }
    const back=mk(new THREE.BoxGeometry(.19,.26,.055),headMat,0,-.06,-.105,neck);
    back.rotation.x=.14;
    if(!dark){                                  // the agal, still holding it on
      const agalMat=new THREE.MeshStandardMaterial({color:0x14110f,roughness:.62,metalness:.05});
      cloths.push(agalMat);
      const ring = typeof THREE.TorusGeometry==='function'
        ? new THREE.TorusGeometry(.126,.019,6,16) : new THREE.CylinderGeometry(.14,.14,.03,14);
      const a1=mk(ring,agalMat,0,.118,0,neck); a1.rotation.x=Math.PI/2;
      const a2=mk(ring,agalMat,0,.156,0,neck); a2.rotation.x=Math.PI/2;
      a2.scale.setScalar(.94);
    }
  }

  return {grp,spine,neck,head,jaw,mouth,armL,armR,legL,legR,eyeMat,glowMat,
          twitch:0,nextTwitch:Math.random()*2,jawOpen:0,mats:[flesh,rag].concat(cloths)};
}

function makeHuman(p){
